<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080b14"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>الصفحة غير موجودة | افـنـدツينا🥀🖤</title>

  <meta
    name="description"
    content="الصفحة التي تبحث عنها غير موجودة."
  >

  <style>
    :root {
      --bg-1: #05060b;
      --bg-2: #0b1020;
      --card: rgba(15, 19, 34, 0.78);
      --border: rgba(255, 255, 255, 0.10);
      --text: #ffffff;
      --muted: #aeb6c8;
      --accent: #9b5cff;
      --accent-2: #ff4fa3;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(155, 92, 255, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 75%,
          rgba(255, 79, 163, 0.14),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          var(--bg-1),
          var(--bg-2)
        );
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.28;
      pointer-events: none;
      animation: float 9s ease-in-out infinite alternate;
    }

    body::before {
      top: -180px;
      right: -120px;
      background: var(--accent);
    }

    body::after {
      bottom: -180px;
      left: -120px;
      background: var(--accent-2);
      animation-delay: -3s;
    }

    @keyframes float {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(30px, -25px, 0) scale(1.08);
      }
    }

    .page {
      width: min(100%, 560px);
      position: relative;
      z-index: 1;
    }

    .card {
      padding: 42px 28px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow:
        0 30px 80px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      animation: cardIn 0.65s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-bottom: 28px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .code {
      display: block;
      margin-bottom: 4px;
      font-size: clamp(86px, 22vw, 150px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -7px;
      background:
        linear-gradient(
          135deg,
          #ffffff,
          #b68cff 48%,
          #ff70b4
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      user-select: none;
    }

    h1 {
      margin-top: 22px;
      font-size: clamp(25px, 6vw, 36px);
      line-height: 1.3;
    }

    .message {
      max-width: 430px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.9;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      min-width: 150px;
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 15px;
      border: 1px solid var(--border);
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .button.primary {
      border-color: transparent;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );
      box-shadow:
        0 12px 30px rgba(155, 92, 255, 0.24);
    }

    .button:hover {
      transform: translateY(-2px);
      background-color: rgba(255, 255, 255, 0.10);
    }

    .button.primary:hover {
      background:
        linear-gradient(
          135deg,
          #a96dff,
          #ff63ad
        );
    }

    .button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.28);
      outline-offset: 3px;
    }

    .footer {
      margin-top: 24px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 34px 20px;
        border-radius: 24px;
      }

      .brand {
        font-size: 16px;
      }

      .message {
        font-size: 15px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main
    class="page"
    aria-labelledby="page-title"
  >

    <section class="card">

      <div
        class="brand"
        aria-label="افـنـدينا"
      >
        افـنـدツينا🥀🖤
      </div>

      <span
        class="code"
        aria-hidden="true"
      >
        404
      </span>

      <h1 id="page-title">
        الصفحة غير موجودة
      </h1>

      <p class="message">
        عذرًا، الصفحة التي تحاول الوصول إليها
        غير موجودة أو تم نقلها إلى مكان آخر.
      </p>

      <div class="actions">

        <a
          class="button primary"
          href="/"
          aria-label="العودة إلى الصفحة الرئيسية"
        >
          العودة للرئيسية
        </a>

        <button
          class="button"
          type="button"
          id="backButton"
        >
          الصفحة السابقة
        </button>

      </div>

      <p class="footer">
        افـنـدツينا🥀🖤
      </p>

    </section>

  </main>


  <script>
    (() => {

      "use strict";

      const backButton =
        document.getElementById(
          "backButton"
        );

      if (!backButton) {
        return;
      }

      backButton.addEventListener(
        "click",
        () => {

          if (
            window.history.length > 1
          ) {

            window.history.back();

          } else {

            window.location.assign("/");
          }

        }
      );

    })();
  </script>

</body>
</html>
