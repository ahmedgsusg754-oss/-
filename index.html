<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>افـنـدツ⁠يـنـا🥀🖤</title>

    <meta name="description" content="افـنـدツ⁠يـنـا🥀🖤 - مجتمع اجتماعي للدردشة والتعارف والغرف والمنشورات والهدايا.">
    <meta name="theme-color" content="#090611">
    <meta name="color-scheme" content="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #07050c;
            --bg-2: #0d0915;
            --panel: rgba(17, 12, 27, .88);
            --panel-2: rgba(24, 16, 38, .9);
            --border: rgba(201, 82, 255, .20);
            --border-hover: rgba(213, 91, 255, .55);

            --primary: #a63cff;
            --primary-2: #e044ff;
            --primary-3: #7430ff;

            --text: #fff;
            --muted: #aaa0b8;
            --success: #3ee49b;
            --danger: #ff4e76;
            --warning: #ffc857;

            --sidebar-width: 255px;
            --topbar-height: 72px;

            --radius: 18px;
            --shadow: 0 15px 45px rgba(0, 0, 0, .42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 10%, rgba(145, 35, 255, .14), transparent 30%),
                radial-gradient(circle at 85% 20%, rgba(238, 40, 255, .09), transparent 28%),
                radial-gradient(circle at 50% 100%, rgba(89, 30, 180, .12), transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: "Cairo", sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background:
                linear-gradient(
                    115deg,
                    transparent 0%,
                    rgba(255,255,255,.015) 45%,
                    transparent 55%
                );
            animation: backgroundMove 18s linear infinite;
        }

        @keyframes backgroundMove {
            from { transform: translateX(-20%); }
            to { transform: translateX(20%); }
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        #appLoader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, rgba(139, 34, 255, .18), transparent 45%),
                #05030a;
            transition: opacity .35s ease, visibility .35s ease;
        }

        #appLoader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-box {
            width: min(420px, 90%);
            text-align: center;
            padding: 40px 25px;
        }

        .loader-logo {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #fff, #df69ff, #9c43ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .loader-ring {
            width: 54px;
            height: 54px;
            margin: auto;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,.08);
            border-top-color: var(--primary-2);
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 18px;
            color: var(--muted);
            font-size: 14px;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--sidebar-width);
            padding: 18px 14px;
            z-index: 1000;
            border-left: 1px solid var(--border);
            background:
                linear-gradient(
                    180deg,
                    rgba(14, 8, 23, .98),
                    rgba(7, 5, 13, .97)
                );
            backdrop-filter: blur(18px);
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px 22px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background:
                linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 0 25px rgba(190, 55, 255, .3);
            font-size: 20px;
        }

        .brand-name {
            font-weight: 800;
            font-size: 16px;
            line-height: 1.4;
        }

        .brand-sub {
            color: var(--muted);
            font-size: 10px;
        }

        .nav-title {
            color: #6f647c;
            font-size: 11px;
            padding: 15px 12px 8px;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            width: 100%;
            min-height: 47px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            color: #aaa2b5;
            border-radius: 13px;
            background: transparent;
            text-align: right;
            transition: .2s ease;
        }

        .nav-item:hover {
            color: white;
            background: rgba(165, 60, 255, .08);
        }

        .nav-item.active {
            color: white;
            background:
                linear-gradient(
                    90deg,
                    rgba(142, 48, 255, .27),
                    rgba(213, 57, 255, .09)
                );
            box-shadow: inset 3px 0 0 var(--primary-2);
        }

        .nav-icon {
            width: 25px;
            text-align: center;
            font-size: 17px;
        }

        .nav-text {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
        }

        .nav-badge {
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-size: 9px;
        }

        .sidebar-bottom {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,.05);
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            min-height: 100vh;
            margin-right: var(--sidebar-width);
        }

        .topbar {
            height: var(--topbar-height);
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 25px;
            border-bottom: 1px solid rgba(255,255,255,.055);
            background: rgba(7,5,12,.76);
            backdrop-filter: blur(18px);
        }

        .mobile-menu {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            color: white;
            background: rgba(255,255,255,.06);
        }

        .search-box {
            flex: 1;
            max-width: 600px;
            height: 42px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 100%;
            padding: 0 45px 0 15px;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 13px;
            outline: none;
            background: rgba(255,255,255,.035);
            color: white;
        }

        .search-box input::placeholder {
            color: #777080;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8d8397;
        }

        .top-actions {
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-action {
            position: relative;
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: #c0b6c9;
            background: rgba(255,255,255,.04);
            transition: .2s;
        }

        .top-action:hover {
            color: white;
            background: rgba(170, 58, 255, .15);
        }

        .top-dot {
            position: absolute;
            width: 7px;
            height: 7px;
            top: 9px;
            right: 9px;
            border-radius: 50%;
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .content {
            width: min(1500px, 100%);
            margin: auto;
            padding: 25px;
        }

        .page {
            display: none;
            animation: pageIn .3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            position: relative;
            min-height: 250px;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding: 35px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background:
                radial-gradient(circle at 80% 40%, rgba(209, 52, 255, .2), transparent 30%),
                radial-gradient(circle at 15% 70%, rgba(105, 40, 255, .18), transparent 30%),
                linear-gradient(135deg, rgba(24,13,38,.96), rgba(10,7,18,.94));
            box-shadow: var(--shadow);
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            left: -130px;
            bottom: -250px;
            border-radius: 50%;
            background: rgba(189, 50, 255, .15);
            filter: blur(50px);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 700px;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 12px;
            border-radius: 30px;
            background: rgba(190, 61, 255, .1);
            border: 1px solid rgba(209, 84, 255, .18);
            color: #db94ff;
            font-size: 11px;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(25px, 4vw, 42px);
            line-height: 1.25;
            margin-bottom: 12px;
        }

        .hero h1 span {
            background: linear-gradient(90deg, #fff, #e467ff, #9b5cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            color: #a99eb2;
            line-height: 1.9;
            font-size: 14px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            min-height: 43px;
            padding: 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border-radius: 12px;
            color: white;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            transition: .2s ease;
            font-weight: 700;
            font-size: 12px;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-3), var(--primary-2));
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(168, 48, 255, .23);
        }

        .btn-danger {
            background: rgba(255, 53, 92, .1);
            border-color: rgba(255, 53, 92, .2);
            color: #ff7895;
        }

        .btn-small {
            min-height: 35px;
            padding: 0 12px;
            font-size: 11px;
        }

        /* =====================================================
           GRID
        ===================================================== */

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 18px;
            margin-top: 18px;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 18px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }

        .card-header {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid rgba(255,255,255,.055);
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
        }

        .card-subtitle {
            color: var(--muted);
            font-size: 10px;
            margin-top: 2px;
        }

        .card-body {
            padding: 18px;
        }

        /* =====================================================
           PROFILE CARD
        ===================================================== */

        .profile-card {
            padding: 22px;
        }

        .profile-head {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            overflow: hidden;
            border-radius: 50%;
            border: 2px solid rgba(220, 75, 255, .55);
            background: #1a1223;
            display: grid;
            place-items: center;
            color: #8f8596;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 14px;
            font-weight: 800;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--success);
            font-size: 9px;
        }

        .online::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .level {
            margin-top: 20px;
        }

        .level-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #aaa0af;
            font-size: 10px;
            margin-bottom: 7px;
        }

        .progress {
            height: 7px;
            overflow: hidden;
            border-radius: 10px;
            background: rgba(255,255,255,.06);
        }

        .progress > span {
            display: block;
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary-3), var(--primary-2));
            transition: width .7s ease;
        }

        .wallet {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            padding: 13px;
            border-radius: 13px;
            background: rgba(255,255,255,.035);
        }

        .wallet-label {
            color: #8e8597;
            font-size: 9px;
        }

        .wallet-value {
            font-weight: 800;
            font-size: 16px;
            color: #ffd75f;
        }

        /* =====================================================
           QUICK CARDS
        ===================================================== */

        .quick-card {
            padding: 18px;
            transition: .2s ease;
        }

        .quick-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
        }

        .quick-icon {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            margin-bottom: 13px;
            font-size: 19px;
            background: rgba(171, 56, 255, .12);
        }

        .quick-title {
            font-size: 12px;
            font-weight: 800;
        }

        .quick-text {
            color: var(--muted);
            font-size: 9px;
            line-height: 1.7;
            margin-top: 4px;
        }

        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .empty-state {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            color: #817688;
        }

        .empty-icon {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            margin-bottom: 12px;
            background: rgba(171, 55, 255, .08);
            color: #b24cff;
            font-size: 22px;
        }

        .empty-title {
            color: #c5bccb;
            font-size: 13px;
            font-weight: 700;
        }

        .empty-text {
            max-width: 400px;
            margin-top: 5px;
            font-size: 10px;
            line-height: 1.8;
        }

        /* =====================================================
           LISTS
