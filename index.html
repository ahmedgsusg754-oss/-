<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f"><meta name="description" content="افـنـدツيـنـا🥀🖤">
<title>افـنـدツيـنـا🥀🖤</title>
<style>
:root{--bg:#090a0f;--panel:#11131b;--card:#151722;--line:#282b38;--text:#f7f7fb;--muted:#9da2b5;--a:#c98cff;--b:#ff79b9;--good:#55e6a4;--danger:#ff6578;--r:22px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#c98cff18,transparent 28%),radial-gradient(circle at 90% 10%,#ff79b912,transparent 25%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.glass{background:#11131bd9;border:1px solid var(--line);box-shadow:0 20px 60px #0006;backdrop-filter:blur(18px)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(470px,100%);padding:28px;border-radius:28px}.brand{width:72px;height:72px;border-radius:23px;display:grid;place-items:center;margin:0 auto 15px;font-size:31px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 20px 60px #c98cff33}.authbox h1{text-align:center;margin:0 0 7px}.authbox>p{text-align:center;color:var(--muted)}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;padding:11px;border:1px solid var(--line);border-radius:14px;background:#151722;color:var(--muted)}.tab.active{color:#fff;background:#251c2d;border-color:#614c73}.form{display:grid;gap:10px}.input{width:100%;background:#0d0f16;color:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;outline:0}.input:focus{border-color:var(--a)}.btn{padding:12px 16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:800}.btn.secondary,.ghost,.icon{background:#181b25;color:#fff;border:1px solid var(--line);box-shadow:none}.ghost,.icon{padding:10px 13px;border-radius:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.top{position:sticky;top:0;z-index:50;background:#090a0fd9;border-bottom:1px solid var(--line);backdrop-filter:blur(20px)}.nav{height:68px;max-width:1180px;margin:auto;padding:0 18px;display:flex;align-items:center;gap:12px}.logo{font-size:20px;font-weight:900;white-space:nowrap}.logo span{color:var(--a)}.grow{flex:1}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900}.container{max-width:1180px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px}.side{position:sticky;top:86px;height:max-content;padding:12px;border-radius:22px}.side button{width:100%;display:flex;gap:10px;align-items:center;padding:13px;border:0;border-radius:14px;background:transparent;color:var(--muted);text-align:right;margin:3px 0}.side button:hover,.side button.active{background:#1a1c27;color:#fff}.main{min-width:0}.hero{padding:24px;border-radius:var(--r);margin-bottom:15px;background:linear-gradient(135deg,#c98cff19,#ff79b909),var(--panel);border:1px solid var(--line)}.hero h1{margin:0 0 7px;font-size:clamp(25px,4vw,38px)}.hero p{margin:0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.storyrow{display:flex;gap:13px;overflow:auto}.story{min-width:70px;text-align:center}.story .avatar{width:58px;height:58px;margin:auto;border:2px solid var(--a)}.story span{font-size:11px;color:var(--muted)}.posthead{display:flex;align-items:center;gap:10px}.postmeta{flex:1}.posttext{line-height:1.9;margin:14px 0;white-space:pre-wrap}.actions{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}.action{flex:1;padding:10px;border:0;border-radius:12px;background:#191c26;color:var(--muted)}.liked{color:#ff78b7}.stat{flex:1;text-align:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:#10121a}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.chatbox{height:380px;overflow:auto;background:#0c0e14;border:1px solid var(--line);border-radius:18px;padding:14px}.msg{max-width:78%;padding:10px 13px;border-radius:16px;background:#1a1d27;margin:7px 0}.msg.me{margin-right:auto;background:linear-gradient(135deg,#6d4d87,#934f72)}.modal{position:fixed;inset:0;z-index:100;background:#000a;display:grid;place-items:center;padding:18px}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px;border-radius:25px}.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#181b25;border:1px solid var(--line);padding:13px 16px;border-radius:14px;opacity:0;transform:translateY(15px);transition:.25s}.toast.show{opacity:1;transform:none}.footer{text-align:center;color:#666b7b;padding:30px}.online{color:var(--good)}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding-bottom:72px}.side{position:fixed;bottom:0;left:0;right:0;top:auto;z-index:60;border-radius:20px 20px 0 0;padding:6px;display:flex;justify-content:space-around}.side button{width:auto;display:grid;justify-items:center;gap:2px;padding:8px;font-size:10px}.grid{grid-template-columns:1fr}.search{display:none}.nav{height:62px}}
</style></head>
<body>
<section id="auth" class="auth"><div class="authbox glass"><div class="brand">🥀</div><h1>افـنـدツيـنـا</h1><p>مجتمع عربي هادئ للتعارف والدردشة والمشاركة 🖤</p><div class="tabs"><button class="tab active" data-mode="login">تسجيل الدخول</button><button class="tab" data-mode="register">إنشاء حساب</button></div><form id="authForm" class="form"><input id="name" class="input hidden" placeholder="اسمك المستعار" maxlength="30"><input id="email" class="input" type="email" placeholder="البريد الإلكتروني" required><input id="pass" class="input" type="password" placeholder="كلمة المرور" minlength="4" required><button class="btn" id="authBtn">دخول آمن</button></form><div class="row between" style="margin-top:12px"><button class="ghost" id="forgot">نسيت كلمة المرور؟</button><button class="ghost" id="guest">الدخول كضيف</button></div><p class="small">نسخة Front-end محلية. الربط الحقيقي بقاعدة بيانات يحتاج Backend.</p></div></section>
<div id="app" class="hidden"><header class="top"><nav class="nav"><div class="logo">افـنـدツيـنـا<span>🥀🖤</span></div><div class="grow"></div><input id="search" class="input search" style="width:220px;padding:10px" placeholder="ابحث عن عضو..."><button class="icon" data-page="notifications">🔔</button><button class="icon" data-page="settings">⚙️</button><button class="avatar" id="mini">أ</button></nav></header><div class="container layout"><aside class="side glass"><button class="active" data-page="home">🏠 الرئيسية</button><button data-page="discover">🧭 اكتشف</button><button data-page="messages">💬 الدردشة</button><button data-page="rooms">🎙️ الغرف</button><button data-page="store">🛍️ المتجر</button><button data-page="games">🎮 الألعاب</button><button data-page="profile">👤 ملفي</button><button data-page="settings">⚙️ الإعدادات</button><button id="owner">🛡️ الإدارة</button><button id="logout">🚪 خروج</button></aside><main id="main" class="main"></main></div></div>
<div id="modal" class="modal hidden"><div id="modalBox" class="modalbox glass"></div></div><div id="toast" class="toast"></div>
<script>
const K='afandina_site_v2';const base={users:[{id:'owner',name:'أحمد افندينا',email:'owner@afandina.local',pass:'1234',role:'owner',bio:'مالك الموقع 👑',online:true,coins:9999,followers:120}],posts:[{id:1,user:'أحمد افندينا',text:'أهلًا بكم في افـنـدツيـنـا 🥀🖤\nخلّونا نخلي المكان راقي وهادئ للجميع.',likes:18,comments:3,time:'الآن'},{id:2,user:'ليان',text:'أجمل شيء في أي مجتمع هو الاحترام والكلمة الطيبة ✨',likes:11,comments:2,time:'منذ ساعة'}],messages:[{text:'أهلًا 👋',me:false,time:'الآن'}],stories:['أحمد','ليان','نور','سارة','محمد'],rooms:['سهرة افـنـدينا','تعال نتعرف','غرفة الأصدقاء'],products:[['👑','شارة التاج',120],['🥀','هدية وردة',50],['💗','قلوب مضيئة',80],['✨','إطار مميز',200]],notifications:[{text:'مرحبًا بك في افـنـدツيـنـا 🥀🖤',time:'الآن'}],current:null};let S=JSON.parse(localStorage.getItem(K)||'null')||structuredClone(base);const save=()=>localStorage.setItem(K,JSON.stringify(S));const me=()=>S.users.find(u=>u.id===S.current)||S.users[0];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),2200)}function modal(h){modalBox.innerHTML=h;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
let mode='login';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));name.classList.toggle('hidden',mode==='login');name.required=mode==='register';authBtn.textContent=mode==='login'?'دخول آمن':'إنشاء حساب'});authForm.onsubmit=e=>{e.preventDefault();let em=email.value.trim().toLowerCase(),pw=pass.value;if(mode==='login'){let u=S.users.find(x=>x.email===em&&x.pass===pw);if(!u)return toast('بيانات الدخول غير صحيحة');S.current=u.id;u.online=true}else{if(S.users.some(x=>x.email===em))return toast('البريد مستخدم بالفعل');let u={id:'u'+Date.now(),name:name.value.trim()||'عضو جديد',email:em,pass:pw,role:'user',bio:'عضو جديد في افـنـدツيـنـا',online:true,coins:300,followers:0};S.users.push(u);S.current=u.id}save();boot()};guest.onclick=()=>{S.current='guest';save();boot()};forgot.onclick=()=>modal('<h3>استعادة كلمة المرور</h3><p class="muted">هذه نسخة محلية تجريبية.</p><input class="input" placeholder="البريد الإلكتروني"><button class="btn" style="width:100%;margin-top:10px" onclick="toast(\'تم إرسال رابط تجريبي\');closeModal()">إرسال</button>');
function boot(){auth.classList.add('hidden');app.classList.remove('hidden');render('home')}document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>render(x.dataset.page));mini.onclick=()=>render('profile');logout.onclick=()=>{S.current=null;save();location.reload()};owner.onclick=()=>{if(me().role!=='owner')return toast('لوحة الإدارة للمالك فقط');render('owner')};
function post(p){let liked=localStorage.getItem('lk'+p.id)==='1';return `<article class="card"><div class="posthead"><div class="avatar">${esc(p.user[0])}</div><div class="postmeta"><b>${esc(p.user)}</b><div class="small muted">${esc(p.time)} · 🌐 عام</div></div><button class="icon">•••</button></div><div class="posttext">${esc(p.text)}</div><div class="actions"><button class="action ${liked?'liked':''}" data-like="${p.id}">❤️ ${p.likes+(liked?1:0)}</button><button class="action" data-comment="${p.id}">💬 ${p.comments}</button><button class="action" data-share="${p.id}">↗️ مشاركة</button></div></article>`}
function render(p){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));let f={home,discover,messages,rooms,store,games,profile,settings,notifications,ownerPage};main.innerHTML=(f[p]||home)();bind(p)}function home(){return `<section class="hero"><div class="row between"><div><h1>أهلًا بك في افـنـدツيـنـا 🥀</h1><p>مجتمعك العربي الهادئ للتعارف والدردشة والمشاركة.</p></div><button class="btn" id="newPost">＋ منشور جديد</button></div></section><div class="card"><h3>القصص</h3><div class="storyrow">${S.stories.map((x,i)=>`<div class="story"><div class="avatar">${['أ','ل','ن','س','م'][i]}</div><span>${esc(x)}</span></div>`).join('')}</div></div>${S.posts.map(post).join('')}<div class="footer">افـنـدツيـنـا🥀🖤 · صُمم بهدوء</div>`}function discover(){return `<section class="hero"><h1>اكتشف 🧭</h1><p>تعرف على أعضاء المجتمع.</p></section><div class="grid">${S.users.filter(u=>u.id!=='owner'||me().role==='owner').map(u=>`<div class="card"><div class="row"><div class="avatar">${esc(u.name[0])}</div><div><b>${esc(u.name)}</b><div class="small ${u.online?'online':'muted'}">${u.online?'متصل الآن':'غير متصل'}</div></div></div><p class="muted">${esc(u.bio)}</p><button class="btn secondary" data-msg="${u.id}">💬 مراسلة</button></div>`).join('')}</div>`}function messages(){return `<section class="hero"><h1>الدردشة 💬</h1><p>واجهة جاهزة للربط اللحظي.</p></section><div class="card"><div id="chat" class="chatbox">${S.messages.map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.text)}<div class="small muted">${esc(m.time)}</div></div>`).join('')}</div><div class="row" style="margin-top:10px"><input id="mi" class="input" placeholder="اكتب رسالتك..." style="flex:1"><button id="send" class="btn">إرسال</button></div></div>`}function rooms(){return `<section class="hero"><h1>الغرف 🎙️</h1><p>غرف اجتماعية تجريبية.</p></section><div class="grid">${S.rooms.map((r,i)=>`<div class="card"><h3>${['🎙️','🎧','🌙'][i]} ${esc(r)}</h3><p class="muted">${12+i*7} متصل</p><button class="btn" data-room="${i}">دخول الغرفة</button></div>`).join('')}</div>`}function store(){return `<section class="hero"><div class="row between"><div><h1>المتجر 🛍️</h1><p>رصيدك: <b>${me().coins} 🪙</b></p></div><button class="btn secondary" id="daily">🎁 مكافأة يومية</button></div></section><div class="grid">${S.products.map((p,i)=>`<div class="card"><div style="font-size:45px">${p[0]}</div><h3>${p[1]}</h3><p class="muted">${p[2]} 🪙</p><button class="btn" data-buy="${i}">شراء</button></div>`).join('')}</div>`}function games(){return `<section class="hero"><h1>الألعاب 🎮</h1><p>ترفيه خفيف داخل الموقع.</p></section><div class="grid"><div class="card"><h3>🎯 خمن الرقم</h3><p class="muted">رقم من 1 إلى 5.</p><div class="row">${[1,2,3,4,5].map(n=>`<button class="btn secondary" data-g="${n}">${n}</button>`).join('')}</div></div><div class="card"><h3>🪙 رمية حظ</h3><button class="btn" id="flip">ارمِ العملة</button></div></div>`}function profile(){let u=me();return `<section class="hero"><div class="row"><div class="avatar" style="width:80px;height:80px;font-size:28px">${esc(u.name[0])}</div><div><h1>${esc(u.name)} ${u.role==='owner'?'👑':''}</h1><p>${esc(u.bio)}</p></div></div></section><div class="card"><div class="row"><div class="stat"><b>${u.followers||0}</b><span>متابع</span></div><div class="stat"><b>${S.posts.filter(p=>p.user===u.name).length}</b><span>منشور</span></div><div class="stat"><b>${u.coins||0}</b><span>عملات</span></div></div><button class="btn" style="margin-top:14px" id="edit">تعديل الملف</button></div>`}function settings(){let u=me();return `<section class="hero"><h1>الإعدادات ⚙️</h1><p>تحكم في حسابك.</p></section><div class="card"><h3>الملف الشخصي</h3><input id="sn" class="input" value="${esc(u.name)}"><textarea id="sb" class="input" style="margin-top:10px">${esc(u.bio)}</textarea><button class="btn" style="margin-top:10px" id="savep">حفظ</button><button class="btn secondary" style="margin-top:10px" id="reset">إعادة ضبط البيانات</button></div>`}function notifications(){return `<section class="hero"><h1>الإشعارات 🔔</h1><p>آخر التنبيهات.</p></section><div class="card">${S.notifications.map(n=>`<div class="card"><b>🔔 ${esc(n.text)}</b><div class="small muted">${esc(n.time)}</div></div>`).join('')}</div>`}function ownerPage(){return `<section class="hero"><h1>لوحة المالك 🛡️</h1><p>تحكم محلي تجريبي.</p></section><div class="grid"><div class="stat"><b>${S.users.length}</b><span>مستخدم</span></div><div class="stat"><b>${S.posts.length}</b><span>منشور</span></div></div><div class="card"><h3>الأعضاء</h3>${S.users.map(u=>`<div class="row card"><div class="avatar">${esc(u.name[0])}</div><div class="grow"><b>${esc(u.name)}</b><div class="small muted">${esc(u.email)} · ${u.role}</div></div>${u.id==='owner'?'👑':`<button class="btn" data-del="${u.id}">حذف</button>`}</div>`).join('')}</div>`}
function bind(p){if(p==='home'){newPost.onclick=()=>modal('<h3>منشور جديد</h3><textarea id="pt" class="input" placeholder="ماذا تريد أن تشارك؟"></textarea><button class="btn" style="width:100%;margin-top:10px" onclick="createPost()">نشر الآن</button>');document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{let k='lk'+b.dataset.like;localStorage.setItem(k,localStorage.getItem(k)==='1'?'0':'1');render('home')});document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>modal('<h3>التعليقات</h3><input class="input" placeholder="اكتب تعليقًا..."><button class="btn" style="margin-top:10px" onclick="toast(\'تمت الإضافة تجريبيًا\');closeModal()">إضافة</button>'));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(location.href);toast('تم نسخ الرابط')})}if(p==='messages'){send.onclick=()=>{let t=mi.value.trim();if(!t)return;S.messages.push({text:t,me:true,time:'الآن'});save();render('messages')};mi.onkeydown=e=>{if(e.key==='Enter')send.click()}}if(p==='rooms')document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{modal(`<h3>${esc(S.rooms[b.dataset.room])}</h3><p class="muted">دخلت الغرفة التجريبية 🎙️</p><button class="btn" onclick="closeModal()">موافق</button>`)});if(p==='store'){daily.onclick=()=>{if(localStorage.getItem('daily'+new Date().toDateString()))return toast('أخذت مكافأتك اليوم');me().coins+=100;localStorage.setItem('daily'+new Date().toDateString(),'1');save();render('store');toast('+100 🪙')};document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let q=S.products[b.dataset.buy];if(me().coins<q[2])return toast('الرصيد غير كافٍ');me().coins-=q[2];save();render('store');toast('تم الشراء 🎉')})}if(p==='games'){document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>toast(+b.dataset.g===Math.ceil(Math.random()*5)?'🎉 أصبت!':'حظ أوفر 😄'));flip.onclick=()=>Math.random()>.45?(me().coins+=50,save(),toast('🎉 ربحت 50 🪙')):toast('حظ أوفر 😄')}if(p==='profile')edit.onclick=()=>render('settings');if(p==='settings'){savep.onclick=()=>{me().name=sn.value.trim()||me().name;me().bio=sb.value.trim();save();toast('تم الحفظ');render('profile')};reset.onclick=()=>{localStorage.removeItem(K);location.reload()}}if(p==='discover')document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>render('messages'));if(p==='owner')document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.users=S.users.filter(u=>u.id!==b.dataset.del);save();render('owner');toast('تم الحذف')})}function createPost(){let t=pt.value.trim();if(!t)return toast('اكتب محتوى المنشور');S.posts.unshift({id:Date.now(),user:me().name,text:t,likes:0,comments:0,time:'الآن'});save();closeModal();render('home');toast('تم النشر 🎉')}if(S.current)boot();
</script></body></html>
