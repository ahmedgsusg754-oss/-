<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<title>افـنـدツ⁠يـنـا🥀🖤</title>
<style>
:root{--bg:#07060b;--panel:#11101a;--panel2:#171321;--line:#342941;--text:#fff;--muted:#aaa2b3;--purple:#9b55ff;--pink:#d45cff;--gold:#ffd66d;--green:#48dfa1;--danger:#ff7089}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at 85% 0,#35164c 0,#120b1b 28%,#07070b 70%);color:var(--text)}
body{padding-bottom:82px}button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.app{max-width:850px;margin:auto}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:#08070df2;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.brand{font-size:21px;font-weight:900}.tag{font-size:11px;color:var(--muted);margin-top:4px}.topbtn{width:43px;height:43px;border:1px solid var(--line);background:#12101a;color:#fff;border-radius:15px}
main{padding:16px}.hero,.card,.profile,.shop,.vip,.admin,.authbox,.settings{background:linear-gradient(145deg,#1a1225,#0d0b12);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 80px #0007}
.hero{padding:25px;position:relative;overflow:hidden}.hero:after{content:"🥀";position:absolute;left:-10px;bottom:-30px;font-size:120px;opacity:.06}.hero h1{font-size:30px;line-height:1.45;margin:12px 0}.muted{color:var(--muted);line-height:1.9}.row{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:0;border-radius:15px;padding:13px 18px;color:#fff;background:linear-gradient(135deg,#874cff,#c15bff);font-weight:900;box-shadow:0 9px 28px #8d4cff2a}.btn.secondary{background:#15121e;border:1px solid var(--line);box-shadow:none}.btn.gold{background:linear-gradient(135deg,#b7771f,#ffe18a,#b7761e);color:#241707}.btn.danger{background:#32141e;border:1px solid #6b2637}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:#100e16;border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center;color:var(--muted)}.stat b{display:block;color:#fff;font-size:20px;margin-top:5px}
.title{font-size:22px;margin:27px 3px 12px}.members{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.member{padding:14px;text-align:center;background:#100e16;border:1px solid var(--line);border-radius:22px}
.avatar{display:block;width:78px;height:78px;margin:auto;border-radius:26px;object-fit:cover;background:#1b1725;border:1px solid #40364d}.member h3{margin:10px 0 5px}.online{color:var(--green);font-size:12px}.vipmark{display:inline-block;padding:4px 8px;border-radius:999px;background:linear-gradient(135deg,#ffe28b,#fff0b8,#c58d2c);color:#211707;font-size:10px;font-weight:900}
.search,.field input,.field textarea,.field select,.settings input,.settings textarea,.settings select{width:100%;background:#0b0a11;color:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;outline:0}.search{margin-bottom:12px}
.profile{padding:27px;text-align:center}.profile .avatar{width:120px;height:120px;border-radius:38px}.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#17131f;color:#ddd}
.shop,.vip,.admin{padding:21px}.giftgrid,.plans,.adminGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.gift,.plan,.adminBox{background:#14111c;border:1px solid var(--line);border-radius:21px;padding:17px;text-align:center}.gift{position:relative;overflow:hidden}.giftIcon{font-size:46px;margin-bottom:5px}.gift b,.plan b{display:block;margin:6px 0}.coin{color:var(--gold);font-weight:900}
.legend{margin-top:4px;padding:0;overflow:hidden;border-radius:25px;border:1px solid #73551d;background:linear-gradient(145deg,#20180b,#0d0b08)}.legendArt{width:100%;display:block;height:205px}.legendBody{text-align:center;padding:18px}.legendBody h2{color:var(--gold);margin:5px 0 8px}.price{font-size:20px;color:var(--gold);font-weight:900}
.modal{position:fixed;inset:0;z-index:100;background:#0009;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modalBox{width:min(620px,100%);max-height:88vh;overflow:auto;background:#12101a;border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 30px 100px #000b}.modalTop{display:flex;justify-content:space-between;align-items:center}.close{width:40px;height:40px;border:1px solid var(--line);background:#17131f;color:#fff;border-radius:13px}
.field{margin:12px 0}.field label,.settings label{display:block;color:#bbb2c4;font-size:13px;margin-bottom:7px}.empty{border:1px dashed #44374d;border-radius:20px;padding:35px 15px;text-align:center;color:var(--muted)}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.authbox{width:min(450px,100%);padding:28px}.authLogo{font-size:45px}.msg{min-height:20px;color:#ff9eae;font-size:13px}.switch{text-align:center;color:var(--muted);margin-top:14px}.switch button{border:0;background:none;color:#bc7cff}.forgotBtn{display:inline-block;margin-bottom:2px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#15121e;color:#bc7cff;font-weight:700;box-shadow:none}.ownerBox{padding:15px;border:1px solid #7154a7;background:#211633;border-radius:20px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border-bottom:1px solid #2a2233}.toggle:last-child{border-bottom:0}.historyItem{display:flex;align-items:center;gap:12px;padding:12px;background:#100e16;border:1px solid var(--line);border-radius:16px;margin-top:8px}.historyItem .grow{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#08070ef7;border-top:1px solid var(--line);backdrop-filter:blur(15px)}.navin{max-width:850px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:none;color:#aaa2b0;padding:9px 2px 11px;font-size:10px}nav b{display:block;font-size:20px;margin-bottom:3px}nav .active{color:#bc7cff}
.toast{position:fixed;z-index:120;bottom:96px;left:50%;transform:translateX(-50%);background:#1b1623;border:1px solid #4a3a51;border-radius:14px;padding:12px 16px;max-width:90%;text-align:center}.badgeGold{color:var(--gold)}.small{font-size:12px}
.cover{width:100%;height:190px;object-fit:cover;border-radius:22px;border:1px solid var(--line);background:#0b0a11;margin-bottom:15px}.settings{padding:21px}.settings h2{margin:8px 0 18px}.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settingSection{background:#100e16;border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:13px}.settingSection.full{grid-column:1/-1}.settingField{margin-bottom:12px}.settingField:last-child{margin-bottom:0}.settingField input,.settingField textarea,.settingField select{margin-top:7px}.settingField textarea{min-height:90px;resize:vertical}.avatarChoices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.avatarChoice{border:1px solid var(--line);background:#0b0a11;border-radius:16px;padding:7px}.avatarChoice img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}.avatarChoice.selected{border:2px solid var(--purple);box-shadow:0 0 0 2px #9b55ff33}.dangerText{color:var(--danger)}
@media(max-width:520px){.members,.giftgrid,.plans,.adminGrid{grid-template-columns:1fr 1fr}.hero h1{font-size:26px}.profile .avatar{width:106px;height:106px}.settingsGrid{grid-template-columns:1fr}.settingSection.full{grid-column:auto}.avatarChoices{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<section id="auth" class="auth">
 <div class="authbox">
  <div class="authLogo">🥀🖤</div><h1>افـنـدツ⁠يـنـا</h1>
  <p class="muted">تعارف ودردشة وحسابات حقيقية — نسخة تجريبية بدون دفع.</p>
  <div id="loginBox">
   <div class="field"><label>اسم المستخدم أو البريد</label><input id="li" autocomplete="username"></div>
   <div class="field"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"></div>
   <div id="lm" class="msg"></div><button class="btn" style="width:100%" onclick="login()">دخول إلى الموقع</button>
   <div class="switch"><button class="forgotBtn" onclick="forgotPassword()">🔑 هل نسيت كلمة المرور؟</button></div>
   <div class="switch">ليس لديك حساب؟ <button onclick="toggleAuth()">إنشاء حساب</button></div>
  </div>
  <div id="regBox" class="hide">
   <div class="field"><label>اسم المستخدم</label><input id="ru" autocomplete="username"></div>
   <div class="field"><label>البريد الإلكتروني</label><input id="re" type="email" autocomplete="email"></div>
   <div class="field"><label>كلمة المرور</label><input id="rp" type="password" autocomplete="new-password"></div>
   <div class="field"><label>صورة الحساب</label><input id="rpic" type="file" accept="image/*"></div>
   <div id="rm" class="msg"></div><button class="btn" style="width:100%" onclick="register()">إنشاء الحساب والدخول</button>
   <div class="switch">لديك حساب؟ <button onclick="toggleAuth()">تسجيل الدخول</button></div>
  </div>
 </div>
</section>

<div id="site" class="app hide">
 <header>
  <div><div class="brand">افـنـدツ⁠يـنـا🥀🖤</div><div class="tag">مساحتك... بطريقتك</div></div>
  <div class="row">
   <button class="topbtn" onclick="page('settings')">⚙️</button>
   <button class="topbtn" onclick="page('profile')">👤</button>
   <button class="topbtn" onclick="logout()">↪</button>
  </div>
 </header>
 <main id="main"></main>
 <nav><div class="navin">
  <button id="homeN" onclick="page('home')"><b>⌂</b>الرئيسية</button>
  <button id="membersN" onclick="page('members')"><b>👥</b>الأعضاء</button>
  <button id="vipN" onclick="page('vip')"><b>👑</b>VIP</button>
  <button id="storeN" onclick="page('store')"><b>🎁</b>المتجر</button>
  <button id="profileN" onclick="page('profile')"><b>👤</b>حسابي</button>
 </div></nav>
</div>

<div id="modal" class="modal hide" onclick="if(event.target===this)closeModal()"><div class="modalBox" id="modalBox"></div></div>

<script>
const UKEY='afn_v2_users',SKEY='afn_v2_session',OWNERKEY='afn_v2_owner';
const gifts=[
{id:'rose',name:'وردة',icon:'🌹',price:10,desc:'هدية بسيطة ولطيفة.'},
{id:'diamond',name:'ألماسة',icon:'💎',price:100,desc:'هدية مميزة.'},
{id:'crown',name:'تاج',icon:'👑',price:500,desc:'لشخص يستحق التميز.'},
{id:'fire',name:'لهيب',icon:'🔥',price:1000,desc:'هدية قوية ومميزة.'},
{id:'legend',name:'أسطورة الموقع',icon:'legend',price:50000,desc:'الهدية الملكية للأهرامات وأبو الهول.'}];
const users=()=>JSON.parse(localStorage.getItem(UKEY)||'[]'),saveU=a=>localStorage.setItem(UKEY,JSON.stringify(a)),me=()=>users().find(x=>x.id===localStorage.getItem(SKEY)),makeId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),fmt=n=>Number(n||0).toLocaleString('ar-EG');
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function readFile(f){return new Promise(ok=>{if(!f)return ok('');let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)})}
function toggleAuth(){loginBox.classList.toggle('hide');regBox.classList.toggle('hide');lm.textContent='';rm.textContent=''}
async function register(){
 let u=ru.value.trim(),e=re.value.trim().toLowerCase(),p=rp.value;if(u.length<3||!e||p.length<6){rm.textContent='اكتب اسمًا وبريدًا صحيحًا وكلمة مرور 6 أحرف على الأقل.';return}
 let a=users();if(a.some(x=>x.username.toLowerCase()===u.toLowerCase()||x.email===e)){rm.textContent='اسم المستخدم أو البريد مستخدم بالفعل.';return}
 let first=a.length===0,x={id:makeId(),username:u,fullName:u,email:e,password:p,photo:await readFile(rpic.files[0]),cover:'',bio:'',weight:'',height:'',socialStatus:'سنجل',age:'',country:'Egypt',location:'',notificationStyle:'Decay',avatarChoice:'',created:new Date().toISOString(),coins:first?100000:0,level:first?100:1,badges:first?['👑 مالك الموقع']:[],giftsReceived:[],giftsSent:[],vip:first,role:first?'OWNER':'USER',settings:{disableNonFriends:false,disablePrivate:false,disableMedia:false,disabled:false}};
 a.push(x);saveU(a);if(first)localStorage.setItem(OWNERKEY,x.id);localStorage.setItem(SKEY,x.id);boot()
}
function login(){
 let q=li.value.trim().toLowerCase(),p=lp.value,a=users(),x=a.find(v=>(v.username.toLowerCase()===q||v.email===q)&&v.password===p);
 if(!x){lm.textContent='الحساب غير موجود أو بيانات الدخول غير صحيحة.';return}
 if(x.settings&&x.settings.disabled){lm.textContent='هذا الحساب معطّل.';return}
 localStorage.setItem(SKEY,x.id);boot()
}
function forgotPassword(){
 let email=prompt('اكتب البريد الإلكتروني المرتبط بالحساب:');
 if(email===null)return;
 email=email.trim().toLowerCase();
 if(!email){toast('اكتب البريد الإلكتروني أولًا');return}
 let a=users(),x=a.find(v=>v.email===email);
 if(!x){toast('لا يوجد حساب مرتبط بهذا البريد الإلكتروني');return}
 let np=prompt('اكتب كلمة المرور الجديدة (6 أحرف على الأقل):');
 if(np===null)return;
 np=np.trim();
 if(np.length<6){toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');return}
 let cp=prompt('أكد كلمة المرور الجديدة:');
 if(cp===null)return;
 if(np!==cp){toast('كلمتا المرور غير متطابقتين');return}
 x.password=np;saveU(a);
 toast('تم تغيير كلمة المرور بنجاح ✅');
 li.value=x.email;lp.value='';
 lm.textContent='تم تغيير كلمة المرور بنجاح، سجل الدخول بالكلمة الجديدة.';
}
function logout(){localStorage.removeItem(SKEY);location.reload()}
function boot(){auth.classList.add('hide');site.classList.remove('hide');page('home')}
function pic(x,cls='avatar'){return x.photo?`<img class="${cls}" src="${x.photo}" alt="">`:`<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-size:34px">👤</div>`}
function nav(k){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));let e=document.getElementById(k+'N');if(e)e.classList.add('active')}
function page(k,arg){if(!me()){location.reload();return}nav(k);if(k==='home')home();if(k==='members')members();if(k==='profile')profile(arg||me().id);if(k==='vip')vip();if(k==='store')store();if(k==='settings')settingsPage();scrollTo(0,0)}

function home(){
 let x=me(),owner=x.role==='OWNER';main.innerHTML=`
 <section class="hero"><span style="color:var(--green)">● الحساب متصل</span>${owner?`<div class="ownerBox" style="margin-top:12px">👑 <b>OWNER</b> — أنت مالك افـنـدツ⁠يـنـا وتملك صلاحيات الإدارة.</div>`:''}
 <h1>أهلاً ${esc(x.username)} 🥀🖤</h1><p class="muted">نسخة تجريبية مركزة على الحسابات والكوينز والهدايا والإعدادات.</p>
 <div class="row"><button class="btn gold" onclick="page('store')">🎁 جرب الهدايا</button><button class="btn secondary" onclick="page('members')">👥 الأعضاء</button><button class="btn secondary" onclick="page('profile')">👤 حسابي</button><button class="btn secondary" onclick="page('settings')">⚙️ الإعدادات</button></div></section>
 <div class="stats"><div class="stat">🪙<b>${fmt(x.coins)}</b>كوين</div><div class="stat">⭐<b>${fmt(x.level)}</b>مستوى</div><div class="stat">🎁<b>${x.giftsReceived.length}</b>هدايا</div></div>
 <h2 class="title">حسابك</h2><section class="card" style="padding:18px"><div class="toggle"><span>👑 VIP</span><b>${x.vip?'مفعّل':'غير مفعّل'}</b></div><div class="toggle"><span>🏅 الأوسمة</span><b>${x.badges.length}</b></div><div class="toggle"><span>🎁 الهدايا المستلمة</span><b>${x.giftsReceived.length}</b></div><div class="toggle"><span>🎁 الهدايا المرسلة</span><b>${x.giftsSent.length}</b></div></section>
 ${owner?`<h2 class="title">الإدارة</h2><section class="admin"><button class="btn" onclick="admin()">⚙️ لوحة OWNER</button></section>`:''}`;
}

function members(){
 main.innerHTML=`<h1>👥 الأعضاء</h1><p class="muted">الحسابات التي تظهر هنا تم إنشاؤها فعليًا من شاشة التسجيل.</p><input class="search" id="ms" placeholder="ابحث باسم المستخدم..." oninput="filterMembers()"><div id="ml" class="members"></div>`;drawMembers(users())
}
function drawMembers(a){let own=me();a=a.filter(x=>x.id!==own.id&&!(x.settings&&x.settings.disabled));ml.innerHTML=a.length?a.map(x=>`<article class="member" onclick="profile('${x.id}')">${pic(x)}<h3>${esc(x.username)} ${x.vip?'<span class="vipmark">VIP</span>':''}</h3><div class="online">● متصل</div><div class="small muted">⭐ المستوى ${x.level}</div><button onclick="event.stopPropagation();profile('${x.id}')">👤 فتح الملف</button></article>`).join(''):`<div class="empty" style="grid-column:1/-1">لا يوجد أعضاء آخرون حتى الآن.</div>`}
function filterMembers(){let q=ms.value.toLowerCase();drawMembers(users().filter(x=>x.username.toLowerCase().includes(q)))}

function profile(uid){
 let x=users().find(v=>v.id===uid);if(!x){toast('الحساب غير موجود');return}let own=x.id===me().id;
 main.innerHTML=`<button class="btn secondary" onclick="page('${own?'home':'members'}')">← رجوع</button><div style="height:12px"></div><section class="profile">
 ${x.cover?`<img class="cover" src="${x.cover}" alt="">`:''}${pic(x)}<h1>${esc(x.username)} ${x.role==='OWNER'?'<span class="vipmark">👑 OWNER</span>':x.vip?'<span class="vipmark">VIP</span>':''}</h1>
 <div class="online">● متصل</div><p class="muted">${esc(x.bio||'لا توجد نبذة للحساب.')}</p>
 <div class="chips"><span class="chip">⭐ ${x.level}</span><span class="chip">🏅 ${x.badges.length}</span><span class="chip">🎁 ${x.giftsReceived.length}</span>${x.vip?'<span class="chip">👑 VIP</span>':''}${x.country?`<span class="chip">🌍 ${esc(x.country)}</span>`:''}</div>
 ${own?`<div class="row" style="justify-content:center"><button class="btn" onclick="page('settings')">⚙️ الإعدادات</button><button class="btn secondary" onclick="bioEdit()">✏️ النبذة</button></div><h2 class="title">هداياك</h2>${receivedHtml(x)}`:
 `<div class="row" style="justify-content:center">${x.settings?.disableNonFriends?'<div class="empty">هذا العضو عطّل الرسائل من غير الأصدقاء.</div>':`<button class="btn" onclick="openGiftChooser('${x.id}')">🎁 إرسال هدية</button>`}<button class="btn secondary" onclick="toast(x.settings?.disablePrivate?'المحادثات الخاصة معطلة لهذا الحساب':'الدردشة ستُضاف مع قاعدة البيانات لاحقًا')">💬 دردشة</button></div><h2 class="title">الهدايا المستلمة</h2>${receivedHtml(x)}`}</section>`
}
function receivedHtml(x){if(!x.giftsReceived.length)return `<div class="empty">لا توجد هدايا بعد.</div>`;return x.giftsReceived.slice().reverse().map(g=>`<div class="historyItem"><div style="font-size:30px">${g.icon==='legend'?'🏛️':esc(g.icon)}</div><div class="grow"><b>${esc(g.name)}</b><div class="small muted">من ${esc(g.fromName||'عضو')}</div></div><span class="coin">${fmt(g.price)} 🪙</span></div>`).join('')}
async function changePic(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{let a=users(),x=me();x.photo=await readFile(i.files[0]);saveU(a);profile(x.id)};i.click()}
function bioEdit(){let x=me(),v=prompt('اكتب نبذة الحساب',x.bio||'');if(v!==null){let a=users();x.bio=v;saveU(a);profile(x.id)}}

function legendSvg(){return `<svg class="legendArt" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b1b53"/><stop offset="1" stop-color="#0d0b0a"/></linearGradient><linearGradient id="sand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8d6128"/><stop offset=".5" stop-color="#f0c66a"/><stop offset="1" stop-color="#70461d"/></linearGradient></defs><rect width="800" height="300" fill="url(#sky)"/><circle cx="650" cy="65" r="42" fill="#ffe39a" opacity=".9"/><path d="M0 245 Q180 210 400 245 T800 238 V300 H0Z" fill="#6a431c"/><path d="M65 250 L185 82 L305 250Z" fill="url(#sand)"/><path d="M230 250 L390 45 L550 250Z" fill="url(#sand)"/><path d="M450 250 L535 135 L620 250Z" fill="url(#sand)"/><g transform="translate(585 185)"><ellipse cx="0" cy="42" rx="105" ry="25" fill="#3e2915" opacity=".8"/><path d="M-70 35 Q-55 5 -35 0 L-10 -12 L18 -5 Q40 4 53 32 L28 44 L-50 44Z" fill="#c0914b"/><circle cx="-4" cy="-28" r="27" fill="#d4a75f"/></g><text x="35" y="45" fill="#ffe4a0" font-size="22" font-family="Arial">افـنـدツ⁠يـنـا</text></svg>`}
function store(){
 let x=me();main.innerHTML=`<h1>🎁 المتجر</h1><section class="shop"><div class="ownerBox" style="margin-bottom:15px"><b>🪙 رصيدك: <span class="coin">${fmt(x.coins)} كوين</span></b><div class="small muted">لا يوجد دفع مالي. كل شيء هنا للتجربة بالكوينز فقط.</div></div>
 <div class="legend">${legendSvg()}<div class="legendBody"><h2>أسطورة الموقع</h2><p class="muted">هدية فاخرة مستوحاة من الأهرامات وأبو الهول، مخصصة للأشخاص المميزين.</p><div class="price">50,000 🪙</div><br><button class="btn gold" onclick="openGiftChooser()">🎁 اختر مستلم الهدية</button></div></div>
 <h2 class="title">الهدايا</h2><div class="giftgrid">${gifts.filter(g=>g.id!=='legend').map(g=>`<div class="gift"><div class="giftIcon">${g.icon}</div><b>${g.name}</b><div class="small muted">${g.desc}</div><div class="coin" style="margin:8px 0">${fmt(g.price)} 🪙</div><button class="btn secondary" onclick="openGiftChooser(null,'${g.id}')">إرسال</button></div>`).join('')}</div><h2 class="title">سجل الهدايا</h2>${historyHtml(x)}</section>`
}
function historyHtml(x){let sent=x.giftsSent.slice().reverse();if(!sent.length)return `<div class="empty">لم ترسل هدايا حتى الآن.</div>`;return sent.map(g=>`<div class="historyItem"><div style="font-size:30px">${g.icon==='legend'?'🏛️':esc(g.icon)}</div><div class="grow"><b>${esc(g.name)}</b><div class="small muted">إلى ${esc(g.toName||'عضو')}</div></div><span class="coin">${fmt(g.price)} 🪙</span></div>`).join('')}

function openGiftChooser(uid=null,giftId='legend'){
 let others=users().filter(x=>x.id!==me().id&&!(x.settings&&x.settings.disabled));if(!others.length){toast('أنشئ حسابًا ثانيًا لتجربة إرسال الهدايا بين الحسابات');return}
 let selectedGift=gifts.find(g=>g.id===giftId)||gifts[4];modalBox.innerHTML=`<div class="modalTop"><h2>🎁 إرسال هدية</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">اختر الحساب ثم الهدية. لا يوجد دفع مالي في هذه النسخة.</p><div class="field"><label>المستلم</label><select id="giftRecipient">${others.map(x=>`<option value="${x.id}" ${uid===x.id?'selected':''}>${esc(x.username)}</option>`).join('')}</select></div><div class="field"><label>الهدية</label><select id="giftType">${gifts.map(g=>`<option value="${g.id}" ${selectedGift.id===g.id?'selected':''}>${g.id==='legend'?'🏛️ ':g.icon+' '}${esc(g.name)} — ${fmt(g.price)} كوين</option>`).join('')}</select></div><div class="ownerBox"><b>رصيدك:</b> <span class="coin">${fmt(me().coins)} 🪙</span></div><br><button class="btn gold" style="width:100%" onclick="sendGift()">🎁 تأكيد الإرسال</button>`;modal.classList.remove('hide')
}
function closeModal(){modal.classList.add('hide')}
function sendGift(){
 let from=me(),recipientId=giftRecipient.value,gid=giftType.value,gift=gifts.find(g=>g.id===gid),a=users(),to=a.find(x=>x.id===recipientId);
 if(!gift||!to||to.id===from.id){toast('اختر مستلمًا صحيحًا');return}if(from.coins<gift.price){toast('رصيدك لا يكفي لهذه الهدية');return}
 if(!confirm(`إرسال ${gift.name} إلى ${to.username} مقابل ${fmt(gift.price)} كوين؟`))return;
 let record={id:makeId(),name:gift.name,icon:gift.icon,price:gift.price,fromId:from.id,fromName:from.username,toId:to.id,toName:to.username,at:new Date().toISOString()};
 from.coins-=gift.price;from.giftsSent=from.giftsSent||[];to.giftsReceived=to.giftsReceived||[];from.giftsSent.push(record);to.giftsReceived.push(record);saveU(a);closeModal();toast(`تم إرسال ${gift.name} إلى ${to.username} 🎁`);page('store')
}

function vip(){main.innerHTML=`<h1>👑 VIP</h1><section class="vip"><div class="legendBody" style="padding:5px 0 15px"><div style="font-size:48px">👑</div><h2>VIP قيد التجهيز</h2><p class="muted">أوقفنا نظام الدفع والاشتراكات تمامًا في المرحلة الحالية. سنبنيه معًا بعد الانتهاء من اختبار الموقع والهدايا.</p></div><h2 class="title">المميزات المخطط لها</h2><div class="toggle"><span>👑 شارة VIP بجانب الاسم</span><b>✓</b></div><div class="toggle"><span>🚫 إزالة الإعلانات</span><b>✓</b></div><div class="toggle"><span>👁️ معرفة زيارات الملف</span><b>✓</b></div><div class="toggle"><span>🕶️ إخفاء الزيارة</span><b>✓</b></div><div class="toggle"><span>🔎 بحث متقدم</span><b>✓</b></div><div class="toggle"><span>⚡ أولوية ظهور الحساب</span><b>✓</b></div><br><div class="empty">لا توجد عمليات شراء أو دفع في هذه النسخة التجريبية.</div></section>`}

function settingsPage(){
 let x=me(),s=x.settings||{};x.settings=Object.assign({disableNonFriends:false,disablePrivate:false,disableMedia:false,disabled:false},s);
 let avatarSamples=['https://i.pravatar.cc/300?img=12','https://i.pravatar.cc/300?img=13','https://i.pravatar.cc/300?img=14','https://i.pravatar.cc/300?img=15','https://i.pravatar.cc/300?img=16','https://i.pravatar.cc/300?img=17','https://i.pravatar.cc/300?img=18','https://i.pravatar.cc/300?img=19'];
 main.innerHTML=`<h1>⚙️ الإعدادات</h1><section class="settings">
 <div class="settingSection"><h2>👤 معلومات الحساب</h2><div class="settingsGrid">
 <div class="settingField"><label>الاسم الكامل</label><input id="setFullName" value="${esc(x.fullName||x.username)}"></div>
 <div class="settingField"><label>اسم المستخدم</label><input id="setUsername" value="${esc(x.username)}"></div>
 <div class="settingField"><label>عنوان البريد الإلكتروني</label><input id="setEmail" type="email" value="${esc(x.email)}"></div>
 <div class="settingField"><label>كلمة المرور الجديدة</label><input id="setPassword" type="password" placeholder="اتركها فارغة إذا لا تريد تغييرها"></div>
 <div class="settingField"><label>تأكيد كلمة المرور</label><input id="setPassword2" type="password" placeholder="تأكيد كلمة المرور الجديدة"></div>
 <div class="settingField"><label>العمر</label><input id="setAge" type="number" min="1" max="120" value="${esc(x.age||'')}"></div>
 </div></div>

 <div class="settingSection"><h2>📝 معلومات إضافية</h2><div class="settingsGrid">
 <div class="settingField"><label>الوزن</label><input id="setWeight" type="number" min="1" value="${esc(x.weight||'')}" placeholder="مثال: 75"></div>
 <div class="settingField"><label>الطول</label><input id="setHeight" type="number" min="1" value="${esc(x.height||'')}" placeholder="مثال: 175"></div>
 <div class="settingField"><label>الحالة الاجتماعية</label><select id="setStatus">${['سنجل','مرتبط','متزوج','مطلق','أرمل'].map(v=>`<option ${x.socialStatus===v?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="settingField"><label>الدولة</label><input id="setCountry" value="${esc(x.country||'Egypt')}"></div>
 <div class="settingField full"><label>موقعك</label><input id="setLocation" value="${esc(x.location||'')}" placeholder="المدينة / المنطقة"></div>
 <div class="settingField full"><label>نبذة عني</label><textarea id="setBio" placeholder="اكتب نبذة عنك">${esc(x.bio||'')}</textarea></div>
 </div></div>

 <div class="settingSection"><h2>🖼️ صورة الحساب</h2>
 <div class="avatarChoices">${avatarSamples.map((u,i)=>`<button class="avatarChoice ${x.avatarChoice===String(i)?'selected':''}" onclick="chooseAvatar('${u}','${i}')" id="av${i}"><img src="${u}" alt=""></button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn secondary" onclick="uploadSettingPhoto()">📸 اختيار صورة من الجهاز</button><button class="btn secondary" onclick="clearAvatar()">🗑️ إزالة الصورة</button></div>
 </div>

 <div class="settingSection"><h2>🌄 صورة الغلاف</h2>${x.cover?`<img class="cover" src="${x.cover}" alt="">`:''}<div class="row"><button class="btn secondary" onclick="uploadCover()">🖼️ اختيار صورة</button><button class="btn danger" onclick="removeCover()">إزالة صورة الغلاف</button></div></div>

 <div class="settingSection"><h2>🔔 الإشعارات</h2><div class="settingField"><label>نغمة الإخطار</label><select id="setNotification"><option ${x.notificationStyle==='Decay'?'selected':''}>Decay</option><option ${x.notificationStyle==='Classic'?'selected':''}>Classic</option><option ${x.notificationStyle==='Silent'?'selected':''}>Silent</option></select></div></div>

 <div class="settingSection"><h2>🔒 الخصوصية</h2>
 <div class="toggle"><span>تعطيل الرسائل من غير الأصدقاء</span><select id="setNonFriends" style="max-width:130px"><option value="false" ${!x.settings.disableNonFriends?'selected':''}>لا</option><option value="true" ${x.settings.disableNonFriends?'selected':''}>نعم</option></select></div>
 <div class="toggle"><span>تعطيل المحادثات الخاصة</span><select id="setPrivate" style="max-width:130px"><option value="false" ${!x.settings.disablePrivate?'selected':''}>لا</option><option value="true" ${x.settings.disablePrivate?'selected':''}>نعم</option></select></div>
 <div class="toggle"><span>تعطيل محادثات الفيديو / الصوت الخاصة</span><select id="setMedia" style="max-width:130px"><option value="false" ${!x.settings.disableMedia?'selected':''}>لا</option><option value="true" ${x.settings.disableMedia?'selected':''}>نعم</option></select></div>
 </div>

 <div class="settingSection"><h2>⚠️ الحساب</h2><p class="small muted">تعطيل الحساب يخفيه من قائمة الأعضاء ويمنع تسجيل الدخول حتى تعيد تفعيله من النظام لاحقًا.</p>
 <button class="btn danger" onclick="disableMyAccount()">تعطيل الحساب</button></div>

 <div class="row" style="justify-content:center"><button class="btn" onclick="saveSettings()">💾 تحديث</button><button class="btn secondary" onclick="page('profile')">إلغاء</button></div>
 </section>`;
}
async function saveSettings(){
 let a=users(),x=me(),nu=setUsername.value.trim(),em=setEmail.value.trim().toLowerCase(),pw=setPassword.value,pw2=setPassword2.value;
 if(nu.length<3||!em){toast('أدخل اسم مستخدم وبريدًا صحيحين');return}
 if(a.some(u=>u.id!==x.id&&(u.username.toLowerCase()===nu.toLowerCase()||u.email===em))){toast('اسم المستخدم أو البريد مستخدم بالفعل');return}
 if(pw&&pw!==pw2){toast('كلمتا المرور غير متطابقتين');return}
 x.fullName=setFullName.value.trim()||nu;x.username=nu;x.email=em;if(pw)x.password=pw;x.age=setAge.value;x.weight=setWeight.value;x.height=setHeight.value;x.socialStatus=setStatus.value;x.country=setCountry.value.trim();x.location=setLocation.value.trim();x.bio=setBio.value.trim();x.notificationStyle=setNotification.value;x.settings.disableNonFriends=setNonFriends.value==='true';x.settings.disablePrivate=setPrivate.value==='true';x.settings.disableMedia=setMedia.value==='true';
 saveU(a);toast('تم تحديث الإعدادات بنجاح ✅');profile(x.id)
}
function chooseAvatar(url,i){let a=users(),x=me();x.photo=url;x.avatarChoice=String(i);saveU(a);document.querySelectorAll('.avatarChoice').forEach(e=>e.classList.remove('selected'));document.getElementById('av'+i)?.classList.add('selected');toast('تم اختيار الصورة')}
function uploadSettingPhoto(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;let a=users(),x=me();x.photo=await readFile(i.files[0]);x.avatarChoice='custom';saveU(a);settingsPage()};i.click()}
function clearAvatar(){let a=users(),x=me();x.photo='';x.avatarChoice='';saveU(a);settingsPage()}
function uploadCover(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;let a=users(),x=me();x.cover=await readFile(i.files[0]);saveU(a);settingsPage()};i.click()}
function removeCover(){let a=users(),x=me();x.cover='';saveU(a);settingsPage()}
function disableMyAccount(){
 if(!confirm('هل تريد تعطيل حسابك؟'))return;
 let a=users(),x=me();if(x.role==='OWNER'){toast('لا يمكن تعطيل حساب OWNER من هنا');return}
 x.settings.disabled=true;saveU(a);localStorage.removeItem(SKEY);toast('تم تعطيل الحساب');setTimeout(()=>location.reload(),700)
}

function admin(){
 if(me().role!=='OWNER'){toast('هذه الصفحة للمالك فقط');return}let a=users();main.innerHTML=`<h1>👑 لوحة OWNER</h1><section class="admin"><div class="ownerBox"><b>مالك افـنـدツ⁠يـنـا🥀🖤</b><p class="small muted">هذه لوحة تجريبية محلية. لا يوجد دفع ولا غرف.</p></div><h2 class="title">الإحصائيات</h2><div class="adminGrid"><div class="adminBox">👥<b>${a.length}</b><div class="small muted">الأعضاء</div></div><div class="adminBox">🪙<b>${fmt(a.reduce((s,u)=>s+(u.coins||0),0))}</b><div class="small muted">إجمالي الكوين</div></div><div class="adminBox">🎁<b>${a.reduce((s,u)=>s+(u.giftsReceived?.length||0),0)}</b><div class="small muted">الهدايا</div></div><div class="adminBox">👑<b>OWNER</b><div class="small muted">الصلاحيات</div></div></div><h2 class="title">إدارة الأعضاء</h2>${a.map(u=>`<div class="toggle"><span>${esc(u.username)} ${u.role==='OWNER'?'👑':u.vip?'👑':''}</span>${u.role==='OWNER'?'<b>OWNER</b>':`<button class="btn secondary" onclick="manageUser('${u.id}')">إدارة</button>`}</div>`).join('')}</section>`
}
function manageUser(uid){let a=users(),u=a.find(x=>x.id===uid);if(!u||u.role==='OWNER'){toast('لا يمكن تعديل حساب OWNER من هنا');return}let n=prompt(`رصيد الكوين الجديد لـ ${u.username}`,u.coins||0);if(n===null)return;n=Number(n);if(!Number.isFinite(n)||n<0){toast('قيمة غير صحيحة');return}u.coins=Math.floor(n);saveU(a);toast('تم تحديث الرصيد');admin()}

if(me())boot();
</script>
</body>
</html>
