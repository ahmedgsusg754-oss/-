<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06060a">
<title>الملف الشخصي | افـنـدツينا🥀🖤</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#050507;
  --card:rgba(17,17,24,.86);
  --card2:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.09);
  --text:#fff;
  --muted:#90909d;
  --pink:#ff2d68;
  --purple:#8b5cf6;
  --green:#20d99b;
  --danger:#ff526d;
  --blue:#38bdf8;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  font-family:'Cairo',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(255,45,104,.14),transparent 28%),
    radial-gradient(circle at 90% 100%,rgba(139,92,246,.14),transparent 30%),
    linear-gradient(145deg,#030305,#09090f 50%,#040406);
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:72px;
  border-bottom:1px solid var(--line);
  background:rgba(5,5,8,.86);
  backdrop-filter:blur(25px);
}

.topbar-inner{
  width:min(1200px,calc(100% - 25px));
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ff245f,#8b42ef);
  box-shadow:0 10px 30px rgba(255,45,104,.22);
}

.brand-name{
  font-size:14px;
  font-weight:900;
}

.brand-sub{
  color:#70707b;
  font-size:8px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:13px;
  color:#ddd;
  background:rgba(255,255,255,.04);
}

/* =========================
   PAGE
========================= */

.page{
  width:min(1050px,calc(100% - 25px));
  margin:auto;
  padding:30px 0 70px;
}

/* =========================
   PROFILE COVER
========================= */

.profile-cover{
  position:relative;
  min-height:350px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:30px;
  background:
    linear-gradient(135deg,rgba(255,45,104,.2),rgba(139,92,246,.14)),
    rgba(14,14,20,.8);
  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.cover-glow{
  position:absolute;
  width:350px;
  height:350px;
  border-radius:50%;
  background:#ff2d68;
  opacity:.12;
  filter:blur(80px);
  top:-180px;
  right:-80px;
}

.cover-content{
  position:absolute;
  inset:auto 0 0;
  padding:25px;
  background:linear-gradient(transparent,rgba(4,4,7,.95));
}

.profile-main{
  display:flex;
  align-items:end;
  gap:20px;
}

.avatar-wrap{
  position:relative;
  flex:none;
}

.avatar{
  width:125px;
  height:125px;
  border-radius:35px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:5px solid #0d0d13;
  background:linear-gradient(135deg,#ff2d68,#8b5cf6);
  font-size:45px;
  font-weight:900;
  box-shadow:0 15px 45px rgba(0,0,0,.5);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.online{
  position:absolute;
  width:19px;
  height:19px;
  border:4px solid #0d0d13;
  border-radius:50%;
  background:var(--green);
  left:5px;
  bottom:7px;
}

.profile-info{
  min-width:0;
}

.profile-name{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.profile-name h1{
  font-size:27px;
  font-weight:900;
}

.verified{
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#38bdf8;
  color:#fff;
  font-size:11px;
}

.username{
  color:#858592;
  font-size:11px;
  margin-top:2px;
}

.bio{
  color:#bbb;
  font-size:11px;
  line-height:1.8;
  margin-top:7px;
  max-width:500px;
}

.profile-buttons{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.btn{
  min-height:40px;
  padding:0 15px;
  border-radius:12px;
  border:1px solid var(--line);
  color:#fff;
  background:rgba(255,255,255,.05);
  font-size:10px;
  font-weight:900;
}

.btn.primary{
  border:0;
  background:linear-gradient(135deg,#ff245f,#8b42ef);
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

.stat{
  padding:16px 10px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:17px;
  background:var(--card);
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#777783;
  font-size:9px;
}

/* =========================
   CONTENT
========================= */

.layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:15px;
  margin-top:15px;
}

.card{
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--card);
  padding:19px;
  box-shadow:0 20px 55px rgba(0,0,0,.25);
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.card-title h2{
  font-size:14px;
  font-weight:900;
}

.card-title button{
  border:0;
  color:#ff6b96;
  background:none;
  font-size:9px;
  font-weight:800;
}

/* =========================
   ABOUT
========================= */

.info-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.info{
  display:flex;
  align-items:center;
  gap:10px;
}

.info-icon{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:rgba(255,255,255,.05);
}

.info small{
  display:block;
  color:#696975;
  font-size:8px;
}

.info strong{
  display:block;
  color:#ddd;
  font-size:10px;
  margin-top:2px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tag{
  padding:6px 9px;
  border-radius:9px;
  color:#bbb;
  background:rgba(255,255,255,.05);
  font-size:8px;
}

/* =========================
   POSTS
========================= */

.post-create{
  margin-bottom:15px;
}

.post-input{
  width:100%;
  min-height:85px;
  border:1px solid var(--line);
  border-radius:15px;
  outline:none;
  resize:vertical;
  padding:13px;
  color:#fff;
  background:rgba(255,255,255,.04);
  font-size:11px;
}

.post-input:focus{
  border-color:rgba(255,45,104,.55);
}

.post-tools{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.post-tools label{
  color:#aaa;
  font-size:9px;
  cursor:pointer;
}

.post-tools input{
  display:none;
}

.post-btn{
  height:40px;
  padding:0 17px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(135deg,#ff245f,#8b42ef);
  font-size:10px;
  font-weight:900;
}

.post{
  margin-bottom:14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.025);
  padding:16px;
}

.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.post-user{
  display:flex;
  align-items:center;
  gap:9px;
}

.post-avatar{
  width:38px;
  height:38px;
  border-radius:12px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ff2d68,#8b5cf6);
  font-size:12px;
  font-weight:900;
}

.post-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.post-user strong{
  display:block;
  font-size:10px;
}

.post-date{
  color:#656570;
  font-size:8px;
}

.post-menu{
  border:0;
  background:none;
  color:#777;
  font-size:18px;
}

.post-text{
  color:#ccc;
  font-size:11px;
  line-height:2;
  margin:14px 0;
  white-space:pre-wrap;
}

.post-image{
  width:100%;
  max-height:450px;
  object-fit:cover;
  border-radius:15px;
  margin-bottom:12px;
}

.post-actions{
  display:flex;
  gap:8px;
  border-top:1px solid rgba(255,255,255,.06);
  padding-top:10px;
}

.post-action{
  border:0;
  color:#858592;
  background:none;
  font-size:9px;
  font-weight:800;
}

.post-action.liked{
  color:#ff477a;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(12px);
  opacity:0;
  visibility:hidden;
  transition:.25s;
}

.modal.show{
  opacity:1;
  visibility:visible;
}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:25px;
  padding:23px;
  background:#111117;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-head h3{
  font-size:17px;
}

.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:11px;
  background:rgba(255,255,255,.05);
  color:#aaa;
  font-size:19px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.field{
  margin-bottom:12px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  color:#9999a5;
  font-size:9px;
  margin:0 3px 6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
  color:#fff;
  background:rgba(255,255,255,.045);
  padding:12px;
  font-size:10px;
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:rgba(255,45,104,.55);
}

.save{
  width:100%;
  height:47px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,#ff245f,#8b42ef);
  font-size:11px;
  font-weight:900;
}

.avatar-upload{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.upload-preview{
  width:70px;
  height:70px;
  overflow:hidden;
  border-radius:21px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ff2d68,#8b5cf6);
  font-size:25px;
  font-weight:900;
}

.upload-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.upload-btn{
  position:relative;
  overflow:hidden;
  display:inline-flex;
  align-items:center;
  height:39px;
  padding:0 13px;
  border-radius:11px;
  color:#fff;
  background:rgba(255,255,255,.07);
  font-size:9px;
  font-weight:800;
}

.upload-btn input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

/* =========================
   SETTINGS
========================= */

.settings-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.setting{
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 11px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;
  color:#ddd;
  background:rgba(255,255,255,.025);
  text-align:right;
}

.setting-info{
  display:flex;
  align-items:center;
  gap:9px;
}

.setting-icon{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:rgba(255,255,255,.05);
}

.setting strong{
  display:block;
  font-size:9px;
}

.setting small{
  display:block;
  color:#666672;
  font-size:7px;
  margin-top:2px;
}

.arrow{
  color:#666;
}

.switch{
  width:40px;
  height:22px;
  border-radius:20px;
  border:0;
  background:#292931;
  padding:3px;
}

.switch span{
  display:block;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#777;
  transition:.2s;
}

.switch.active{
  background:linear-gradient(135deg,#ff245f,#8b42ef);
}

.switch.active span{
  transform:translateX(-18px);
  background:#fff;
}

/* =========================
   TOAST
========================= */

.toast-container{
  position:fixed;
  top:85px;
  right:15px;
  z-index:3000;
  width:min(360px,calc(100% - 30px));
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(17,17,23,.96);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation:toastIn .3s ease;
}

.toast-icon{
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:rgba(255,45,104,.1);
}

.toast strong{
  display:block;
  font-size:10px;
}

.toast span{
  display:block;
  color:#858592;
  font-size:8px;
  margin-top:2px;
}

.toast.hide{
  opacity:0;
  transform:translateX(20px);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .profile-cover{
    min-height:380px;
  }

  .profile-main{
    align-items:center;
    flex-direction:column;
    text-align:center;
  }

  .profile-name{
    justify-content:center;
  }

  .profile-buttons{
    justify-content:center;
  }

  .bio{
    margin-left:auto;
    margin-right:auto;
  }
}

@media(max-width:520px){

  .page{
    width:calc(100% - 18px);
    padding-top:18px;
  }

  .brand-sub{
    display:none;
  }

  .profile-cover{
    border-radius:23px;
  }

  .avatar{
    width:105px;
    height:105px;
    border-radius:30px;
  }

  .profile-name h1{
    font-size:23px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .profile-buttons{
    width:100%;
  }

  .profile-buttons .btn{
    flex:1;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="brand">
      <div class="logo">🥀</div>
      <div>
        <div class="brand-name">افـنـدツينا🥀🖤</div>
        <div class="brand-sub">ملفك الشخصي</div>
      </div>
    </div>

    <div class="top-actions">

      <button class="icon-btn" onclick="goHome()">🏠</button>

      <button class="icon-btn" onclick="goRooms()">💬</button>

    </div>

  </div>

</header>


<div class="toast-container" id="toastContainer"></div>


<main class="page">

  <!-- PROFILE HEADER -->

  <section class="profile-cover">

    <div class="cover-glow"></div>

    <div class="cover-content">

      <div class="profile-main">

        <div class="avatar-wrap">

          <div class="avatar" id="profileAvatar">
            أ
          </div>

          <span class="online"></span>

        </div>


        <div class="profile-info">

          <div class="profile-name">

            <h1 id="profileName">
              المستخدم
            </h1>

            <span class="verified">
              ✓
            </span>

          </div>

          <div class="username" id="profileUsername">
            @user
          </div>

          <div class="bio" id="profileBio">
            أهلاً بكم في ملفي الشخصي 🖤
          </div>


          <div class="profile-buttons">

            <button
              class="btn primary"
              onclick="openEdit()"
            >
              ✏️ تعديل الملف
            </button>

            <button
              class="btn"
              onclick="shareProfile()"
            >
              🔗 مشاركة
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">
      <strong id="postsCount">0</strong>
      <span>منشور</span>
    </div>

    <div class="stat">
      <strong id="followersCount">0</strong>
      <span>متابع</span>
    </div>

    <div class="stat">
      <strong id="friendsCount">0</strong>
      <span>صديق</span>
    </div>

    <div class="stat">
      <strong id="levelCount">1</strong>
      <span>المستوى</span>
    </div>

  </section>


  <div class="layout">

    <!-- SIDEBAR -->

    <aside>

      <section class="card">

        <div class="card-title">
          <h2>عنّي</h2>
          <button onclick="openEdit()">تعديل</button>
        </div>

        <div class="info-list">

          <div class="info">

            <div class="info-icon">🎂</div>

            <div>
              <small>العمر</small>
              <strong id="ageInfo">غير محدد</strong>
            </div>

          </div>


          <div class="info">

            <div class="info-icon">📅</div>

            <div>
              <small>تاريخ الميلاد</small>
              <strong id="birthInfo">غير محدد</strong>
            </div>

          </div>


          <div class="info">

            <div class="info-icon">🚻</div>

            <div>
              <small>الجنس</small>
              <strong id="genderInfo">غير محدد</strong>
            </div>

          </div>


          <div class="info">

            <div class="info-icon">📍</div>

            <div>
              <small>المدينة</small>
              <strong id="cityInfo">غير محددة</strong>
            </div>

          </div>


          <div class="info">

            <div class="info-icon">🟢</div>

            <div>
              <small>الحالة</small>
              <strong id="statusInfo">متصل الآن</strong>
            </div>

          </div>

        </div>

      </section>


      <section class="card" style="margin-top:15px">

        <div class="card-title">
          <h2>اهتماماتي</h2>
        </div>

        <div class="tags" id="interests">
          <span class="tag">أضف اهتماماتك</span>
        </div>

      </section>


      <section class="card" style="margin-top:15px">

        <div class="card-title">
          <h2>الإعدادات</h2>
        </div>

        <div class="settings-list">

          <button class="setting" onclick="toggleSetting('notifications')">

            <div class="setting-info">

              <div class="setting-icon">🔔</div>

              <div>
                <strong>الإشعارات</strong>
                <small>إشعارات النشاط</small>
              </div>

            </div>

            <span
              class="switch active"
              id="notificationsSwitch"
            >
              <span></span>
            </span>

          </button>


          <button class="setting" onclick="toggleSetting('online')">

            <div class="setting-info">

              <div class="setting-icon">🟢</div>

              <div>
                <strong>ظهور حالة الاتصال</strong>
                <small>إظهار أنك متصل</small>
              </div>

            </div>

            <span
              class="switch active"
              id="onlineSwitch"
            >
              <span></span>
            </span>

          </button>


          <button class="setting" onclick="openPrivacy()">

            <div class="setting-info">

              <div class="setting-icon">🔒</div>

              <div>
                <strong>الخصوصية</strong>
                <small>التحكم في ظهور بياناتك</small>
              </div>

            </div>
