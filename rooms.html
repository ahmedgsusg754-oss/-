<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080811">
<title>الغرف والدردشة | افـنـدツينا🥀🖤</title>

<style>
:root{
  --bg:#080811;
  --card:#11111d;
  --card2:#171726;
  --text:#fff;
  --muted:#9292a8;
  --border:rgba(255,255,255,.09);
  --pink:#ff3f81;
  --purple:#9d4edd;
  --blue:#4db8ff;
  --green:#38d996;
  --red:#ff4d70;
  --gold:#ffc857;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 85% 0%,rgba(157,78,221,.22),transparent 32%),
    radial-gradient(circle at 0% 100%,rgba(77,184,255,.13),transparent 30%),
    var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:66px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(8,8,17,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.brand{
  font-size:20px;
  font-weight:900;
  background:linear-gradient(90deg,#ff4f9a,#a76cff,#4db8ff);
  -webkit-background-clip:text;
  color:transparent;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:12px;
  color:#fff;
  background:#151521;
}

.page{
  width:min(1250px,100%);
  margin:auto;
  padding:18px 14px 100px;
}

.layout{
  display:grid;
  grid-template-columns:330px minmax(0,1fr);
  gap:15px;
}

.panel{
  background:rgba(17,17,29,.95);
  border:1px solid var(--border);
  border-radius:21px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}

.sidebar{
  padding:15px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title h2{
  font-size:17px;
}

.section-title span{
  color:var(--muted);
  font-size:11px;
}

.search{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.search input{
  width:100%;
  min-width:0;
  background:#0e0e18;
  border:1px solid var(--border);
  color:#fff;
  outline:0;
  border-radius:12px;
  padding:12px;
}

.primary-btn{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  color:#fff;
  font-weight:bold;
  background:linear-gradient(135deg,var(--purple),var(--pink));
}

.room-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:calc(100vh - 205px);
  overflow:auto;
  padding-left:2px;
}

.room-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:right;
  border:1px solid transparent;
  border-radius:15px;
  padding:10px;
  background:#151521;
  color:#fff;
}

.room-item:hover,
.room-item.active{
  border-color:rgba(157,78,221,.45);
  background:#1b1929;
}

.room-avatar{
  width:48px;
  height:48px;
  flex:none;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:22px;
  background:
    linear-gradient(135deg,#322052,#172c48);
}

.room-info{
  min-width:0;
  flex:1;
}

.room-name{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-description{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-members{
  color:#74e5af;
  font-size:10px;
}

.chat{
  min-width:0;
  height:calc(100vh - 102px);
  min-height:620px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.chat-head{
  padding:15px 17px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.room-heading{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.big-room-avatar{
  width:49px;
  height:49px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#34205c,#172b47);
  font-size:23px;
}

.room-heading-info{
  min-width:0;
}

.room-heading-info h1{
  font-size:17px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.room-heading-info p{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.chat-actions{
  display:flex;
  gap:7px;
}

.small-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:#181824;
  color:#fff;
  border-radius:11px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:18px;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.welcome-icon{
  width:70px;
  height:70px;
  border-radius:22px;
  display:grid;
  place-items:center;
  margin:0 auto 12px;
  font-size:32px;
  background:linear-gradient(135deg,#332054,#172c47);
}

.message{
  display:flex;
  gap:9px;
  margin-bottom:14px;
  align-items:flex-start;
}

.message.mine{
  flex-direction:row-reverse;
}

.msg-avatar{
  width:38px;
  height:38px;
  flex:none;
  border-radius:50%;
  object-fit:cover;
  background:#222236;
}

.msg-content{
  max-width:min(76%,620px);
}

.msg-name{
  color:#bdbdd0;
  font-size:11px;
  margin-bottom:4px;
}

.mine .msg-name{
  text-align:right;
}

.bubble{
  padding:10px 12px;
  border-radius:15px;
  background:#191925;
  border:1px solid var(--border);
  line-height:1.75;
  font-size:13px;
  word-break:break-word;
}

.mine .bubble{
  background:linear-gradient(135deg,#513079,#7d3156);
  border-color:transparent;
}

.msg-time{
  color:#68687c;
  font-size:9px;
  margin-top:4px;
}

.message.system{
  justify-content:center;
}

.message.system .bubble{
  background:#151521;
  color:#8f8fa3;
  font-size:11px;
}

.composer{
  padding:12px;
  border-top:1px solid var(--border);
  background:#10101b;
}

.reply{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#191925;
  border:1px solid var(--border);
  border-radius:11px;
  padding:8px 10px;
  margin-bottom:8px;
}

.reply.show{
  display:flex;
}

.reply small{
  color:#aaaabd;
}

.composer-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
}

.composer textarea{
  flex:1;
  min-width:0;
  max-height:130px;
  min-height:45px;
  resize:none;
  background:#171722;
  border:1px solid var(--border);
  outline:0;
  color:#fff;
  border-radius:14px;
  padding:12px;
  line-height:1.5;
}

.send-btn{
  width:48px;
  height:45px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  font-size:18px;
}

.extra-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.extra-actions button{
  border:1px solid var(--border);
  background:#171722;
  color:#aaaabd;
  border-radius:10px;
  padding:7px 10px;
  font-size:11px;
}

.members-panel{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.members-panel.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11111d;
  border:1px solid var(--border);
  border-radius:21px;
  padding:18px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:11px;
  background:#20202d;
  color:#fff;
}

.member{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.member:last-child{
  border-bottom:0;
}

.member-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#222236;
}

.member-info{
  flex:1;
  min-width:0;
}

.member-info strong{
  display:block;
  font-size:13px;
}

.member-info small{
  color:var(--muted);
  font-size:10px;
}

.role{
  color:#ffc857;
  font-size:10px;
}

.form-field{
  margin-bottom:12px;
}

.form-field label{
  display:block;
  font-size:12px;
  color:#c4c4d2;
  margin-bottom:6px;
}

.form-field input,
.form-field textarea,
.form-field select{
  width:100%;
  border:1px solid var(--border);
  outline:0;
  border-radius:12px;
  padding:12px;
  background:#0e0e18;
  color:#fff;
}

.form-field textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.form-actions button{
  flex:1;
}

.danger-btn{
  border:1px solid rgba(255,77,112,.2);
  background:rgba(255,77,112,.08);
  color:#ff8da3;
  border-radius:11px;
  padding:10px 12px;
}

.owner-tools{
  display:none;
  padding:12px;
  margin-bottom:12px;
  border-radius:15px;
  border:1px solid rgba(255,200,87,.18);
  background:linear-gradient(135deg,rgba(157,78,221,.1),rgba(255,200,87,.05));
}

.owner-tools.show{
  display:block;
}

.owner-title{
  color:#ffd66d;
  font-weight:bold;
  font-size:13px;
  margin-bottom:9px;
}

.owner-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.owner-grid button{
  border:1px solid var(--border);
  border-radius:11px;
  padding:10px;
  background:#171722;
  color:#fff;
  text-align:right;
  font-size:11px;
}

.empty-rooms{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
  font-size:12px;
}

.toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:20px;
  transform:translate(-50%,25px);
  opacity:0;
  pointer-events:none;
  background:#1c1c2a;
  color:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px 16px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    order:2;
  }

  .chat{
    height:calc(100vh - 84px);
    min-height:570px;
  }

  .room-list{
    max-height:300px;
  }
}

@media(max-width:550px){
  .page{
    padding:9px 8px 80px;
  }

  .topbar{
    padding:0 10px;
  }

  .brand{
    font-size:17px;
  }

  .chat{
    min-height:540px;
  }

  .messages{
    padding:12px;
  }

  .msg-content{
    max-width:82%;
  }

  .owner-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">افـنـدツينا🥀🖤</div>

  <div class="top-actions">
    <button class="icon-btn" onclick="goHome()">⌂</button>
    <button class="icon-btn" onclick="goProfile()">👤</button>
    <button class="icon-btn" onclick="logout()">↪</button>
  </div>

</header>


<main class="page">

<div class="layout">


<!-- قائمة الغرف -->

<aside class="panel sidebar">

  <div class="section-title">
    <h2>الغرف 💬</h2>
    <span id="roomCount">0 غرفة</span>
  </div>


  <div class="search">

    <input
      id="roomSearch"
      type="search"
      placeholder="ابحث عن غرفة..."
      oninput="renderRooms()"
    >

    <button
      class="primary-btn"
      onclick="openCreateRoom()"
      title="إنشاء غرفة"
    >
      +
    </button>

  </div>


  <div
    id="ownerTools"
    class="owner-tools"
  >

    <div class="owner-title">
      👑 أدوات Owner
    </div>

    <div class="owner-grid">

      <button onclick="ownerRoomAction('manage')">
        ⚙️ إدارة الغرف
      </button>

      <button onclick="ownerRoomAction('members')">
        👥 الأعضاء
      </button>

      <button onclick="ownerRoomAction('messages')">
        💬 الرسائل
      </button>

      <button onclick="ownerRoomAction('reports')">
        🚨 البلاغات
      </button>

    </div>

  </div>


  <div
    id="roomList"
    class="room-list"
  ></div>

</aside>


<!-- الدردشة -->

<section class="panel chat">

  <div class="chat-head">

    <div class="room-heading">

      <div
        id="currentRoomIcon"
        class="big-room-avatar"
      >
        💬
      </div>

      <div class="room-heading-info">

        <h1 id="currentRoomName">
          اختر غرفة
        </h1>

        <p id="currentRoomDescription">
          اختر غرفة من القائمة للبدء
        </p>

      </div>

    </div>


    <div class="chat-actions">

      <button
        class="small-btn"
        onclick="showMembers()"
        title="الأعضاء"
      >
        👥
      </button>

      <button
        class="small-btn"
        onclick="roomSettings()"
        title="الإعدادات"
      >
        ⚙️
      </button>

    </div>

  </div>


  <div
    id="messages"
    class="messages"
  >

    <div class="welcome">

      <div class="welcome-icon">
        💬
      </div>

      <h3>مرحبًا في غرف افندينا</h3>

      <p style="margin-top:8px">
        اختر غرفة من القائمة وابدأ الدردشة.
      </p>

    </div>

  </div>


  <div class="composer">

    <div
      id="replyBox"
      class="reply"
    >

      <small id="replyText">
        الرد على رسالة
      </small>

      <button
        class="close"
        onclick="cancelReply()"
      >
        ×
      </button>

    </div>


    <div class="composer-row">

      <textarea
        id="messageInput"
        rows="1"
        maxlength="2000"
        placeholder="اكتب رسالتك..."
        onkeydown="messageKeyDown(event)"
      ></textarea>

      <button
        class="send-btn"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>


    <div class="extra-actions">

      <button onclick="addEmoji('❤️')">❤️</button>
      <button onclick="addEmoji('😂')">😂</button>
      <button onclick="addEmoji('🔥')">🔥</button>
      <button onclick="addEmoji('🥀')">🥀</button>

      <button onclick="reportRoom()">
        🚨 إبلاغ
      </button>

    </div>

  </div>

</section>

</div>

</main>


<!-- نافذة إنشاء غرفة -->

<div
  id="createRoomModal"
  class="members-panel"
>

  <div class="modal">

    <div class="modal-head">

      <h3>إنشاء غرفة جديدة</h3>

      <button
        class="close"
        onclick="closeModal('createRoomModal')"
      >
        ×
      </button>

    </div>


    <div class="form-field">

      <label>اسم الغرفة</label>

      <input
        id="newRoomName"
        maxlength="50"
        placeholder="مثال: غرفة السهرة"
      >

    </div>


    <div class="form-field">

      <label>وصف الغرفة</label>

      <textarea
        id="newRoomDescription"
        maxlength="200"
        placeholder="اكتب وصفًا للغرفة..."
      ></textarea>

    </div>


    <div class="form-field">

      <label>الأيقونة</label>

      <select id="newRoomIcon">
        <option value="💬">💬 دردشة</option>
        <option value="❤️">❤️ حب</option>
        <option value="🎵">🎵 موسيقى</option>
        <option value="🎮">🎮 ألعاب</option>
        <option value="🌙">🌙 سهر</option>
        <option value="🥀">🥀 افندينا</option>
      </select>

    </div>


    <div class="form-actions">

      <button
        class="small-btn"
        onclick="closeModal('createRoomModal')"
      >
        إلغاء
      </button>

      <button
        class="primary-btn"
        onclick="createRoom()"
      >
        إنشاء الغرفة
      </button>

    </div>

  </div>

</div>


<!-- نافذة الأعضاء -->

<div
  id="membersModal"
  class="members-panel"
>

  <div class="modal">

    <div class="modal-head">

      <h3>
        أعضاء الغرفة
      </h3>

      <button
        class="close"
        onclick="closeModal('membersModal')"
      >
        ×
      </button>

    </div>

    <div id="membersList"></div>

  </div>

</div>


<!-- نافذة إعدادات الغرفة -->

<div
  id="settingsModal"
  class="members-panel"
>

  <div class="modal">

    <div class="modal-head">

      <h3>
        إعدادات الغرفة
      </h3>

      <button
        class="close"
        onclick="closeModal('settingsModal')"
      >
        ×
      </button>

    </div>

    <div class="form-field">

      <label>اسم الغرفة</label>

      <input id="settingsRoomName">

    </div>

    <div class="form-field">

      <label>وصف الغرفة</label>

      <textarea id="settingsRoomDescription"></textarea>

    </div>

    <div class="form-actions">

      <button
        class="danger-btn"
        onclick="leaveRoom()"
      >
        مغادرة الغرفة
      </button>

      <button
        class="primary-btn"
        onclick="saveRoomSettings()"
      >
        حفظ
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

/*
====================================================
 إعدادات الاتصال بالـBackend
====================================================

هذا الملف مبني بحيث يكون Frontend أساسي قابلًا
للربط مع API حقيقي.

ضع رابط API الحقيقي هنا عند إنشاء Backend:

const API_BASE_URL = "https://your-domain.com/api";

الواجهة لن تدّعي أن localStorage قاعدة بيانات حقيقية.
حاليًا يتم استخدامه فقط لحفظ حالة الواجهة أثناء
التطوير المحلي، وسيتم استبداله بطلبات API.
====================================================
*/

const API_BASE_URL = "";


/*
====================================================
 مفاتيح التخزين المحلي للواجهة فقط
====================================================
*/

const ROOMS_KEY = "afandina_rooms_ui";
const CURRENT_ROOM_KEY = "afandina_current_room";
const CURRENT_USER_KEY = "afandina_current_user";


/*
====================================================
 بيانات المستخدم
====================================================
*/

function getCurrentUser(){

  try{

    return JSON.parse(
      localStorage.getItem(CURRENT_USER_KEY)
    );

  }catch(error){

    return null;
  }
}


let currentUser = getCurrentUser();

let rooms = [];

let currentRoom = null;

let replyTo = null;


/*
====================================================
 حماية الصفحة
====================================================
*/

if(!currentUser){

  showToast("يجب تسجيل الدخول أولًا.");

  setTimeout(()=>{
    window.location.href = "auth.html";
  },900);

}


/*
====================================================
 طلبات الـAPI
====================================================

عند وضع API_BASE_URL سيتم استخدام الخادم الحقيقي.
====================================================
*/

async function apiRequest(endpoint,options={}){

  if(!API_BASE_URL){

    throw new Error(
      "API_NOT_CONFIGURED"
    );
  }


  const response =
    await fetch(
      API_BASE_URL + endpoint,
      {
        credentials:"include",
        headers:{
          "Content-Type":"application/json",
          ...(options.headers || {})
        },
        ...options
      }
    );


  if(!response.ok){

    throw new Error(
      "API_ERROR_" + response.status
    );
  }


  return response.json();
}


/*
====================================================
 تحميل الغرف
====================================================
*/

async function loadRooms(){

  /*
   في النظام النهائي:
   GET /rooms

   ويتم تحميل الغرف من قاعدة البيانات.
  */

  if(API_BASE_URL){

    try{

      rooms =
        await apiRequest("/rooms");

      renderRooms();

      return;

    }catch(error){

      showToast(
        "تعذر الاتصال بخادم الغرف."
      );

      return;
    }

  }


  /*
   وضع الواجهة المحلي فقط حتى يمكن اختبار
   التصميم قبل توصيل Backend.
  */

  try{

    rooms =
      JSON.parse(
        localStorage.getItem(ROOMS_KEY)
      ) || [];

  }catch(error){

    rooms = [];

  }


  if(rooms.length === 0){

    rooms = [

      {
        id:"general",
        name:"الغرفة العامة",
        description:"غرفة الجميع للدردشة والتعارف",
        icon:"💬",
        members:1,
        ownerId:null,
        messages:[]
      },

      {
        id:"night",
        name:"سهرة افندينا",
        description:"دردشة السهر والوناسة 🌙",
        icon:"🌙",
        members:0,
        ownerId:null,
        messages:[]
      },

      {
        id:"love",
        name:"قلوب افندينا",
        description:"للحديث عن الحب والمشاعر ❤️",
        icon:"❤️",
        members:0,
        ownerId:null,
        messages:[]
      }

    ];

    saveLocalRooms();

  }


  renderRooms();
}


/*
====================================================
 حفظ الواجهة محليًا
====================================================
*/

function saveLocalRooms(){

  localStorage.setItem(
    ROOMS_KEY,
    JSON.stringify(rooms)
  );
}


/*
====================================================
 عرض الغرف
====================================================
*/

function renderRooms(){

  const container =
    document.getElementById("roomList");

  const search =
    document.getElementById("roomSearch")
      .value
      .trim()
      .toLowerCase();


  container.innerHTML = "";


  const filtered =
    rooms.filter(room =>
      room.name
        .toLowerCase()
        .includes(search)
    );


  document.getElementById("roomCount")
    .textContent =
      rooms.length + " غرفة";


  if(filtered.length === 0){

    container.innerHTML = `
      <div class="empty-rooms">
        لا توجد غرف مطابقة للبحث.
      </div>
    `;

    return;
  }


  filtered.forEach(room => {

    const button =
      document.createElement("button");

    button.className =
      "room-item" +
      (
        currentRoom &&
        currentRoom.id === room.id
          ? " active"
          : ""
      );


    button.innerHTML = `

      <div class="room-avatar">
        ${escapeHtml(room.icon || "💬")}
      </div>

      <div class="room-info">

        <div class="room-name">
          ${escapeHtml(room.name)}
        </div>

        <div class="room-description">
          ${escapeHtml(room.description || "")}
        </div>

      </div>

      <div class="room-members">
        ${Number(room.members || 0)}
      </div>
    `;


    button.onclick = () =>
      enterRoom(room.id);


    container.appendChild(button);

  });

}


/*
====================================================
 الدخول إلى غرفة
====================================================
*/

async function enterRoom(roomId){

  /*
   النظام النهائي:
   POST /rooms/:id/join

   ثم:
   GET /rooms/:id/messages
  */


  if(API_BASE_URL){

    try{

      await apiRequest(
        `/rooms/${encodeURIComponent(roomId)}/join`,
        {
          method:"POST"
        }
      );

      const data =
        await apiRequest(
          `/rooms/${encodeURIComponent(roomId)}`
        );

      currentRoom = data;

      renderRooms();

      renderCurrentRoom();

      return;

    }catch(error){

      showToast(
        "تعذر الدخول إلى الغرفة."
      );

      return;
    }

  }


  currentRoom =
    rooms.find(
      room => room.id === roomId
    );


  if(!currentRoom) return;


  if(
    !Array.isArray(currentRoom.messages)
  ){
    currentRoom.messages = [];
  }


  currentRoom.members =
    Math.max(
      1,
      Number(currentRoom.members || 0)
    );


  localStorage.setItem(
    CURRENT_ROOM_KEY,
    currentRoom.id
  );


  saveLocalRooms();

  renderRooms();

  renderCurrentRoom();

}


/*
====================================================
 عرض الغرفة
====================================================
*/

function renderCurrentRoom(){

  if(!currentRoom) return;


  document.getElementById("currentRoomName")
    .textContent =
      currentRoom.name;


  document.getElementById("currentRoomDescription")
    .textContent =
      currentRoom.description || "";


  document.getElementById("currentRoomIcon")
    .textContent =
      currentRoom.icon || "💬";


  renderMessages();

}


/*
====================================================
 الرسائل
====================================================
*/

function renderMessages(){

  const container =
    document.getElementById("messages");

  container.innerHTML = "";


  if(!currentRoom){

    container.innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">💬</div>
        <h3>اختر غرفة</h3>
        <p style="margin-top:8px">
          اختر غرفة من القائمة لبدء الدردشة.
        </p>
      </div>
    `;

    return;
  }


  const messages =
    Array.isArray(currentRoom.messages)
      ? currentRoom.messages
      : [];


  if(messages.length === 0){

    container.innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">
          ${escapeHtml(currentRoom.icon || "💬")}
        </div>
        <h3>
          ${escapeHtml(currentRoom.name)}
        </h3>
        <p style="margin-top:8px">
          لا توجد رسائل حتى الآن.
          كن أول من يبدأ الحديث 👋
        </p>
      </div>
    `;

    return;
  }


  messages.forEach(message => {

    const wrapper =
      document.createElement("div");


    if(message.system){

      wrapper.className =
        "message system";

      wrapper.innerHTML = `
        <div class="bubble">
          ${escapeHtml(message.text)}
        </div>
      `;

      container.appendChild(wrapper);

      return;
    }


    const isMine =
      currentUser &&
      message.userId === currentUser.id;


    wrapper.className =
      "message" +
      (isMine ? " mine" : "");


    const avatar =
      message.avatar ||
      "https://ui-avatars.com/api/?name=" +
      encodeURIComponent(
        message.userName || "User"
      ) +
      "&background=202036&color=fff";


    const time =
      message.createdAt
        ? new Date(
            message.createdAt
          ).toLocaleTimeString(
            "ar-EG",
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          )
        : "";


    wrapper.innerHTML = `

      <img
        class="msg-avatar"
        src="${escapeAttr(avatar)}"
        alt=""
      >

      <div class="msg-content">

        <div class="msg-name">
          ${escapeHtml(message.userName || "مستخدم")}
          ${
            message.role === "owner"
              ? " 👑"
              : ""
          }
        </div>

        <div class="bubble">
          ${escapeHtml(message.text)}
        </div>

        <div class="msg-time">
          ${escapeHtml(time)}
        </div>

      </div>

    `;


    wrapper
      .querySelector(".bubble")
      .addEventListener(
        "dblclick",
        ()=>{
          setReply(message);
        }
      );


    container.appendChild(wrapper);

  });


  container.scrollTop =
    container.scrollHeight;
}


/*
====================================================
 إرسال رسالة
====================================================
*/

async function sendMessage(){

  if(!currentRoom){

    showToast("اختر غرفة أولًا.");

    return;
  }


  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();


  if(!text) return;


  /*
   النظام النهائي:
   POST /rooms/:id/messages

   الرسالة يتم حفظها في قاعدة البيانات
   وإرسالها لباقي المستخدمين عبر WebSocket.
  */

  if(API_BASE_URL){

    try{

      await apiRequest(
        `/rooms/${encodeURIComponent(currentRoom.id)}/messages`,
        {
          method:"POST",
          body:JSON.stringify({
            text:text,
            replyTo:replyTo
              ? replyTo.id
              : null
          })
        }
      );

      input.value = "";

      cancelReply();

      await refreshRoomMessages();

      return;

    }catch(error){

      showToast(
        "تعذر إرسال الرسالة."
      );

      return;
    }

  }


  /*
   التخزين المحلي هنا ليس قاعدة بيانات.
   يستخدم فقط حتى لا تتعطل الواجهة قبل ربط Backend.
  */

  if(!Array.isArray(currentRoom.messages)){
    currentRoom.messages = [];
  }


  currentRoom.messages.push({

    id:
      "msg_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2,7),

    userId:
      currentUser.id,

    userName:
      currentUser.name,

    role:
      currentUser.role || "user",

    avatar:
      currentUser.avatar || "",

    text:text,

    replyTo:
      replyTo
        ? replyTo.id
        : null,

    createdAt:
      new Date().toISOString()

  });


  input.value = "";

  cancelReply();

  saveLocalRooms();

  renderMessages();

}


/*
====================================================
 تحديث رسائل الغرفة من الخادم
====================================================
*/

async function refreshRoomMessages(){

  if(!API_BASE_URL || !currentRoom){
    return;
  }


  try{

    const data =
      await apiRequest(
        `/rooms/${encodeURIComponent(currentRoom.id)}/messages`
      );


    currentRoom.messages =
      Array.isArray(data)
        ? data
        : data.messages || [];


    renderMessages();

  }catch(error){

    console.error(error);

  }
}


/*
====================================================
 Enter للإرسال
====================================================
*/

function messageKeyDown(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/*
====================================================
 Emojis
====================================================
*/

function addEmoji(emoji){

  const input =
    document.getElementById("messageInput");


  input.value += emoji;

  input.focus();

}


/*
====================================================
 الرد على رسالة
====================================================
*/

function setReply(message){

  replyTo = message;


  document.getElementById("replyText")
    .textContent =
      "الرد على: " +
      (message.userName || "مستخدم") +
      " — " +
      String(message.text || "")
        .slice(0,70);


  document.getElementById("replyBox")
    .classList.add("show");


  document.getElementById("messageInput")
    .focus();
}


function cancelReply(){

  replyTo = null;

  document.getElementById("replyBox")
    .classList.remove("show");
}


/*
====================================================
 إنشاء غرفة
====================================================
*/

async function createRoom(){

  const name =
    document.getElementById("newRoomName")
      .value.trim();

  const description =
    document.getElementById("newRoomDescription")
      .value.trim();

  const icon =
    document.getElementById("newRoomIcon")
      .value;


  if(name.length < 2){

    showToast(
      "اسم الغرفة قصير جدًا."
    );

    return;
  }


  /*
   النظام النهائي:
   POST /rooms

   ويتم التحقق من الصلاحيات في الخادم.
  */

  if(API_BASE_URL){

    try{

      const room =
        await apiRequest(
          "/rooms",
          {
            method:"POST",
            body:JSON.stringify({
              name,
              description,
              icon
            })
          }
        );


      rooms.unshift(room);

      renderRooms();

      closeModal("createRoomModal");

      showToast(
        "تم إنشاء الغرفة بنجاح."
      );

      enterRoom(room.id);

      return;

    }catch(error){

      showToast(
        "تعذر إنشاء الغرفة."
      );

      return;
    }

  }


  /*
   وضع الواجهة المحلي فقط.
  */

  const room = {

    id:
      "room_" +
      Date.now(),

    name:name,

    description:description,

    icon:icon,

    members:1,

    ownerId:
      currentUser.id,

    ownerName:
      currentUser.name,

    messages:[]

  };


  rooms.unshift(room);

  saveLocalRooms();

  renderRooms();

  closeModal("createRoomModal");

  document.getElementById("newRoomName")
    .value = "";

  document.getElementById("newRoomDescription")
    .value = "";


  showToast(
    "تم إنشاء الغرفة."
  );


  enterRoom(room.id);

}


/*
====================================================
 فتح إنشاء غرفة
====================================================
*/

function openCreateRoom(){

  document.getElementById("createRoomModal")
    .classList.add("show");

}


/*
====================================================
 الأعضاء
====================================================
*/

async function showMembers(){

  if(!currentRoom){

    showToast("اختر غرفة أولًا.");

    return;
  }


  const container =
    document.getElementById("membersList");

  container.innerHTML = "";


  /*
   النظام النهائي:
   GET /rooms/:id/members
  */

  if(API_BASE_URL){

    try{

      const members =
        await apiRequest(
          `/rooms/${encodeURIComponent(currentRoom.id)}/members`
        );


      renderMembers(members);

      return;

    }catch(error){

      showToast(
        "تعذر تحميل الأعضاء."
      );

      return;
    }

  }


  /*
   بيانات محلية مؤقتة للواجهة.
  */

  const members = [

    {
      id:currentUser.id,
      name:currentUser.name,
      avatar:currentUser.avatar,
      role:
        currentUser.role === "owner"
          ? "owner"
          : "member"
    }

  ];


  renderMembers(members);

}


function renderMembers(members){

  const container =
    document.getElementById("membersList");

  container.innerHTML = "";


  if(!Array.isArray(members) || !members.length){

    container.innerHTML = `
      <div class="empty-rooms">
        لا يوجد أعضاء حاليًا.
      </div>
    `;

  }else{

    members.forEach(member => {

      const row =
        document.createElement("div");

      row.className = "member";


      const avatar =
        member.avatar ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(member.name || "User") +
        "&background=202036&color=fff";


      row.innerHTML = `

        <img
          class="member-avatar"
          src="${escapeAttr(avatar)}"
          alt=""
        >

        <div class="member-info">

          <strong>
            ${escapeHtml(member.name || "مستخدم")}
          </strong>

          <small>
            ${
              member.role === "owner"
                ? "👑 Owner"
                : member.role === "moderator"
                  ? "🛡️ مشرف"
                  : "عضو"
            }
          </small>

        </div>

      `;


      container.appendChild(row);

    });

  }


  document.getElementById("membersModal")
    .classList.add("show");
}


/*
====================================================
 إعدادات الغرفة
====================================================
*/

function roomSettings(){

  if(!currentRoom){

    showToast("اختر غرفة أولًا.");

    return;
  }


  document.getElementById("settingsRoomName")
    .value =
      currentRoom.name || "";


  document.getElementById("settingsRoomDescription")
    .value =
      currentRoom.description || "";


  document.getElementById("settingsModal")
    .classList.add("show");
}


async function saveRoomSettings(){

  if(!currentRoom) return;


  const name =
    document.getElementById("settingsRoomName")
      .value.trim();

  const description =
    document.getElementById("settingsRoomDescription")
      .value.trim();


  if(!name){

    showToast(
      "اكتب اسم الغرفة."
    );

    return;
  }


  /*
   النظام النهائي:
   PATCH /rooms/:id

   والخادم هو الذي يقرر هل المستخدم
   Owner/مشرف ولديه صلاحية التعديل أم لا.
  */

  if(API_BASE_URL){

    try{

      const updated =
        await apiRequest(
          `/rooms/${encodeURIComponent(currentRoom.id)}`,
          {
            method:"PATCH",
            body:JSON.stringify({
              name,
              description
            })
          }
        );


      currentRoom = updated;

      await loadRooms();

      renderCurrentRoom();

      closeModal("settingsModal");

      showToast(
        "تم حفظ إعدادات الغرفة."
      );

      return;

    }catch(error){

      showToast(
        "ليس لديك صلاحية تعديل الغرفة أو حدث خطأ."
      );

      return;
    }

  }


  /*
   الواجهة المحلية فقط.
  */

  currentRoom.name = name;
  currentRoom.description = description;

  saveLocalRooms();

  renderRooms();
  renderCurrentRoom();

  closeModal("settingsModal");

  showToast(
    "تم حفظ إعدادات الغرفة."
  );

}


/*
====================================================
 مغادرة الغرفة
====================================================
*/

async function leaveRoom(){

  if(!currentRoom) return;


  if(
    !confirm(
      "هل تريد مغادرة هذه الغرفة؟"
    )
  ){
    return;
  }


  if(API_BASE_URL){

    try{

      await apiRequest(
        `/rooms/${encodeURIComponent(currentRoom.id)}/leave`,
        {
          method:"POST"
        }
      );

    }catch(error){

      showToast(
        "تعذر مغادرة الغرفة."
      );

      return;
    }

  }else{

    currentRoom.members =
      Math.max(
        0,
        Number(currentRoom.members || 0) - 1
      );

    saveLocalRooms();

  }


  currentRoom = null;

  localStorage.removeItem(
    CURRENT_ROOM_KEY
  );


  renderRooms();
  renderCurrentRoom();

  closeModal("settingsModal");

  showToast(
    "تمت مغادرة الغرفة."
  );

}


/*
====================================================
 البلاغ
====================================================
*/

async function reportRoom(){

  if(!currentRoom){

    showToast("اختر غرفة أولًا.");

    return;
  }


  const reason =
    prompt(
      "اكتب سبب الإبلاغ عن الغرفة:"
    );


  if(!reason || !reason.trim()){
    return;
  }


  if(API_BASE_URL){

    try{

      await apiRequest(
        `/reports`,
        {
          method:"POST",
          body:JSON.stringify({
            type:"room",
            targetId:currentRoom.id,
            reason:reason.trim()
          })
        }
      );


      showToast(
        "تم إرسال البلاغ للمراجعة."
      );

      return;

    }catch(error){

      showToast(
        "تعذر إرسال البلاغ."
      );

      return;
    }

  }


  showToast(
    "تم تسجيل البلاغ للمراجعة."
  );

}

 صلاحيات Owner

/*
====================================================
 إشعار
====================================================
*/

let toastTimer;

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      ()=>{
        toast.classList.remove("show");
      },
      2600
    );

}


/*
====================================================
 حماية النصوص
====================================================
*/

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


/*
====================================================
 تهيئة الصفحة
====================================================
*/

async function init(){

  if(!currentUser) return;


  if(
    currentUser.role === "owner"
  ){

    document
      .getElementById("ownerTools")
      .classList.add("show");

  }


  await loadRooms();


  const savedRoom =
    localStorage.getItem(
      CURRENT_ROOM_KEY
    );


  if(savedRoom){

    const exists =
      rooms.some(
        room => room.id === savedRoom
      );


    if(exists){

      await enterRoom(savedRoom);

    }

  }

}


init();


/*
====================================================
 تحديث دوري عند استخدام Backend
====================================================
*/

setInterval(
  async ()=>{
    if(
      API_BASE_URL &&
      currentRoom
    ){
      await refreshRoomMessages();
    }
  },
  5000
);

</script>
