<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<meta name="color-scheme" content="dark">

<title>افـنـدツينا🥀🖤 — المصادقة</title>

<meta name="description" content="تسجيل الدخول وإنشاء الحساب واستعادة كلمة المرور في افـنـدツينا🥀🖤">

<style>
:root{
  --bg:#07060b;
  --bg2:#0d0b13;
  --card:rgba(255,255,255,.065);
  --border:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#a5a1b2;
  --primary:#9858ff;
  --primary2:#d15cff;
  --danger:#ff557c;
  --success:#42dc91;
  --warning:#ffc857;
  --shadow:0 30px 90px rgba(0,0,0,.45);
  --radius:24px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  min-height:100%;
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    radial-gradient(circle at 15% 15%,rgba(152,88,255,.18),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(209,92,255,.12),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(152,88,255,.08),transparent 35%),
    linear-gradient(135deg,#05050a,#0b0911 50%,#06060a);

  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

/* =========================
   BACKGROUND
========================= */

.background{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
  pointer-events:none;
}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:.18;
}

.orb.one{
  width:260px;
  height:260px;
  top:-80px;
  right:-70px;
  background:#9858ff;
}

.orb.two{
  width:220px;
  height:220px;
  bottom:-70px;
  left:-60px;
  background:#d15cff;
}

.orb.three{
  width:130px;
  height:130px;
  top:45%;
  left:45%;
  background:#6840ff;
  opacity:.08;
}

/* =========================
   PAGE
========================= */

.page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px 16px;
}

.auth-wrapper{
  width:min(100%,520px);
}

/* =========================
   BRAND
========================= */

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
  user-select:none;
}

.brand-logo{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 14px 35px rgba(152,88,255,.30);
  font-size:23px;
}

.brand-name{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.4px;
}

/* =========================
   CARD
========================= */

.auth-card{
  position:relative;
  overflow:hidden;
  padding:28px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:rgba(13,12,19,.78);
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.auth-card::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  top:-110px;
  right:-80px;
  border-radius:50%;
  background:rgba(152,88,255,.13);
  filter:blur(5px);
  pointer-events:none;
}

/* =========================
   HEADING
========================= */

.heading{
  position:relative;
  text-align:center;
  margin-bottom:22px;
}

.logo-large{
  width:66px;
  height:66px;
  display:grid;
  place-items:center;
  margin:0 auto 14px;
  border-radius:21px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 15px 38px rgba(152,88,255,.27);
  font-size:29px;
}

.heading h1{
  font-size:26px;
  line-height:1.3;
  margin-bottom:7px;
}

.heading p{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}

/* =========================
   TABS
========================= */

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:5px;
  margin-bottom:20px;
  border:1px solid rgba(255,255,255,.05);
  border-radius:15px;
  background:rgba(255,255,255,.035);
}

.tab{
  height:43px;
  border:0;
  border-radius:11px;
  color:var(--muted);
  background:transparent;
  transition:.2s ease;
}

.tab:hover{
  color:#fff;
  background:rgba(255,255,255,.045);
}

.tab.active{
  color:#fff;
  background:
    linear-gradient(
      135deg,
      rgba(152,88,255,.28),
      rgba(209,92,255,.13)
    );
}

/* =========================
   FORMS
========================= */

.form{
  display:none;
}

.form.active{
  display:grid;
  gap:14px;
  animation:formIn .22s ease;
}

@keyframes formIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.field{
  display:grid;
  gap:7px;
}

.field label{
  font-size:12px;
  font-weight:800;
}

.field-hint{
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
}

.input-wrap{
  position:relative;
}

.input{
  width:100%;
  min-height:48px;
  padding:11px 13px;
  border:1px solid var(--border);
  border-radius:13px;
  color:#fff;
  background:rgba(255,255,255,.045);
  transition:.2s ease;
}

.input::placeholder{
  color:#777384;
}

.input:hover{
  border-color:rgba(255,255,255,.15);
}

.input:focus{
  border-color:rgba(152,88,255,.65);
  box-shadow:0 0 0 3px rgba(152,88,255,.09);
}

.input.invalid{
  border-color:rgba(255,85,124,.70);
  box-shadow:0 0 0 3px rgba(255,85,124,.07);
}

.input.valid{
  border-color:rgba(66,220,145,.50);
  box-shadow:0 0 0 3px rgba(66,220,145,.05);
}

.password-input{
  padding-left:52px;
}

.password-toggle{
  position:absolute;
  left:5px;
  top:50%;
  width:40px;
  height:38px;
  display:grid;
  place-items:center;
  transform:translateY(-50%);
  border:0;
  border-radius:10px;
  color:var(--muted);
  background:transparent;
}

.password-toggle:hover{
  color:#fff;
  background:rgba(255,255,255,.06);
}

/* =========================
   PASSWORD STRENGTH
========================= */

.password-strength{
  display:grid;
  gap:7px;
}

.strength-bars{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.strength-bar{
  height:4px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  transition:.2s ease;
}

.strength-text{
  color:var(--muted);
  font-size:10px;
}

/* =========================
   CHECKBOX
========================= */

.check-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.check-row input{
  width:17px;
  height:17px;
  margin-top:1px;
  accent-color:var(--primary);
}

/* =========================
   BUTTON
========================= */

.submit{
  width:100%;
  min-height:48px;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  margin-top:3px;
  border:1px solid rgba(152,88,255,.35);
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 13px 32px rgba(152,88,255,.20);
  transition:.2s ease;
  font-weight:850;
}

.submit:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 17px 38px rgba(152,88,255,.27);
}

.submit:active:not(:disabled){
  transform:translateY(0);
}

/* =========================
   LINKS
========================= */

.form-links{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:2px;
}

.link-btn{
  border:0;
  color:#c6a6ff;
  background:transparent;
  font-size:11px;
  font-weight:800;
}

.link-btn:hover{
  color:#fff;
  text-decoration:underline;
}

.center-link{
  display:block;
  width:max-content;
  margin:2px auto 0;
}

/* =========================
   ALERT
========================= */

.alert{
  display:none;
  margin-bottom:14px;
  padding:12px 14px;
  border:1px solid transparent;
  border-radius:13px;
  font-size:11px;
  line-height:1.8;
}

.alert.show{
  display:block;
}

.alert.error{
  color:#ffb6c7;
  border-color:rgba(255,85,124,.25);
  background:rgba(255,85,124,.08);
}

.alert.success{
  color:#a1f3c7;
  border-color:rgba(66,220,145,.25);
  background:rgba(66,220,145,.08);
}

.alert.warning{
  color:#ffe19a;
  border-color:rgba(255,200,87,.25);
  background:rgba(255,200,87,.08);
}

/* =========================
   SPINNER
========================= */

.spinner{
  width:17px;
  height:17px;
  display:inline-block;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   FOOTER
========================= */

.footer{
  margin-top:18px;
  text-align:center;
  color:#777383;
  font-size:10px;
  line-height:1.8;
}

/* =========================
   ACCESSIBILITY
========================= */

button:focus-visible,
input:focus-visible{
  outline:2px solid rgba(209,92,255,.8);
  outline-offset:3px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:560px){

  .page{
    padding:18px 12px;
  }

  .auth-card{
    padding:22px 15px;
    border-radius:21px;
  }

  .brand{
    margin-bottom:14px;
  }

  .brand-logo{
    width:43px;
    height:43px;
    border-radius:13px;
  }

  .brand-name{
    font-size:16px;
  }

  .heading h1{
    font-size:23px;
  }

  .logo-large{
    width:60px;
    height:60px;
    border-radius:19px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="background" aria-hidden="true">
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
</div>

<main class="page">

  <div class="auth-wrapper">

    <div class="brand">
      <div class="brand-logo">🥀</div>
      <div class="brand-name">افـنـدツينا🥀🖤</div>
    </div>

    <section class="auth-card">

      <div class="heading">

        <div class="logo-large">🥀</div>

        <h1 id="pageTitle">
          أهلاً بك
        </h1>

        <p id="pageSubtitle">
          سجّل الدخول إلى حسابك أو أنشئ حسابًا جديدًا.
        </p>

      </div>

      <div
        class="alert"
        id="alert"
        role="alert"
        aria-live="polite"
      ></div>

      <!-- التبويبات -->

      <div class="tabs" id="mainTabs">

        <button
          type="button"
          class="tab active"
          id="loginTab"
          aria-selected="true"
        >
          تسجيل الدخول
        </button>

        <button
          type="button"
          class="tab"
          id="registerTab"
          aria-selected="false"
        >
          إنشاء حساب
        </button>

      </div>

      <!-- تسجيل الدخول -->

      <form
        class="form active"
        id="loginForm"
        method="post"
        action=""
        novalidate
      >

        <div class="field">

          <label for="loginIdentifier">
            البريد الإلكتروني أو اسم المستخدم
          </label>

          <input
            class="input"
            id="loginIdentifier"
            name="identifier"
            type="text"
            autocomplete="username"
            minlength="3"
            maxlength="254"
            required
            placeholder="أدخل البريد أو اسم المستخدم"
          >

        </div>

        <div class="field">

          <label for="loginPassword">
            كلمة المرور
          </label>

          <div class="input-wrap">

            <input
              class="input password-input"
              id="loginPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="6"
              maxlength="128"
              required
              placeholder="أدخل كلمة المرور"
            >

            <button
              class="password-toggle"
              type="button"
              data-password-toggle="loginPassword"
              aria-label="إظهار كلمة المرور"
            >
              👁
            </button>

          </div>

        </div>

        <div class="form-links">

          <button
            type="button"
            class="link-btn"
            id="forgotLink"
          >
            نسيت كلمة المرور؟
          </button>

        </div>

        <button
          class="submit"
          id="loginSubmit"
          type="submit"
        >
          <span class="button-text">تسجيل الدخول</span>
          <span class="spinner hidden"></span>
        </button>

      </form>

      <!-- إنشاء حساب -->

      <form
        class="form"
        id="registerForm"
        method="post"
        action=""
        novalidate
      >

        <div class="field">

          <label for="registerUsername">
            اسم المستخدم
          </label>

          <input
            class="input"
            id="registerUsername"
            name="username"
            type="text"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            required
            placeholder="اختر اسم المستخدم"
            dir="auto"
          >

          <div class="field-hint">
            من 3 إلى 30 حرفًا أو رقمًا، بدون مسافات أو رموز غير مسموحة.
          </div>

        </div>

        <div class="field">

          <label for="registerEmail">
            البريد الإلكتروني
          </label>

          <input
            class="input"
            id="registerEmail"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            required
            placeholder="example@email.com"
            dir="ltr"
          >

        </div>

        <div class="field">

          <label for="registerPassword">
            كلمة المرور
          </label>

          <div class="input-wrap">

            <input
              class="input password-input"
              id="registerPassword"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
              placeholder="أنشئ كلمة مرور قوية"
            >

            <button
              class="password-toggle"
              type="button"
              data-password-toggle="registerPassword"
              aria-label="إظهار كلمة المرور"
            >
              👁
            </button>

          </div>

          <div class="password-strength">

            <div class="strength-bars">

              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>

            </div>

            <span
              class="strength-text"
              id="strengthText"
            >
              استخدم 8 أحرف على الأقل.
            </span>

          </div>

        </div>

        <div class="field">

          <label for="registerConfirm">
            تأكيد كلمة المرور
          </label>

          <div class="input-wrap">

            <input
              class="input password-input"
              id="registerConfirm"
              name="password_confirmation"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
              placeholder="أعد كتابة كلمة المرور"
            >

            <button
              class="password-toggle"
              type="button"
              data-password-toggle="registerConfirm"
              aria-label="إظهار كلمة المرور"
            >
              👁
            </button>

          </div>

        </div>

        <label class="check-row">

          <input
            id="termsCheck"
            name="terms"
            type="checkbox"
            required
          >

          <span>
            أوافق على الشروط وسياسة الاستخدام.
          </span>

        </label>

        <button
          class="submit"
          id="registerSubmit"
          type="submit"
        >
          <span class="button-text">إنشاء الحساب</span>
          <span class="spinner hidden"></span>
        </button>

      </form>

      <!-- نسيت كلمة المرور -->

      <form
        class="form"
        id="forgotForm"
        method="post"
        action=""
        novalidate
      >

        <div class="field">

          <label for="forgotEmail">
            البريد الإلكتروني
          </label>

          <input
            class="input"
            id="forgotEmail"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            required
            placeholder="أدخل بريد حسابك"
            dir="ltr"
          >

        </div>

        <button
          class="submit"
          id="forgotSubmit"
          type="submit"
        >
          <span class="button-text">
            إرسال طلب الاستعادة
          </span>

          <span class="spinner hidden"></span>
        </button>

        <button
          type="button"
          class="link-btn center-link"
          id="backToLogin"
        >
          العودة إلى تسجيل الدخول
        </button>

      </form>

      <!-- تغيير كلمة المرور -->

      <form
        class="form"
        id="resetForm"
        method="post"
        action=""
        novalidate
      >

        <div class="field">

          <label for="resetPassword">
            كلمة المرور الجديدة
          </label>

          <div class="input-wrap">

            <input
              class="input password-input"
              id="resetPassword"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
              placeholder="أدخل كلمة المرور الجديدة"
            >

            <button
              class="password-toggle"
              type="button"
              data-password-toggle="resetPassword"
              aria-label="إظهار كلمة المرور"
            >
              👁
            </button>

          </div>

        </div>

        <div class="field">

          <label for="resetConfirm">
            تأكيد كلمة المرور الجديدة
          </label>

          <div class="input-wrap">

            <input
              class="input password-input"
              id="resetConfirm"
              name="password_confirmation"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
              placeholder="أعد كتابة كلمة المرور"
            >

            <button
              class="password-toggle"
              type="button"
              data-password-toggle="resetConfirm"
              aria-label="إظهار كلمة المرور"
            >
              👁
            </button>

          </div>

        </div>

        <button
          class="submit"
          id="resetSubmit"
          type="submit"
        >
          <span class="button-text">
            تغيير كلمة المرور
          </span>

          <span class="spinner hidden"></span>
        </button>

        <button
          type="button"
          class="link-btn center-link"
          id="resetBackToLogin"
        >
          العودة إلى تسجيل الدخول
        </button>

      </form>

    </section>

    <div class="footer">
      افـنـدツينا🥀🖤
    </div>

  </div>

</main>

<script>
"use strict";

/* =========================================================
   افـنـدツينا🥀🖤
   AUTH SYSTEM
   =========================================================

   مهم:
   هذا الملف لا ينشئ حسابات وهمية.
   لا يخزن كلمات المرور.
   لا يضع كلمات مرور داخل المتصفح.
   التحقق الموجود هنا للتحقق من إدخال المستخدم فقط.

   يجب أن تكون خدمات المصادقة في الخادم هي المسؤولة
   عن إنشاء الحساب وتسجيل الدخول وتخزين كلمات المرور
   بشكل آمن.
========================================================= */


/* =========================================================
   HELPERS
========================================================= */

const $ = (selector, root = document) =>
  root.querySelector(selector);

const $$ = (selector, root = document) =>
  [...root.querySelectorAll(selector)];


/* =========================================================
   ELEMENTS
========================================================= */

const pageTitle = $("#pageTitle");
const pageSubtitle = $("#pageSubtitle");
const alertBox = $("#alert");

const mainTabs = $("#mainTabs");
const loginTab = $("#loginTab");
const registerTab = $("#registerTab");

const loginForm = $("#loginForm");
const registerForm = $("#registerForm");
const forgotForm = $("#forgotForm");
const resetForm = $("#resetForm");

const forgotLink = $("#forgotLink");
const backToLogin = $("#backToLogin");
const resetBackToLogin = $("#resetBackToLogin");

const loginIdentifier = $("#loginIdentifier");
const loginPassword = $("#loginPassword");

const registerUsername = $("#registerUsername");
const registerEmail = $("#registerEmail");
const registerPassword = $("#registerPassword");
const registerConfirm = $("#registerConfirm");
const termsCheck = $("#termsCheck");

const forgotEmail = $("#forgotEmail");

const resetPassword = $("#resetPassword");
const resetConfirm = $("#resetConfirm");

const strengthText = $("#strengthText");
const strengthBars = $$(".strength-bar");


/* =========================================================
   ALERT
========================================================= */

let alertTimer = null;

function showAlert(message, type = "error") {

  clearTimeout(alertTimer);

  alertBox.textContent = message;
  alertBox.className = "alert show " + type;

  alertBox.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });

  alertTimer = setTimeout(() => {

    alertBox.className = "alert";
    alertBox.textContent = "";

  }, 9000);
}

function clearAlert() {

  clearTimeout(alertTimer);

  alertBox.className = "alert";
  alertBox.textContent = "";
}

/* =========================================================
   USERNAME
========================================================= */

/*
   الإصلاح الأساسي:

   يقبل:
   - الحروف العربية
   - الحروف الإنجليزية
   - الأرقام العربية
   - الأرقام الإنجليزية
   - الشرطة السفلية

   الطول:
   3 إلى 30

   يمنع:
   - المسافات
   - الإيموجي
   - الرموز الغريبة
   - النص الفارغ

   استخدام Unicode Property Escapes يجعل التحقق
   أفضل من حصر العربية في نطاق Unicode ضيق.
*/

function normalizeUsername(value) {

  return String(value || "")
    .normalize("NFC")
    .trim();
}

function validUsername(value) {

  const username = normalizeUsername(value);

  if(username.length < 3 || username.length > 30) {
    return false;
  }

  try {

    return /^[\p{L}\p{N}_]+$/u.test(username);

  } catch {

    return /^[A-Za-z0-9_\u0600-\u06FF]+$/.test(username);

  }
}


/* =========================================================
   EMAIL
========================================================= */

function validEmail(value) {

  const email = String(value || "")
    .trim();

  if(!email || email.length > 254) {
    return false;
  }

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}


/* =========================================================
   PASSWORD
========================================================= */

function passwordScore(password) {

  let score = 0;

  if(password.length >= 8)
    score++;

  if(password.length >= 12)
    score++;

  if(/[a-z]/.test(password) &&
     /[A-Z]/.test(password))
    score++;

  if(/\d/.test(password))
    score++;

  if(/[^\p{L}\p{N}]/u.test(password))
    score++;

  return Math.min(score, 4);
}

function updatePasswordStrength() {

  const password = registerPassword.value;
  const score = passwordScore(password);

  strengthBars.forEach((bar, index) => {

    if(index < score){

      bar.style.background =
        "linear-gradient(90deg,#9858ff,#d15cff)";

    }else{

      bar.style.background =
        "rgba(255,255,255,.08)";

    }

  });

  if(!password){

    strengthText.textContent =
      "استخدم 8 أحرف على الأقل.";

    return;
  }

  if(score <= 1){

    strengthText.textContent =
      "كلمة المرور ضعيفة.";

  }else if(score === 2){

    strengthText.textContent =
      "كلمة المرور متوسطة.";

  }else if(score === 3){

    strengthText.textContent =
      "كلمة المرور جيدة.";

  }else{

    strengthText.textContent =
      "كلمة المرور قوية.";

  }
}

registerPassword.addEventListener(
  "input",
  updatePasswordStrength
);

/* =========================================================
   VISUAL FIELD VALIDATION
========================================================= */

function setFieldState(input, valid) {

  const hasValue =
    String(input.value || "").length > 0;

  input.classList.toggle(
    "valid",
    Boolean(valid && hasValue)
  );

  input.classList.toggle(
    "invalid",
    Boolean(!valid && hasValue)
  );
}

    */

    }

);

/* =========================================================
   LOGIN VALIDATION
========================================================= */

function validateLogin() {

  const identifier =
    loginIdentifier.value.trim();

  const password =
    loginPassword.value;

  if(identifier.length < 3){

    showAlert(
      "أدخل البريد الإلكتروني أو اسم المستخدم بشكل صحيح."
    );

    loginIdentifier.focus();

    return false;
  }

  if(password.length < 6){

    showAlert(
      "كلمة المرور يجب ألا تقل عن 6 أحرف."
    );

    loginPassword.focus();

    return false;
  }

  return true;
}


/* =========================================================
   REGISTER VALIDATION
========================================================= */

function validateRegister() {

  const username =
    normalizeUsername(registerUsername.value);

  const email =
    registerEmail.value.trim();

  const password =
    registerPassword.value;

  const confirmation =
    registerConfirm.value;

  /*
    نعيد القيمة المنظفة إلى الحقل.
  */

  registerUsername.value = username;

  /*
    التحقق الجديد من اسم المستخدم.
  */

  if(!validUsername(username)){

    showAlert(
      "اسم المستخدم يجب أن يكون من 3 إلى 30 حرفًا أو رقمًا، بدون مسافات أو رموز غير مسموحة."
    );

    registerUsername.focus();

    return false;
  }

  if(!validEmail(email)){

    showAlert(
      "أدخل بريدًا إلكترونيًا صحيحًا."
    );

    registerEmail.focus();

    return false;
  }

  if(password.length < 8){

    showAlert(
      "كلمة المرور يجب ألا تقل عن 8 أحرف."
    );

    registerPassword.focus();

    return false;
  }

  if(password !== confirmation){

    showAlert(
      "كلمتا المرور غير متطابقتين."
    );

    registerConfirm.focus();

    return false;
  }

  if(!termsCheck.checked){

    showAlert(
      "يجب الموافقة على الشروط قبل إنشاء الحساب."
    );

    termsCheck.focus();

    return false;
  }

  return true;
}

/* =========================================================
   LOADING
========================================================= */

function setLoading(button, loading) {

  const text =
    $(".button-text", button);

  const spinner =
    $(".spinner", button);

  button.disabled = loading;

  if(text){

    text.classList.toggle(
      "hidden",
      loading
    );

  }

  if(spinner){

    spinner.classList.toggle(
      "hidden",
      !loading
    );

  }
}


/* =========================================================
   RESPONSE
========================================================= */

async function parseResponse(response) {

  const type =
    response.headers.get("content-type") || "";

  if(type.includes("application/json")){

    try{

      return await response.json();

    }catch{

      return {};

    }

  }

  const text =
    await response.text();

  return {
    message:text
  };
}

function responseMessage(data) {

  if(!data) return "";

  return (
    data.message ||
    data.error ||
    data.detail ||
    data.msg ||
    ""
  );
}


/* =========================================================
   SAFE REDIRECT
========================================================= */

function redirectAfterSuccess(data) {

  if(
    data &&
    typeof data.redirect === "string" &&
    data.redirect.trim()
  ){

    const url =
      data.redirect.trim();

    /*
      نسمح فقط بالمسارات الداخلية.
      لا نقبل روابط خارجية من رد الخادم.
    */

    if(
      url.startsWith("/") &&
      !url.startsWith("//")
    ){

      window.location.assign(url);

      return;

    }

  }

  /*
    إذا لم يرسل الخادم مسارًا،
    يعود المتصفح إلى المسار الرئيسي.
  */

  window.location.assign("/");
}
