<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08070d"
  >

  <meta
    name="color-scheme"
    content="dark"
  >

  <meta
    name="description"
    content="افـنـدツينا🥀🖤 - تسجيل الدخول وإنشاء حساب"
  >

  <title>افـنـدツينا🥀🖤 — تسجيل الدخول</title>

  <style>
    :root{
      --bg:#06060a;
      --bg-2:#0b0911;

      --surface:rgba(255,255,255,.055);
      --surface-2:rgba(255,255,255,.085);

      --border:rgba(255,255,255,.10);

      --text:#ffffff;
      --muted:#9b98a8;

      --primary:#9b5cff;
      --primary-2:#d45cff;

      --danger:#ff557c;
      --success:#43dc91;
      --warning:#ffc857;

      --radius:22px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      min-height:100%;
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:20px;

      color:var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(155,92,255,.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 85%,
          rgba(212,92,255,.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #050509,
          #0c0912 50%,
          #06060a
        );

      overflow-x:hidden;
    }

    body::before{
      content:"";

      position:fixed;
      inset:0;

      pointer-events:none;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,.055) 1px,
          transparent 1px
        );

      background-size:28px 28px;

      opacity:.20;
    }

    button,
    input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    button:disabled{
      cursor:not-allowed;
    }

    input{
      outline:none;
    }

    .page{
      position:relative;
      z-index:1;

      width:min(
        100%,
        470px
      );
    }

    /* =========================
       BRAND
    ========================= */

    .brand{
      margin-bottom:18px;

      text-align:center;
    }

    .brand-logo{
      width:76px;
      height:76px;

      display:grid;
      place-items:center;

      margin:0 auto 13px;

      border-radius:24px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      box-shadow:
        0 20px 60px
        rgba(155,92,255,.28);

      font-size:35px;

      animation:
        logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat{
      0%,
      100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-5px);
      }
    }

    .brand h1{
      font-size:25px;
      font-weight:950;

      letter-spacing:-.8px;
    }

    .brand p{
      margin-top:6px;

      color:var(--muted);

      font-size:11px;
    }

    /* =========================
       CARD
    ========================= */

    .auth-card{
      position:relative;
      overflow:hidden;

      padding:25px;

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius);

      background:
        rgba(12,11,18,.88);

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.42);

      backdrop-filter:blur(24px);
    }

    .auth-card::before{
      content:"";

      position:absolute;

      width:180px;
      height:180px;

      top:-100px;
      left:-90px;

      border-radius:50%;

      background:
        rgba(155,92,255,.13);

      filter:blur(30px);

      pointer-events:none;
    }

    .auth-card::after{
      content:"🥀";

      position:absolute;

      left:-25px;
      bottom:-65px;

      color:#fff;

      opacity:.025;

      font-size:150px;

      transform:rotate(-15deg);

      pointer-events:none;
    }

    /* =========================
       TABS
    ========================= */

    .tabs{
      position:relative;
      z-index:2;

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:5px;

      padding:4px;

      margin-bottom:22px;

      border:
        1px solid
        var(--border);

      border-radius:15px;

      background:
        rgba(255,255,255,.035);
    }

    .tab{
      min-height:42px;

      border:0;

      border-radius:11px;

      color:var(--muted);

      background:transparent;

      font-size:12px;
      font-weight:850;

      transition:.2s ease;
    }

    .tab:hover{
      color:var(--text);

      background:
        rgba(255,255,255,.04);
    }

    .tab.active{
      color:#fff;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      box-shadow:
        0 8px 25px
        rgba(155,92,255,.20);
    }

    /* =========================
       FORM HEADER
    ========================= */

    .form-title{
      position:relative;
      z-index:2;

      margin-bottom:5px;

      font-size:20px;
      font-weight:900;
    }

    .form-description{
      position:relative;
      z-index:2;

      margin-bottom:20px;

      color:var(--muted);

      font-size:11px;

      line-height:1.8;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message{
      position:relative;
      z-index:2;

      display:none;

      margin-bottom:13px;

      padding:11px 12px;

      border-radius:12px;

      font-size:10px;

      line-height:1.8;
    }

    .message.show{
      display:block;

      animation:
        messageIn .2s ease;
    }

    .message.error{
      color:#ffb2c2;

      border:
        1px solid
        rgba(255,85,124,.28);

      background:
        rgba(255,85,124,.08);
    }

    .message.success{
      color:#9ff1c8;

      border:
        1px solid
        rgba(67,220,145,.28);

      background:
        rgba(67,220,145,.08);
    }

    .message.info{
      color:#d0baff;

      border:
        1px solid
        rgba(155,92,255,.28);

      background:
        rgba(155,92,255,.08);
    }

    @keyframes messageIn{
      from{
        opacity:0;
        transform:translateY(-4px);
      }

      to{
        opacity:1;
        transform:none;
      }
    }

    /* =========================
       FORM
    ========================= */

    .form{
      position:relative;
      z-index:2;

      display:grid;

      gap:13px;
    }

    .field{
      display:grid;

      gap:7px;
    }

    .field > span{
      color:var(--text);

      font-size:11px;
      font-weight:800;
    }

    .input-wrap{
      position:relative;
    }

    .input{
      width:100%;
      height:48px;

      padding:
        0 14px;

      color:var(--text);

      border:
        1px solid
        var(--border);

      border-radius:14px;

      background:
        rgba(255,255,255,.045);

      transition:.2s ease;
    }

    .input::placeholder{
      color:#656270;
    }

    .input:hover{
      border-color:
        rgba(255,255,255,.15);
    }

    .input:focus{
      border-color:
        rgba(155,92,255,.60);

      background:
        rgba(155,92,255,.045);

      box-shadow:
        0 0 0 3px
        rgba(155,92,255,.08);
    }

    .password-input{
      padding-left:50px;
    }

    .password-toggle{
      position:absolute;

      top:50%;
      left:8px;

      width:34px;
      height:34px;

      display:grid;
      place-items:center;

      transform:translateY(-50%);

      color:var(--muted);

      border:0;

      border-radius:10px;

      background:transparent;
    }

    .password-toggle:hover{
      color:var(--text);

      background:
        var(--surface);
    }

    /* =========================
       ROW
    ========================= */

    .form-row{
      display:flex;

      align-items:center;
      justify-content:space-between;

      gap:10px;

      margin-top:-3px;
    }

    .check{
      display:flex;

      align-items:center;

      gap:7px;

      color:var(--muted);

      font-size:10px;

      line-height:1.6;

      cursor:pointer;
    }

    .check input{
      width:14px;
      height:14px;

      accent-color:
        var(--primary);

      cursor:pointer;
    }

    .link-button{
      padding:0;

      border:0;

      color:#c9a7ff;

      background:transparent;

      font-size:10px;
      font-weight:800;
    }

    .link-button:hover{
      text-decoration:underline;
    }

    /* =========================
       SUBMIT
    ========================= */

    .submit{
      width:100%;
      min-height:50px;

      display:flex;

      align-items:center;
      justify-content:center;

      gap:8px;

      margin-top:4px;

      color:#fff;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius:14px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );

      box-shadow:
        0 14px 35px
        rgba(155,92,255,.22);

      font-size:12px;
      font-weight:900;

      transition:.2s ease;
    }

    .submit:hover:not(:disabled){
      transform:translateY(-2px);

      box-shadow:
        0 18px 42px
        rgba(155,92,255,.30);
    }

    .submit:disabled{
      opacity:.65;
    }

    .spinner{
      width:17px;
      height:17px;

      border:
        2px solid
        rgba(255,255,255,.35);

      border-top-color:
        #fff;

      border-radius:50%;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider{
      position:relative;
      z-index:2;

      display:flex;

      align-items:center;

      gap:10px;

      margin:18px 0;
    }

    .divider::before,
    .divider::after{
      content:"";

      flex:1;

      height:1px;

      background:
        var(--border);
    }

    .divider span{
      color:#666372;

      font-size:9px;
    }

    /* =========================
       GUEST
    ========================= */

    .guest{
      position:relative;
      z-index:2;

      width:100%;
      min-height:46px;

      border:
        1px solid
        var(--border);

      border-radius:13px;

      color:var(--text);

      background:
        var(--surface);

      font-size:11px;
      font-weight:800;

      transition:.2s ease;
    }

    .guest:hover{
      background:
        var(--surface-2);

      transform:translateY(-1px);
    }

    /* =========================
       FOOTER
    ========================= */

    .footer{
      position:relative;
      z-index:2;

      margin-top:15px;

      color:#6f6c7b;

      text-align:center;

      font-size:9px;

      line-height:1.9;
    }

    /* =========================
       MODE
    ========================= */

    .register-only{
      display:none;
    }

    .register-mode .register-only{
      display:grid;
    }

    .register-mode .login-only{
      display:none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:500px){

      body{
        padding:12px;
      }

      .auth-card{
        padding:20px 16px;
      }

      .brand{
        margin-bottom:14px;
      }

      .brand-logo{
        width:66px;
        height:66px;

        font-size:30px;
      }

      .brand h1{
        font-size:22px;
      }

      .brand p{
        font-size:10px;
      }

      .form-title{
        font-size:19px;
      }

    }

    @media(prefers-reduced-motion:reduce){

      *,
      *::before,
      *::after{
        animation:none!important;
        transition:none!important;
      }

    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         BRAND
    ========================= -->

    <header class="brand">

      <div class="brand-logo">
        🥀
      </div>

      <h1>
        افـنـدツينا🥀🖤
      </h1>

      <p>
        مجتمعك العربي للتواصل والدردشة
      </p>

    </header>


    <!-- =========================
         AUTH CARD
    ========================= -->

    <section
      class="auth-card"
      id="authCard"
    >

      <!-- =========================
           TABS
      ========================= -->

      <div
        class="tabs"
        role="tablist"
      >

        <button
          type="button"
          class="tab active"
          id="loginTab"
          role="tab"
          aria-selected="true"
        >
          تسجيل الدخول
        </button>

        <button
          type="button"
          class="tab"
          id="registerTab"
          role="tab"
          aria-selected="false"
        >
          إنشاء حساب
        </button>

      </div>


      <!-- =========================
           TITLE
      ========================= -->

      <h2
        class="form-title"
        id="formTitle"
      >
        مرحبًا بعودتك 👋
      </h2>

      <p
        class="form-description"
        id="formDescription"
      >
        سجّل الدخول إلى حسابك للانتقال إلى افـنـدツينا.
      </p>


      <!-- =========================
           MESSAGE
      ========================= -->

      <div
        class="message"
        id="message"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- =========================
           FORM
      ========================= -->

      <form
        class="form"
        id="authForm"
        novalidate
      >

        <!-- USERNAME -->

        <label class="field register-only">

          <span>
            اسم المستخدم
          </span>

          <input
            class="input"
            id="username"
            name="username"
            type="text"
            maxlength="30"
            minlength="3"
            autocomplete="username"
            placeholder="مثال: Ahmed"
          >

        </label>


        <!-- EMAIL -->

        <label class="field">

          <span>
            البريد الإلكتروني
          </span>

          <input
            class="input"
            id="email"
            name="email"
            type="email"
            maxlength="120"
            autocomplete="email"
            placeholder="example@email.com"
            required
          >

        </label>


        <!-- PASSWORD -->

        <label class="field">

          <span>
            كلمة المرور
          </span>

          <div class="input-wrap">

            <input
              class="input password-input"
              id="password"
              name="password"
              type="password"
              minlength="6"
              maxlength="128"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="إظهار كلمة المرور"
              aria-pressed="false"
            >
              👁️
            </button>

          </div>

        </label>


        <!-- CONFIRM PASSWORD -->

        <label class="field register-only">

          <span>
            تأكيد كلمة المرور
          </span>

          <div class="input-wrap">

            <input
              class="input password-input"
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              minlength="6"
              maxlength="128"
              autocomplete="new-password"
              placeholder="أعد كتابة كلمة المرور"
            >

          </div>

        </label>


        <!-- LOGIN OPTIONS -->

        <div class="form-row login-only">

          <label class="check">

            <input
              type="checkbox"
              id="rememberMe"
            >

            <span>
              تذكرني
            </span>

          </label>

          <button
            type="button"
            class="link-button"
            id="forgotButton"
          >
            نسيت كلمة المرور؟
          </button>

        </div>


        <!-- TERMS -->

        <label class="check register-only">

          <input
            type="checkbox"
            id="terms"
          >

          <span>
            أوافق على شروط الاستخدام وسياسة الخصوصية.
          </span>

        </label>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="submit"
          id="submitButton"
        >
          <span id="submitText">
            تسجيل الدخول
          </span>
        </button>

      </form>


      <!-- =========================
           DIVIDER
      ========================= -->

      <div class="divider">
        <span>أو</span>
      </div>


      <!-- =========================
           GUEST
      ========================= -->

      <button
        type="button"
        class="guest"
        id="guestButton"
      >
        👤 الدخول كزائر
      </button>


      <!-- =========================
           FOOTER
      ========================= -->

      <div class="footer">

        افـنـدツينا🥀🖤

        <br>

        تسجيل الدخول محمي ويتم التحقق من الحساب بواسطة الخادم.

      </div>

    </section>

  </main>


  <script>
    "use strict";


    /* =====================================================
       إعداد السيرفر
       =====================================================

       مهم:

       GitHub Pages يستضيف HTML/CSS/JS فقط.

       لذلك server.js يجب أن يكون مستضافًا على Backend
       منفصل.

       ضع رابط الـBackend الحقيقي هنا بعد استضافته.

       مثال:

       const API_BASE_URL =
         "https://your-backend.example.com";

       لا تضع رابط GitHub Pages هنا.
    ===================================================== */

    const API_BASE_URL = "";


    /* =====================================================
       إعدادات الموقع
    ===================================================== */

    const CONFIG = {

      indexPath:
        "index.html",

      authPath:
        "auth.html"

    };


    /* =====================================================
       العناصر
    ===================================================== */

    const authCard =
      document.getElementById(
        "authCard"
      );

    const authForm =
      document.getElementById(
        "authForm"
      );

    const loginTab =
      document.getElementById(
        "loginTab"
      );

    const registerTab =
      document.getElementById(
        "registerTab"
      );

    const formTitle =
      document.getElementById(
        "formTitle"
      );

    const formDescription =
      document.getElementById(
        "formDescription"
      );

    const message =
      document.getElementById(
        "message"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );

    const submitText =
      document.getElementById(
        "submitText"
      );

    const usernameInput =
      document.getElementById(
        "username"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const confirmPasswordInput =
      document.getElementById(
        "confirmPassword"
      );

    const passwordToggle =
      document.getElementById(
        "passwordToggle"
      );

    const rememberMe =
      document.getElementById(
        "rememberMe"
      );

    const terms =
      document.getElementById(
        "terms"
      );

    const forgotButton =
      document.getElementById(
        "forgotButton"
      );

    const guestButton =
      document.getElementById(
        "guestButton"
      );


    let mode = "login";


    /* =====================================================
       الرسائل
    ===================================================== */

    function showMessage(
      text,
      type
    ){

      message.textContent =
        text;

      message.className =
        "message show " +
        (
          type ||
          "info"
        );

    }


    function clearMessage(){

      message.textContent =
        "";

      message.className =
        "message";

    }


    /* =====================================================
       التحميل
    ===================================================== */

    function setLoading(
      loading
    ){

      submitButton.disabled =
        loading;

      if(loading){

        submitText.innerHTML =
          "";

        const spinner =
          document.createElement(
            "span"
          );

        spinner.className =
          "spinner";

        submitText.appendChild(
          spinner
        );

      }else{

        submitText.textContent =
          mode === "login"
            ? "تسجيل الدخول"
            : "إنشاء الحساب";

      }

    }


    /* =====================================================
       البريد
    ===================================================== */

    function normalizeEmail(
      value
    ){

      return String(
        value || ""
      )
      .trim()
      .toLowerCase();

    }


    function validEmail(
      email
    ){

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);

    }


    /* =====================================================
       اسم المستخدم
    ===================================================== */

    function validUsername(
      username
    ){

      return /^[a-zA-Z0-9_\u0600-\u06FF]{3,30}$/
        .test(username);

    }


    /* =====================================================
       تغيير الوضع
    ===================================================== */

    function setMode(
      nextMode
    ){

      mode =
        nextMode === "register"
          ? "register"
          : "login";

      clearMessage();


      if(mode === "register"){

        authCard.classList.add(
          "register-mode"
        );

        loginTab.classList.remove(
          "active"
        );

        registerTab.classList.add(
          "active"
        );

        loginTab.setAttribute(
          "aria-selected",
          "false"
        );

        registerTab.setAttribute(
          "aria-selected",
          "true"
        );

        formTitle.textContent =
          "أنشئ حسابك ✨";

        formDescription.textContent =
          "أنشئ حسابًا حقيقيًا ليتم حفظ بياناتك بواسطة الخادم.";

      }else{

        authCard.classList.remove(
          "register-mode"
        );

        registerTab.classList.remove(
          "active"
        );

        loginTab.classList.add(
          "active"
        );

        loginTab.setAttribute(
          "aria-selected",
          "true"
        );

        registerTab.setAttribute(
          "aria-selected",
          "false"
        );

        formTitle.textContent =
          "مرحبًا بعودتك 👋";

        formDescription.textContent =
          "سجّل الدخول إلى حسابك للانتقال إلى افـنـدツينا.";

      }


      submitText.textContent =
        mode === "login"
          ? "تسجيل الدخول"
          : "إنشاء الحساب";

    }


    /* =====================================================
       رابط index.html
    ===================================================== */

    function getIndexUrl(){

      return new URL(
        CONFIG.indexPath,
        window.location.href
      ).href;

    }


    function openSite(){

      window.location.assign(
        getIndexUrl()
      );

    }


    /* =====================================================
       API
    ===================================================== */

    async function apiRequest(
      endpoint,
      options
    ){

      if(!API_BASE_URL){

        throw new Error(
          "BACKEND_NOT_CONFIGURED"
        );

      }


      const base =
        API_BASE_URL.replace(
          /\/+$/,
          ""
        );


      let response;

      try{

        response =
          await fetch(
            base + endpoint,
            {
              method:
                options &&
                options.method
                  ? options.method
                  : "GET",

              headers:{
                "Content-Type":
                  "application/json"
              },

              credentials:
                "include",

              body:
                options &&
                options.body
                  ? options.body
                  : undefined
            }
          );

      }catch(error){

        throw new Error(
          "تعذر الاتصال بخادم المصادقة."
        );

      }


      let data = null;

      try{

        data =
          await response.json();

      }catch{

        data = {};

      }


      if(!response.ok){

        throw new Error(
          data.message ||
          data.error ||
          "تعذر تنفيذ الطلب."
        );

      }


      return data;

    }


    /* =====================================================
       التحقق من تسجيل الدخول
    ===================================================== */

    function validateLogin(){

      const email =
        normalizeEmail(
          emailInput.value
        );

      const password =
        passwordInput.value;


      if(!email){

        showMessage(
          "اكتب البريد الإلكتروني.",
          "error"
        );

        emailInput.focus();

        return false;

      }


      if(!validEmail(email)){

        showMessage(
          "البريد الإلكتروني غير صحيح.",
          "error"
        );

        emailInput.focus();

        return false;

      }


      if(!password){

        showMessage(
          "اكتب كلمة المرور.",
          "error"
        );

        passwordInput.focus();

        return false;

      }


      if(password.length < 6){

        showMessage(
          "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
          "error"
        );

        passwordInput.focus();

        return false;

      }


      return true;

    }


    /* =====================================================
       التحقق من إنشاء الحساب
    ===================================================== */

    function validateRegister(){

      const username =
        usernameInput.value.trim();

      const email =
        normalizeEmail(
          emailInput.value
        );

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;


      if(!validUsername(username)){

        showMessage(
          "اسم المستخدم يجب أن يكون من 3 إلى 30 حرفًا.",
          "error"
        );

        usernameInput.focus();

        return false;

      }


      if(!validEmail(email)){

        showMessage(
          "اكتب بريدًا إلكترونيًا صحيحًا.",
          "error"
        );

        emailInput.focus();

        return false;

      }


      if(password.length < 6){

        showMessage(
          "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
          "error"
        );

        passwordInput.focus();

        return false;

      }


      if(password !== confirmPassword){

        showMessage(
          "كلمتا المرور غير متطابقتين.",
          "error"
        );

        confirmPasswordInput.focus();

        return false;

      }


      if(!terms.checked){

        showMessage(
          "يجب الموافقة على شروط الاستخدام.",
          "error"
        );

        terms.focus();

        return false;

      }


      return true;

    }


    /* =====================================================
       تسجيل الدخول
    ===================================================== */

    async function login(){

      if(!validateLogin()){

        return;

      }


      setLoading(true);

      clearMessage();


      try{

        const data =
          await apiRequest(
            "/api/auth/login",
            {
              method:
                "POST",

              body:
                JSON.stringify({

                  email:
                    normalizeEmail(
                      emailInput.value
                    ),

                  password:
                    passwordInput.value,

                  remember:
                    Boolean(
                      rememberMe.checked
                    )

                })
            }
          );


        /*
          مهم:

          لا نضع authenticated=true
          من الواجهة.

          السيرفر هو الذي يقرر نجاح
          المصادقة.
        */


        if(
          data &&
          data.success === false
        ){

          throw new Error(
            data.message ||
            "بيانات تسجيل الدخول غير صحيحة."
          );

        }


        if(
          data &&
          data.authenticated === false
        ){

          throw new Error(
            data.message ||
            "بيانات تسجيل الدخول غير صحيحة."
          );

        }


        showMessage(
          "تم تسجيل الدخول بنجاح، جارٍ فتح الموقع...",
          "success"
        );


        setTimeout(
          openSite,
          300
        );


      }catch(error){

        console.error(
          "LOGIN ERROR:",
          error
        );


        if(
          error.message ===
          "BACKEND_NOT_CONFIGURED"
        ){

          showMessage(
            "خادم المصادقة غير مربوط بعد. لم يتم قبول الدخول بشكل وهمي.",
            "error"
          );

        }else{

          showMessage(
            error.message ||
            "فشل تسجيل الدخول.",
            "error"
          );

        }

      }finally{

        setLoading(false);

      }

    }


    /* =====================================================
       إنشاء الحساب
    ===================================================== */

    async function register(){

      if(!validateRegister()){

        return;

      }


      setLoading(true);

      clearMessage();


      try{

        const data =
          await apiRequest(
            "/api/auth/register",
            {
              method:
                "POST",

              body:
                JSON.stringify({

                  username:
                    usernameInput.value.trim(),

                  email:
                    normalizeEmail(
                      emailInput.value
                    ),

                  password:
                    passwordInput.value

                })
            }
          );


        if(
          data &&
          data.success === false
        ){

          throw new Error(
            data.message ||
            "تعذر إنشاء الحساب."
          );

        }


        showMessage(
          "تم إنشاء الحساب بنجاح، جارٍ فتح الموقع...",
          "success"
        );


        setTimeout(
          openSite,
          350
        );


      }catch(error){

        console.error(
          "REGISTER ERROR:",
          error
        );


        if(
          error.message ===
          "BACKEND_NOT_CONFIGURED"
        ){

          showMessage(
            "خادم المصادقة غير مربوط بعد. لم يتم إنشاء حساب وهمي.",
            "error"
          );

        }else{

          showMessage(
            error.message ||
            "تعذر إنشاء الحساب.",
            "error"
          );

        }

      }finally{

        setLoading(false);

      }

    }


    /* =====================================================
       أحداث الأزرار
    ===================================================== */

    loginTab.addEventListener(
      "click",
      function(){

        setMode(
          "login"
        );

      }
    );


    registerTab.addEventListener(
      "click",
      function(){

        setMode(
          "register"
        );

      }
    );


    authForm.addEventListener(
      "submit",
      async function(event){

        event.preventDefault();


        if(mode === "login"){

          await login();

        }else{

          await register();

        }

      }
    );


    /* =====================================================
       إظهار وإخفاء كلمة المرور
    ===================================================== */

    passwordToggle.addEventListener(
      "click",
      function(){

        const isPassword =
          passwordInput.type ===
          "password";


        passwordInput.type =
          isPassword
            ? "text"
            : "password";


        passwordToggle.textContent =
          isPassword
            ? "🙈"
            : "👁️";


        passwordToggle.setAttribute(
          "aria-pressed",
          String(isPassword)
        );


        passwordToggle.setAttribute(
          "aria-label",
          isPassword
            ? "إخفاء كلمة المرور"
            : "إظهار كلمة المرور"
        );

      }
    );


    /* =====================================================
       نسيت كلمة المرور
    ===================================================== */

    forgotButton.addEventListener(
      "click",
      function(){

        showMessage(
          "استعادة كلمة المرور تحتاج إلى خدمة بريد مربوطة بالـBackend.",
          "info"
        );

      }
    );


    /* =====================================================
       الدخول كزائر
    ===================================================== */

    guestButton.addEventListener(
      "click",
      function(){

        /*
          الزائر لا يحصل على حساب حقيقي.
          ولا يحصل على كوينز محفوظة أو مستوى
          محفوظ في قاعدة البيانات.
        */

        try{

          sessionStorage.setItem(
            "guestMode",
            "true"
          );

          sessionStorage.removeItem(
            "authenticated"
          );

        }catch(error){

          console.warn(
            "Session storage unavailable."
          );

        }


        openSite();

      }
    );


    /* =====================================================
       تحديد الصفحة من الرابط
    ===================================================== */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    if(
      urlParams.get(
        "mode"
      ) === "register"
    ){

      setMode(
        "register"
      );

    }else{

      setMode(
        "login"
      );

    }


    /* =====================================================
       منع حالات الدخول الوهمية القديمة
    ===================================================== */

    /*
      لا نعتبر localStorage دليلًا على
      أن المستخدم مسجل دخول.

      الحساب الحقيقي يجب أن يثبت بواسطة
      الـBackend.
    */

    console.log(
      "افـنـدツينا🥀🖤 auth.html جاهز."
    );

  </script>
