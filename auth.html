<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#090510"
  >

  <meta
    name="description"
    content="افـنـدツينا🥀🖤 — تسجيل الدخول وإنشاء حساب"
  >

  <title>
    افـنـدツينا🥀🖤 — تسجيل الدخول
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg:
        #090510;

      --bg-soft:
        #100817;

      --card:
        rgba(20, 10, 30, 0.78);

      --card-border:
        rgba(255, 255, 255, 0.10);

      --text:
        #ffffff;

      --text-soft:
        #b9adbf;

      --primary:
        #b026ff;

      --primary-2:
        #ff2f92;

      --success:
        #36e08a;

      --danger:
        #ff4d67;

      --warning:
        #ffc857;

      --shadow:
        0 25px 80px
        rgba(0, 0, 0, 0.55);

      --radius:
        24px;
    }

    * {
      box-sizing:
        border-box;

      margin:
        0;

      padding:
        0;
    }

    html {
      min-height:
        100%;

      scroll-behavior:
        smooth;
    }

    body {
      min-height:
        100vh;

      font-family:
        "Cairo",
        sans-serif;

      color:
        var(--text);

      background:
        var(--bg);

      overflow-x:
        hidden;
    }

    button,
    input {
      font:
        inherit;
    }

    button {
      border:
        0;

      cursor:
        pointer;
    }

    a {
      color:
        inherit;

      text-decoration:
        none;
    }

    /*
    ========================================================
    الخلفية
    ========================================================
    */

    .page {
      position:
        relative;

      min-height:
        100vh;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        30px 18px;

      overflow:
        hidden;
    }

    .background {
      position:
        fixed;

      inset:
        0;

      z-index:
        -3;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(176, 38, 255, 0.22),
          transparent 30%
        ),

        radial-gradient(
          circle at 85% 75%,
          rgba(255, 47, 146, 0.18),
          transparent 32%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(102, 34, 180, 0.16),
          transparent 35%
        ),

        linear-gradient(
          145deg,
          #07030c,
          #0d0614 45%,
          #090510
        );
    }

    .background::before,
    .background::after {
      content:
        "";

      position:
        absolute;

      width:
        420px;

      height:
        420px;

      border-radius:
        50%;

      filter:
        blur(80px);

      opacity:
        0.28;

      animation:
        floatingGlow
        12s
        ease-in-out
        infinite
        alternate;
    }

    .background::before {
      top:
        -180px;

      right:
        -120px;

      background:
        #b026ff;
    }

    .background::after {
      bottom:
        -200px;

      left:
        -130px;

      background:
        #ff2f92;

      animation-delay:
        -5s;
    }

    @keyframes floatingGlow {
      from {
        transform:
          translate3d(
            0,
            0,
            0
          )
          scale(1);
      }

      to {
        transform:
          translate3d(
            35px,
            -25px,
            0
          )
          scale(1.12);
      }
    }

    /*
    ========================================================
    زخارف الخلفية
    ========================================================
    */

    .particles {
      position:
        fixed;

      inset:
        0;

      z-index:
        -2;

      pointer-events:
        none;

      overflow:
        hidden;
    }

    .particle {
      position:
        absolute;

      width:
        3px;

      height:
        3px;

      border-radius:
        50%;

      background:
        rgba(
          255,
          255,
          255,
          0.55
        );

      box-shadow:
        0 0 12px
        rgba(
          255,
          255,
          255,
          0.4
        );

      animation:
        particleFloat
        linear
        infinite;
    }

    .particle:nth-child(1) {
      top: 12%;
      left: 8%;
      animation-duration: 9s;
    }

    .particle:nth-child(2) {
      top: 28%;
      left: 22%;
      animation-duration: 12s;
    }

    .particle:nth-child(3) {
      top: 18%;
      left: 76%;
      animation-duration: 10s;
    }

    .particle:nth-child(4) {
      top: 64%;
      left: 88%;
      animation-duration: 13s;
    }

    .particle:nth-child(5) {
      top: 78%;
      left: 14%;
      animation-duration: 11s;
    }

    .particle:nth-child(6) {
      top: 84%;
      left: 62%;
      animation-duration: 15s;
    }

    .particle:nth-child(7) {
      top: 46%;
      left: 48%;
      animation-duration: 14s;
    }

    .particle:nth-child(8) {
      top: 36%;
      left: 92%;
      animation-duration: 10s;
    }

    @keyframes particleFloat {
      0% {
        transform:
          translateY(0)
          scale(0.8);

        opacity:
          0.2;
      }

      50% {
        opacity:
          0.8;
      }

      100% {
        transform:
          translateY(-80px)
          scale(1.2);

        opacity:
          0;
      }
    }

    /*
    ========================================================
    الحاوية الرئيسية
    ========================================================
    */

    .auth-shell {
      width:
        min(
          100%,
          1080px
        );

      display:
        grid;

      grid-template-columns:
        0.9fr
        1.1fr;

      border:
        1px solid
        var(--card-border);

      border-radius:
        32px;

      overflow:
        hidden;

      background:
        rgba(
          15,
          7,
          22,
          0.72
        );

      backdrop-filter:
        blur(24px);

      -webkit-backdrop-filter:
        blur(24px);

      box-shadow:
        var(--shadow);
    }

    /*
    ========================================================
    الجانب التعريفي
    ========================================================
    */

    .brand-side {
      position:
        relative;

      min-height:
        650px;

      padding:
        55px 42px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      overflow:
        hidden;

      background:
        linear-gradient(
          145deg,
          rgba(
            176,
            38,
            255,
            0.20
          ),
          rgba(
            255,
            47,
            146,
            0.10
          )
        );
    }

    .brand-side::before {
      content:
        "";

      position:
        absolute;

      width:
        260px;

      height:
        260px;

      top:
        -120px;

      left:
        -120px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.08
        );

      border-radius:
        50%;

      box-shadow:
        0 0 0 45px
        rgba(
          255,
          255,
          255,
          0.025
        ),

        0 0 0 90px
        rgba(
          255,
          255,
          255,
          0.018
        );
    }

    .brand-logo {
      width:
        76px;

      height:
        76px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      margin-bottom:
        25px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.14
        );

      border-radius:
        24px;

      background:
        linear-gradient(
          135deg,
          rgba(
            176,
            38,
            255,
            0.95
          ),
          rgba(
            255,
            47,
            146,
            0.9
          )
        );

      box-shadow:
        0 15px 45px
        rgba(
          176,
          38,
          255,
          0.28
        );

      font-size:
        34px;
    }

    .brand-title {
      font-size:
        clamp(
          30px,
          4vw,
          46px
        );

      font-weight:
        900;

      line-height:
        1.25;

      margin-bottom:
        14px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #e9b7ff,
          #ff8ec5
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      color:
        transparent;
    }

    .brand-description {
      color:
        var(--text-soft);

      font-size:
        15px;

      line-height:
        2;

      max-width:
        420px;
    }

    .brand-features {
      margin-top:
        35px;

      display:
        grid;

      gap:
        14px;
    }

    .feature {
      display:
        flex;

      align-items:
        center;

      gap:
        12px;

      color:
        #e9dfed;

      font-size:
        14px;
    }

    .feature-icon {
      width:
        38px;

      height:
        38px;

      flex:
        0 0 38px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        12px;

      background:
        rgba(
          255,
          255,
          255,
          0.07
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.08
        );
    }

    /*
    ========================================================
    صندوق المصادقة
    ========================================================
    */

    .auth-card {
      padding:
        45px;

      background:
        rgba(
          8,
          4,
          13,
          0.72
        );
    }

    .auth-header {
      margin-bottom:
        28px;
    }

    .auth-header h1 {
      font-size:
        28px;

      font-weight:
        800;

      margin-bottom:
        8px;
    }

    .auth-header p {
      color:
        var(--text-soft);

      font-size:
        14px;
    }

    /*
    ========================================================
    التبويبات
    ========================================================
    */

    .tabs {
      display:
        grid;

      grid-template-columns:
        1fr
        1fr;

      padding:
        5px;

      margin-bottom:
        25px;

      border-radius:
        16px;

      background:
        rgba(
          255,
          255,
          255,
          0.05
        );
    }

    .tab {
      padding:
        12px;

      border-radius:
        12px;

      color:
        var(--text-soft);

      background:
        transparent;

      transition:
        0.25s
        ease;

      font-weight:
        700;
    }

    .tab.active {
      color:
        #ffffff;

      background:
        linear-gradient(
          135deg,
          rgba(
            176,
            38,
            255,
            0.85
          ),
          rgba(
            255,
            47,
            146,
            0.8
          )
        );

      box-shadow:
        0 8px 25px
        rgba(
          176,
          38,
          255,
          0.20
        );
    }

    /*
    ========================================================
    النماذج
    ========================================================
    */

    .form {
      display:
        none;
    }

    .form.active {
      display:
        block;

      animation:
        formIn
        0.3s
        ease;
    }

    @keyframes formIn {
      from {
        opacity:
          0;

        transform:
          translateY(8px);
      }

      to {
        opacity:
          1;

        transform:
          translateY(0);
      }
    }

    .field {
      margin-bottom:
        17px;
    }

    .field label {
      display:
        block;

      margin-bottom:
        8px;

      color:
        #e9dfed;

      font-size:
        13px;

      font-weight:
        700;
    }

    .input-wrap {
      position:
        relative;
    }

    .input-wrap input {
      width:
        100%;

      height:
        52px;

      padding:
        0 16px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.10
        );

      border-radius:
        15px;

      outline:
        none;

      color:
        #ffffff;

      background:
        rgba(
          255,
          255,
          255,
          0.045
        );

      transition:
        0.25s
        ease;
    }

    .input-wrap input::placeholder {
      color:
        #756b7c;
    }

    .input-wrap input:focus {
      border-color:
        rgba(
          176,
          38,
          255,
          0.75
        );

      background:
        rgba(
          176,
          38,
          255,
          0.06
        );

      box-shadow:
        0 0 0 4px
        rgba(
          176,
          38,
          255,
          0.08
        );
    }

    .password-toggle {
      position:
        absolute;

      top:
        50%;

      left:
        12px;

      transform:
        translateY(-50%);

      width:
        34px;

      height:
        34px;

      border-radius:
        10px;

      color:
        var(--text-soft);

      background:
        transparent;
    }

    .form-row {
      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        15px;

      margin:
        5px 0 20px;
    }

    .remember {
      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      color:
        var(--text-soft);

      font-size:
        12px;
    }

    .remember input {
      accent-color:
        var(--primary);
    }

    .forgot {
      color:
        #d98cff;

      font-size:
        12px;

      font-weight:
        700;
    }

    /*
    ========================================================
    زر الإرسال
    ========================================================
    */

    .submit-btn {
      width:
        100%;

      height:
        54px;

      border-radius:
        16px;

      color:
        #ffffff;

      background:
        linear-gradient(
          135deg,
          #a51cff,
          #ff278f
        );

      box-shadow:
        0 14px 35px
        rgba(
          176,
          38,
          255,
          0.24
        );

      font-weight:
        800;

      transition:
        0.25s
        ease;
    }

    .submit-btn:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 18px 42px
        rgba(
          176,
          38,
          255,
          0.34
        );
    }

    .submit-btn:disabled {
      opacity:
        0.55;

      cursor:
        not-allowed;

      transform:
        none;
    }

    /*
    ========================================================
    الرسائل
    ========================================================
    */

    .alert {
      display:
        none;

      padding:
        12px 14px;

      margin-bottom:
        18px;

      border-radius:
        13px;

      font-size:
        13px;

      line-height:
        1.7;
    }

    .alert.show {
      display:
        block;
    }

    .alert.error {
      color:
        #ffd6dc;

      background:
        rgba(
          255,
          77,
          103,
          0.10
        );

      border:
        1px solid
        rgba(
          255,
          77,
          103,
          0.22
        );
    }

    .alert.success {
      color:
        #c8ffe2;

      background:
        rgba(
          54,
          224,
          138,
          0.10
        );

      border:
        1px solid
        rgba(
          54,
          224,
          138,
          0.22
        );
    }

    /*
    ========================================================
    حالة التحميل
    ========================================================
    */

    .loading {
      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;
    }

    .spinner {
      width:
        18px;

      height:
        18px;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.3
        );

      border-top-color:
        #ffffff;

      border-radius:
        50%;

      animation:
        spin
        0.7s
        linear
        infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(
            360deg
          );
      }
    }

    /*
    ========================================================
    الجوال
    ========================================================
    */

    @media (
      max-width: 850px
    ) {
      .auth-shell {
        grid-template-columns:
          1fr;

        max-width:
          560px;
      }

      .brand-side {
        min-height:
          auto;

        padding:
          35px 28px;
      }

      .brand-features {
        display:
          none;
      }

      .brand-description {
        max-width:
          none;
      }

      .auth-card {
        padding:
          32px 25px;
      }
    }

    @media (
      max-width: 480px
    ) {
      .page {
        padding:
          14px;
      }

      .auth-shell {
        border-radius:
          24px;
      }

      .brand-side {
        padding:
          28px 22px;
      }

      .auth-card {
        padding:
          28px 20px;
      }

      .brand-logo {
        width:
          62px;

        height:
          62px;

        border-radius:
          19px;

        font-size:
          28px;
      }

      .brand-title {
        font-size:
          30px;
      }

      .form-row {
        align-items:
          flex-start;

        flex-direction:
          column;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <div class="particles">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>

  <main class="page">

    <section class="auth-shell">

      <aside class="brand-side">

        <div class="brand-logo">
          🥀
        </div>

        <h2 class="brand-title">
          افـنـدツينا🥀🖤
        </h2>

        <p class="brand-description">
          مكانك للتواصل والتعارف والدردشة
          في تجربة عربية عصرية، سريعة وآمنة.
        </p>

        <div class="brand-features">

          <div class="feature">
            <span class="feature-icon">
              💬
            </span>

            <span>
              محادثات وتواصل لحظي
            </span>
          </div>

          <div class="feature">
            <span class="feature-icon">
              🎁
            </span>

            <span>
              هدايا وميزات اجتماعية
            </span>
          </div>

          <div class="feature">
            <span class="feature-icon">
              🛡️
            </span>

            <span>
              حساب حقيقي ونظام حماية
            </span>
          </div>

        </div>

      </aside>

      <section class="auth-card">

        <header class="auth-header">

          <h1 id="authTitle">
            أهلاً بك
          </h1>

          <p id="authSubtitle">
            سجّل دخولك للمتابعة إلى حسابك.
          </p>

      <script>
  /*
  ============================================================
   افـنـدツينا🥀🖤
   auth.html
   الجزء 2 من 6
   JavaScript — الأساس والتحكم في الواجهة
  ============================================================
  */

  'use strict';

  /*
  ============================================================
   1. إعدادات الاتصال
  ============================================================
  */

  const API_BASE =
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1'
      ? `${window.location.protocol}//${window.location.host}/api`
      : '/api';

  /*
  ============================================================
   2. عناصر الصفحة
  ============================================================
  */

  const loginTab =
    document.getElementById(
      'loginTab'
    );

  const registerTab =
    document.getElementById(
      'registerTab'
    );

  const loginForm =
    document.getElementById(
      'loginForm'
    );

  const registerForm =
    document.getElementById(
      'registerForm'
    );

  const authTitle =
    document.getElementById(
      'authTitle'
    );

  const authSubtitle =
    document.getElementById(
      'authSubtitle'
    );

  const alertBox =
    document.getElementById(
      'alert'
    );

  const loginSubmit =
    document.getElementById(
      'loginSubmit'
    );

  const registerSubmit =
    document.getElementById(
      'registerSubmit'
    );

  /*
  ============================================================
   3. حالة الصفحة
  ============================================================
  */

  let currentMode =
    'login';

  let requestInProgress =
    false;

  /*
  ============================================================
   4. أدوات عامة
  ============================================================
  */

  function showAlert(
    message,
    type = 'error'
  ) {
    if (!alertBox) {
      return;
    }

    alertBox.textContent =
      String(message || '');

    alertBox.className =
      `alert show ${type}`;
  }

  function clearAlert() {
    if (!alertBox) {
      return;
    }

    alertBox.textContent =
      '';

    alertBox.className =
      'alert';
  }

  function setButtonLoading(
    button,
    loading,
    loadingText
  ) {
    if (!button) {
      return;
    }

    if (loading) {
      button.dataset.originalText =
        button.textContent;

      button.disabled =
        true;

      button.innerHTML = `
        <span class="loading">
          <span class="spinner"></span>
          <span>${loadingText}</span>
        </span>
      `;
    } else {
      button.disabled =
        false;

      button.textContent =
        button.dataset.originalText ||
        button.textContent;
    }
  }

  /*
  ============================================================
   5. التحقق من النصوص
  ============================================================
  */

  function normalizeText(
    value
  ) {
    return String(
      value ?? ''
    ).trim();
  }

  function isValidEmail(
    email
  ) {

  async function parseResponse(
    response
  ) {
    const contentType =
      response.headers.get(
        'content-type'
      ) || '';

    if (
      contentType.includes(
        'application/json'
      )
    ) {
      return response.json();
    }

    const text =
      await response.text();

    return {
      success:
        response.ok,

      message:
        text || 'حدث خطأ غير معروف.'
    };
  }

  /*
  ============================================================
   14. طلب API مركزي
  ============================================================
  */

  async function apiRequest(
    endpoint,
    options = {}
  ) {
    const config = {
      method:
        options.method || 'GET',

      headers: {
        'Content-Type':
          'application/json',

        ...(options.headers || {})
      },

      credentials:
        'include'
    };

    if (
      options.body !== undefined
    ) {
      config.body =
        JSON.stringify(
          options.body
        );
    }

    let response;

    try {
      response =
        await fetch(
          `${API_BASE}${endpoint}`,
          config
        );
    } catch (error) {
      throw new Error(
        'تعذر الاتصال بالخادم. تأكد من تشغيل الخادم واتصال الإنترنت.'
      );
    }

    const data =
      await parseResponse(
        response
      );

    if (
      !response.ok ||
      data.success === false
    ) {
      const message =
        data.message ||
        data.error ||
        'تعذر تنفيذ الطلب.';

      const apiError =
        new Error(
          message
        );

      apiError.status =
        response.status;

      apiError.code =
        data.code ||
        'API_REQUEST_FAILED';

      apiError.data =
        data;

      throw apiError;
    }

    return data;
  }
