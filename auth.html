<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#07080c">

<meta name="description"
      content="تسجيل الدخول وإنشاء حساب - افـنـدツينا🥀🖤">

<title>
افـنـدツينا🥀🖤 | الحساب
</title>


<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{

    --bg:#05060a;
    --bg-soft:#0a0b10;

    --card:#101218;
    --card-light:#151720;

    --gold:#d8b56a;
    --gold-light:#f3dc9c;
    --gold-dark:#b58a3e;

    --text:#f5f5f7;
    --muted:#9297a5;

    --green:#45d59a;
    --red:#e66c7d;

    --border:
        rgba(255,255,255,.075);

    --gold-border:
        rgba(216,181,106,.25);

    --shadow:
        0 30px 90px
        rgba(0,0,0,.55);

}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    color:var(--text);

    font-family:
        "Cairo",
        "Tajawal",
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% -15%,
            rgba(216,181,106,.14),
            transparent 35%
        ),

        radial-gradient(
            circle at 100% 100%,
            rgba(112,91,190,.07),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            #05060a 0%,
            #090a0f 55%,
            #05060a 100%
        );

    overflow-x:hidden;

}


/* الخلفية */

body::before{

    content:"";

    position:fixed;

    width:450px;
    height:450px;

    top:-260px;
    left:50%;

    transform:
        translateX(-50%);

    background:
        rgba(216,181,106,.055);

    filter:
        blur(110px);

    pointer-events:none;

    z-index:-1;

}


/* =========================================================
   PAGE
========================================================= */

.page{

    min-height:100vh;

    display:flex;

    flex-direction:column;

}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:72px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(5,6,10,.72);

    backdrop-filter:
        blur(22px);

}


.header-inner{

    width:
        min(
            1120px,
            calc(100% - 26px)
        );

    height:100%;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

    color:white;

}


.logo-icon{

    width:43px;
    height:43px;

    display:grid;

    place-items:center;

    border-radius:14px;

    background:

        linear-gradient(
            145deg,
            #292217,
            #0d0e12
        );

    border:
        1px solid var(--gold-border);

    font-size:20px;

}


.logo-name{

    font-size:16px;

    font-weight:900;

}


.logo-name span{

    color:var(--gold-light);

}


/* العودة */

.back{

    color:var(--muted);

    font-size:12px;

    padding:9px 13px;

    border-radius:11px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.025);

    text-decoration:none;

    transition:.25s;

}


.back:hover{

    color:white;

    border-color:
        var(--gold-border);

}


/* =========================================================
   MAIN
========================================================= */

.main{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        55px 15px 70px;

}


/* =========================================================
   AUTH CARD
========================================================= */

.auth{

    width:
        min(
            450px,
            100%
        );

}


.auth-card{

    padding:
        30px;

    border-radius:26px;

    background:

        linear-gradient(
            145deg,
            rgba(20,22,29,.96),
            rgba(10,11,15,.96)
        );

    border:
        1px solid var(--border);

    box-shadow:
        var(--shadow);

    position:relative;

    overflow:hidden;

}


/* glow */

.auth-card::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-120px;
    right:-70px;

    border-radius:50%;

    background:
        rgba(216,181,106,.08);

    filter:
        blur(30px);

}


/* =========================================================
   AUTH HEADER
========================================================= */

.auth-header{

    text-align:center;

    margin-bottom:26px;

}


.auth-symbol{

    width:60px;
    height:60px;

    margin:
        0 auto 15px;

    display:grid;

    place-items:center;

    border-radius:19px;

    background:

        linear-gradient(
            145deg,
            #292217,
            #0d0f14
        );

    border:
        1px solid var(--gold-border);

    box-shadow:
        inset 0 1px
        rgba(255,255,255,.08);

    font-size:27px;

}


.auth-header h1{

    font-size:25px;

    font-weight:900;

    letter-spacing:-.5px;

}


.auth-header p{

    color:var(--muted);

    font-size:11px;

    line-height:1.8;

    margin-top:7px;

}


/* =========================================================
   TABS
========================================================= */

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    padding:4px;

    margin-bottom:24px;

    border-radius:14px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid var(--border);

}


.tab{

    border:0;

    color:var(--muted);

    background:transparent;

    padding:11px;

    border-radius:10px;

    font-size:12px;

    cursor:pointer;

    transition:.25s;

}


.tab.active{

    color:white;

    background:
        #191b22;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.25);

}


/* =========================================================
   FORMS
========================================================= */

.form{

    display:none;

}


.form.active{

    display:block;

    animation:
        fadeIn .25s ease;

}


@keyframes fadeIn{

    from{

        opacity:0;

        transform:
            translateY(5px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* FIELD */

.field{

    margin-bottom:16px;

}


.field label{

    display:block;

    color:#d8d9df;

    font-size:11px;

    font-weight:700;

    margin-bottom:7px;

}


.input-wrap{

    position:relative;

}


.input{

    width:100%;

    height:48px;

    padding:
        0 14px;

    border-radius:13px;

    outline:none;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.035);

    color:white;

    font-size:12px;

    transition:.25s;

}


.input::placeholder{

    color:#666b78;

}


.input:focus{

    border-color:
        rgba(216,181,106,.48);

    background:
        rgba(255,255,255,.045);

    box-shadow:
        0 0 0 3px
        rgba(216,181,106,.055);

}


/* password button */

.password-toggle{

    position:absolute;

    left:8px;

    top:50%;

    transform:
        translateY(-50%);

    width:34px;
    height:34px;

    border:0;

    border-radius:9px;

    background:
        transparent;

    color:#777c88;

    cursor:pointer;

}


.password-toggle:hover{

    color:white;

    background:
        rgba(255,255,255,.05);

}


/* =========================================================
   OPTIONS
========================================================= */

.form-options{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin:
        -3px 0 18px;

}


.remember{

    display:flex;

    align-items:center;

    gap:7px;

    color:var(--muted);

    font-size:10px;

    cursor:pointer;

}


.remember input{

    accent-color:
        var(--gold);

}


.forgot{

    border:0;

    background:none;

    color:var(--gold-light);

    font-size:10px;

    cursor:pointer;

}


/* =========================================================
   SUBMIT
========================================================= */

.submit{

    width:100%;

    height:50px;

    border:0;

    border-radius:14px;

    cursor:pointer;

    font-size:13px;

    font-weight:900;

    color:#171208;

    background:

        linear-gradient(
            135deg,
            #f3dda0,
            #c49a4c
        );

    box-shadow:
        0 12px 30px
        rgba(216,181,106,.12);

    transition:.25s;

}


.submit:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 36px
        rgba(216,181,106,.19);

}


.submit:active{

    transform:
        translateY(0);

}


.submit.loading{

    opacity:.65;

    pointer-events:none;

}


/* =========================================================
   DIVIDER
========================================================= */

.divider{

    display:flex;

    align-items:center;

    gap:12px;

    margin:21px 0;

    color:#626775;

    font-size:9px;

}


.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:
        var(--border);

}


/* =========================================================
   GUEST
========================================================= */

.guest{

    width:100%;

    height:45px;

    border-radius:13px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.025);

    color:#ddd;

    cursor:pointer;

    font-size:11px;

    transition:.25s;

}


.guest:hover{

    background:
        rgba(255,255,255,.055);

    border-color:
        rgba(255,255,255,.13);

}


/* =========================================================
   FOOT NOTE
========================================================= */

.auth-note{

    text-align:center;

    color:#686d7a;

    font-size:9px;

    line-height:1.8;

    margin-top:18px;

}


.auth-note a{

    color:var(--gold-light);

}


/* =========================================================
   ERROR / SUCCESS
========================================================= */

.message{

    display:none;

    padding:11px 13px;

    border-radius:11px;

    margin-bottom:15px;

    font-size:10px;

    line-height:1.7;

}


.message.show{

    display:block;

}


.message.error{

    color:#ffb6bf;

    background:
        rgba(230,108,125,.07);

    border:
        1px solid
        rgba(230,108,125,.18);

}


.message.success{

    color:#9de7c7;

    background:
        rgba(69,213,154,.07);

    border:
        1px solid
        rgba(69,213,154,.18);

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    text-align:center;

    padding:
        20px;

    border-top:
        1px solid var(--border);

    color:#666b78;

    font-size:9px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

    .header{

        height:66px;

    }

    .logo-name{

        font-size:14px;

    }

    .back{

        font-size:10px;

        padding:
            8px 10px;

    }

    .main{

        padding:
            30px 10px 45px;

        align-items:flex-start;

    }

    .auth-card{

        padding:21px 17px;

        border-radius:22px;

    }

    .auth-header h1{

        font-size:22px;

    }

    .auth-symbol{

        width:54px;
        height:54px;

        font-size:24px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;

        transition-duration:.01ms !important;

    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

<div class="header-inner">


<a
    href="index.html"
    class="logo"
>

<div class="logo-icon">
🥀
</div>

<div class="logo-name">

افـنـدツينا
<span>🖤</span>

</div>

</a>


<a
    href="index.html"
    class="back"
>

← الرئيسية

</a>


</div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


<div class="auth">


<div class="auth-card">


<!-- HEADER -->

<div class="auth-header">

<div class="auth-symbol">
🥀
</div>

<h1>
مرحبًا بك
</h1>

<p>
ادخل إلى حسابك أو أنشئ حسابًا جديدًا
وابدأ تجربتك في افـنـدツينا.
</p>

</div>



<!-- TABS -->

<div class="tabs">

<button
    class="tab active"
    id="loginTab"
    onclick="switchForm('login')"
>

تسجيل الدخول

</button>


<button
    class="tab"
    id="registerTab"
    onclick="switchForm('register')"
>

إنشاء حساب

</button>

</div>



<!-- MESSAGE -->

<div
    class="message"
    id="message"
></div>



<!-- =====================================================
     LOGIN
===================================================== -->

<form
    class="form active"
    id="loginForm"
    onsubmit="login(event)"
>


<div class="field">

<label>
البريد الإلكتروني أو اسم المستخدم
</label>

<input
    class="input"
    id="loginIdentity"
    type="text"
    autocomplete="username"
    placeholder="أدخل اسم المستخدم أو البريد"
    required
>

</div>



<div class="field">

<label>
كلمة المرور
</label>

<div class="input-wrap">

<input
    class="input"
    id="loginPassword"
    type="password"
    autocomplete="current-password"
    placeholder="أدخل كلمة المرور"
    required
>

<button
    type="button"
    class="password-toggle"
    onclick="togglePassword('loginPassword',this)"
    aria-label="إظهار كلمة المرور"
>
👁
</button>

</div>

</div>



<div class="form-options">

<label class="remember">

<input
    type="checkbox"
    id="remember"
>

تذكرني

</label>


<button
    type="button"
    class="forgot"
    onclick="forgotPassword()"
>

نسيت كلمة المرور؟

</button>

</div>



<button
    type="submit"
    class="submit"
    id="loginButton"
>

تسجيل الدخول

</button>



<div class="divider">
أو
</div>



<button
    type="button"
    class="guest"
    onclick="guestLogin()"
>

الدخول كزائر

</button>


</form>



<!-- =====================================================
     REGISTER
===================================================== -->

<form
    class="form"
    id="registerForm"
    onsubmit="register(event)"
>


<div class="field">

<label>
اسم المستخدم
</label>

<input
    class="input"
    id="registerUsername"
    type="text"
    autocomplete="username"
    minlength="3"
    maxlength="20"
    placeholder="اختر اسم المستخدم"
    required
>

</div>



<div class="field">

<label>
البريد الإلكتروني
</label>

<input
    class="input"
    id="registerEmail"
    type="email"
    autocomplete="email"
    placeholder="example@email.com"
    required
>

</div>



<div class="field">

<label>
كلمة المرور
</label>

<div class="input-wrap">

<input
    class="input"
    id="registerPassword"
    type="password"
    autocomplete="new-password"
    minlength="8"
    placeholder="8 أحرف على الأقل"
    required
>

<button
    type="button"
    class="password-toggle"
    onclick="togglePassword('registerPassword',this)"
>
👁
</button>

</div>

</div>



<div class="field">

<label>
تأكيد كلمة المرور
</label>

<div class="input-wrap">

<input
    class="input"
    id="registerConfirm"
    type="password"
    autocomplete="new-password"
    minlength="8"
    placeholder="أعد كتابة كلمة المرور"
    required
>

<button
    type="button"
    class="password-toggle"
    onclick="togglePassword('registerConfirm',this)"
>
👁
</button>

</div>

</div>



<label class="remember" style="margin-bottom:18px">

<input
    type="checkbox"
    id="terms"
    required
>

أوافق على شروط الاستخدام والخصوصية

</label>



<button
    type="submit"
    class="submit"
    id="registerButton"
>

إنشاء الحساب

</button>


</form>



<div class="auth-note">

بحماية أفضل وتجربة أسرع،
سيتم ربط هذه الصفحة لاحقًا
بقاعدة البيانات ونظام الحسابات الحقيقي.

</div>


</div>

</div>

</main>



<!-- FOOTER -->

<footer class="footer">

© 2026 افـنـدツينا🥀🖤

</footer>


</div>



<script>

/* =========================================================
   SWITCH FORMS
========================================================= */

function switchForm(type){

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    clearMessage();


    if(type === "login"){

        loginForm.classList.add("active");

        registerForm.classList.remove("active");

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

    }else{

        registerForm.classList.add("active");

        loginForm.classList.remove("active");

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

    }

}


/* =========================================================
   PASSWORD
========================================================= */

function togglePassword(id,button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁";

    }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type="error"){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message show " + type;

}


function clearMessage(){

    const box =
        document.getElementById("message");

    box.className =
        "message";

    box.textContent = "";

}


/* =========================================================
   LOGIN
========================================================= */

function login(event){

    event.preventDefault();

    clearMessage();

    const identity =
        document.getElementById("loginIdentity").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const button =
        document.getElementById("loginButton");


    if(!identity || !password){

        showMessage(
            "يرجى إدخال بيانات تسجيل الدخول."
        );

        return;

    }


    button.classList.add("loading");

    button.textContent =
        "جاري تسجيل الدخول...";


    /*
      هنا سيتم ربط API / قاعدة البيانات لاحقًا.
    */

    setTimeout(()=>{

        button.classList.remove("loading");

        button.textContent =
            "تسجيل الدخول";

        showMessage(
            "واجهة الحساب جاهزة. سيتم ربط تسجيل الدخول الحقيقي بقاعدة البيانات في ملف النظام الخلفي.",
            "success"
        );

    },700);

}


/* =========================================================
   REGISTER
========================================================= */

function register(event){

    event.preventDefault();

    clearMessage();


    const username =
        document
        .getElementById("registerUsername")
        .value.trim();


    const email =
        document
        .getElementById("registerEmail")
        .value.trim();


    const password =
        document
        .getElementById("registerPassword")
        .value;


    const confirm =
        document
        .getElementById("registerConfirm")
        .value;


    const button =
        document.getElementById("registerButton");


    if(username.length < 3){

        showMessage(
            "اسم المستخدم يجب أن يكون 3 أحرف على الأقل."
        );

        return;

    }


    if(password.length < 8){

        showMessage(
            "كلمة المرور يجب أن تحتوي على 8 أحرف على الأقل."
        );

        return;

    }


    if(password !== confirm){

        showMessage(
            "كلمتا المرور غير متطابقتين."
        );

        return;

    }


    button.classList.add("loading");

    button.textContent =
        "جاري إنشاء الحساب...";


    /*
      سيتم ربط التسجيل بقاعدة البيانات لاحقًا.
    */

    setTimeout(()=>{

        button.classList.remove("loading");

        button.textContent =
            "إنشاء الحساب";

        showMessage(
            "الواجهة جاهزة للتسجيل الحقيقي. سيتم ربطها بقاعدة البيانات في ملف النظام الخلفي.",
            "success"
        );

    },700);

}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

function forgotPassword(){

    clearMessage();

    showMessage(
        "سيتم تجهيز استعادة كلمة المرور عبر البريد الإلكتروني في نظام الحسابات."
    );

}


/* =========================================================
   GUEST
========================================================= */

function guestLogin(){

    clearMessage();

    showMessage(
        "سيتم تفعيل دخول الزائر عند ربط نظام الحسابات.",
        "success"
    );

}

</script>

</body>
</html>
