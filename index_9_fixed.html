<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>افـنـدツ⁠يـنـا🥀🖤</title>
<style>
:root{--bg:#07060b;--panel:#12101a;--panel2:#191421;--line:#33283f;--text:#fff;--muted:#aaa1b2;--purple:#9b55ff;--pink:#d45cff;--gold:#ffd36a;--green:#45e0a0;--red:#ff7089}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0,#35164d 0,#100a17 30%,#07070b 72%);color:var(--text);font-family:Arial,Tahoma,sans-serif;padding-bottom:84px}.app{max-width:820px;margin:auto}button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:#08070df0;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900}.tag{font-size:11px;color:var(--muted);margin-top:3px}.topbtn{width:42px;height:42px;border:1px solid var(--line);background:#12101a;color:#fff;border-radius:14px}
main{padding:16px}.hero,.card,.profile,.shop,.vip,.admin{background:linear-gradient(145deg,#1a1225,#0d0b12);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 80px #0007}.hero{padding:25px;position:relative;overflow:hidden}.hero:after{content:"🥀";position:absolute;left:-8px;bottom:-20px;font-size:100px;opacity:.08}.hero h1{font-size:30px;line-height:1.45;margin:10px 0}.hero p,.muted{color:var(--muted);line-height:1.9}.btn{border:0;border-radius:15px;padding:13px 18px;color:#fff;background:linear-gradient(135deg,#874cff,#c15bff);font-weight:800;box-shadow:0 8px 25px #8d4cff2a}.btn.secondary{background:#15121e;border:1px solid var(--line);box-shadow:none}.btn.gold{background:linear-gradient(135deg,#b7771f,#ffe18a,#b7761e);color:#211506}.btn.danger{background:#32141e;border:1px solid #6b2637}.row{display:flex;gap:9px;flex-wrap:wrap}.title{font-size:22px;margin:26px 3px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:#100e16;border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center;color:var(--muted)}.stat b{display:block;color:#fff;font-size:20px;margin-top:5px}
.members{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.member{padding:14px;text-align:center;background:#100e16;border:1px solid var(--line);border-radius:22px;position:relative}.avatar{display:block;width:76px;height:76px;margin:auto;border-radius:25px;object-fit:cover;background:#1b1725;border:1px solid #40364d}.member h3{margin:10px 0 5px}.online{color:var(--green);font-size:12px}.member button{margin-top:10px;width:100%;padding:10px;border-radius:13px;background:#18141f;border:1px solid #362d40;color:#fff}.vipmark{display:inline-block;color:#17100a;background:linear-gradient(135deg,#ffe28b,#fff1bd,#c9902d);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;margin-right:4px}
.search,.field input,.field textarea,.field select{width:100%;background:#0b0a11;color:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;outline:0}.search{margin-bottom:12px}.profile{padding:26px;text-align:center}.profile .avatar{width:118px;height:118px;border-radius:36px}.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#17131f;color:#ddd}
.shop,.vip,.admin{padding:21px}.giftgrid,.plans,.admingrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.gift,.plan,.adminbox{background:#14111c;border:1px solid var(--line);border-radius:20px;padding:17px;text-align:center}.gift b,.plan b{display:block;margin:7px 0}.legend{border:1px solid #6e5320;background:linear-gradient(145deg,#211b10,#100e0b);border-radius:25px;padding:20px;text-align:center}.legend .pyramid{font-size:56px;letter-spacing:2px}.legend h2{color:var(--gold)}.price{font-size:18px;font-weight:900;color:var(--gold)}.plan{position:relative}.plan.featured{border-color:#8b5bd1;box-shadow:0 0 35px #8d4cff18}.ribbon{position:absolute;top:10px;left:10px;font-size:10px;background:#8e4cff;padding:5px 8px;border-radius:999px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.authbox{width:min(440px,100%);background:#100e17;border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:0 30px 110px #0009}.field{margin:12px 0}.field label{display:block;color:#bbb2c4;font-size:13px;margin-bottom:7px}.msg{min-height:20px;color:#ff9eae;font-size:13px}.switch{text-align:center;color:var(--muted);margin-top:14px}.switch button{border:0;background:none;color:#bc7cff}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#08070ef7;border-top:1px solid var(--line);backdrop-filter:blur(15px)}.navin{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:none;color:#aaa2b0;padding:9px 2px 11px;font-size:10px}nav b{display:block;font-size:20px;margin-bottom:3px}nav .active{color:#bc7cff}.toast{position:fixed;z-index:50;bottom:95px;left:50%;transform:translateX(-50%);background:#1b1623;border:1px solid #4a3a51;border-radius:14px;padding:12px 16px;max-width:90%;text-align:center}
.small{font-size:12px}.coin{color:#ffd36a;font-weight:900}.owner{border:1px solid #7257a8;background:#211634;border-radius:20px;padding:15px}.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border-bottom:1px solid #2a2233}.toggle:last-child{border-bottom:0}
@media(max-width:520px){.members,.giftgrid,.plans,.admingrid{grid-template-columns:1fr 1fr}.hero h1{font-size:26px}.profile .avatar{width:105px;height:105px}}
</style>
</head>
<body>
<section id="auth" class="auth">
<div class="authbox">
<div style="font-size:42px">🥀🖤</div><h1>افـنـدツ⁠يـنـا</h1>
<p class="muted">تعارف ودردشة وحسابات حقيقية — بتصميم ملكي.</p>
<div id="loginBox">
<div class="field"><label>اسم المستخدم أو البريد</label><input id="li" autocomplete="username"></div>
<div class="field"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"></div>
<div id="lm" class="msg"></div><button class="btn" style="width:100%" onclick="login()">دخول إلى الموقع</button>
<div class="switch">ليس لديك حساب؟ <button onclick="toggleAuth()">إنشاء حساب</button></div>
</div>
<div id="regBox" class="hide">
<div class="field"><label>اسم المستخدم</label><input id="ru" autocomplete="username"></div>
<div class="field"><label>البريد الإلكتروني</label><input id="re" type="email" autocomplete="email"></div>
<div class="field"><label>كلمة المرور</label><input id="rp" type="password" autocomplete="new-password"></div>
<div class="field"><label>صورة الحساب</label><input id="rpic" type="file" accept="image/*"></div>
<div id="rm" class="msg"></div><button class="btn" style="width:100%" onclick="register()">إنشاء الحساب والدخول</button>
<div class="switch">لديك حساب؟ <button onclick="toggleAuth()">تسجيل الدخول</button></div>
</div>
</div>
</section>

<div id="site" class="app hide">
<header><div><div class="brand">افـنـدツ⁠يـنـا🥀🖤</div><div class="tag">مساحتك... بطريقتك</div></div><div class="row"><button class="topbtn" onclick="page('profile')">👤</button><button class="topbtn" onclick="logout()">↪</button></div></header>
<main id="main"></main>
<nav><div class="navin">
<button id="homeN" onclick="page('home')"><b>⌂</b>الرئيسية</button>
<button id="membersN" onclick="page('members')"><b>👥</b>الأعضاء</button>
<button id="vipN" onclick="page('vip')"><b>👑</b>VIP</button>
<button id="storeN" onclick="page('store')"><b>🎁</b>المتجر</button>
<button id="profileN" onclick="page('profile')"><b>👤</b>حسابي</button>
</div></nav>
</div>

<script>
const UKEY='afn_users_real',SKEY='afn_session',OWNERKEY='afn_owner';
const users=()=>JSON.parse(localStorage.getItem(UKEY)||'[]');
const saveU=x=>localStorage.setItem(UKEY,JSON.stringify(x));
const me=()=>users().find(x=>x.id===localStorage.getItem(SKEY));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2500)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function readFile(f){return new Promise(ok=>{if(!f)return ok('');let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)})}
function toggleAuth(){loginBox.classList.toggle('hide');regBox.classList.toggle('hide');lm.textContent='';rm.textContent=''}
async function register(){
 let u=ru.value.trim(),e=re.value.trim().toLowerCase(),p=rp.value;
 if(u.length<3||!e||p.length<6){rm.textContent='اكتب اسمًا وبريدًا صحيحًا وكلمة مرور 6 أحرف على الأقل.';return}
 let a=users();if(a.some(x=>x.username.toLowerCase()===u.toLowerCase()||x.email===e)){rm.textContent='الحساب موجود بالفعل.';return}
 let photo=await readFile(rpic.files[0]);
 let owner=a.length===0;
 let x={id:id(),username:u,email:e,password:p,photo,created:new Date().toISOString(),coins:owner?100000:0,level:owner?100:1,badges:owner?['👑 مالك الموقع']:[],gifts:[],bio:'',vip:owner,vipPlan:owner?'OWNER':'',role:owner?'OWNER':'USER',visits:0};
 a.push(x);saveU(a);if(owner)localStorage.setItem(OWNERKEY,x.id);localStorage.setItem(SKEY,x.id);boot()
}
function login(){let q=li.value.trim().toLowerCase(),p=lp.value,a=users(),x=a.find(v=>(v.username.toLowerCase()===q||v.email===q)&&v.password===p);if(!x){lm.textContent='الحساب غير موجود أو بيانات الدخول غير صحيحة.';return}localStorage.setItem(SKEY,x.id);boot()}
function logout(){localStorage.removeItem(SKEY);location.reload()}
function boot(){auth.classList.add('hide');site.classList.remove('hide');page('home')}
function pic(x,cls='avatar'){return x.photo?`<img class="${cls}" src="${x.photo}" alt="">`:`<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-size:34px">👤</div>`}
function nav(k){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));let e=document.getElementById(k+'N');if(e)e.classList.add('active')}
function page(k,arg){if(!me()){location.reload();return}nav(k);if(k==='home')home();if(k==='members')members();if(k==='profile')profile(arg||me().id);if(k==='vip')vip();if(k==='store')store();scrollTo(0,0)}
function home(){
 let x=me(),owner=x.role==='OWNER';
 main.innerHTML=`<section class="hero"><span style="color:#48dfa1">● الحساب متصل</span>${owner?'<div class="owner" style="margin-top:12px">👑 <b>OWNER</b> — أنت المتحكم الكامل في افـنـدツ⁠يـنـا</div>':''}<h1>أهلاً ${esc(x.username)} 🥀🖤</h1><p>مكان راقٍ للتعارف والدردشة مع حسابات حقيقية. بدون أعضاء وهميين، وبدون غرف.</p><div class="row"><button class="btn gold" onclick="page('vip')">👑 VIP</button><button class="btn secondary" onclick="page('members')">👥 اكتشف الأعضاء</button><button class="btn secondary" onclick="page('store')">🎁 متجر الهدايا</button></div></section>
 <div class="stats"><div class="stat">🪙<b>${x.coins}</b>كوين</div><div class="stat">⭐<b>${x.level}</b>مستوى</div><div class="stat">🏅<b>${x.badges.length}</b>أوسمة</div></div>
 <h2 class="title">مميزاتك</h2><section class="card" style="padding:18px"><div class="toggle"><span>👑 حالة VIP</span><b>${x.vip?'مفعّل':'غير مشترك'}</b></div><div class="toggle"><span>🎁 هداياك</span><b>${x.gifts.length}</b></div><div class="toggle"><span>🛡️ الحساب</span><b>${x.role==='OWNER'?'OWNER':'عضو'}</b></div></section>`;
 if(owner) main.innerHTML+=`<h2 class="title">لوحة المالك</h2><section class="admin"><div class="admingrid"><div class="adminbox">👥<b>${users().length}</b><div class="small muted">حسابات حقيقية</div></div><div class="adminbox">👑<b>OWNER</b><div class="small muted">صلاحيات كاملة</div></div></div><br><button class="btn" onclick="admin()">⚙️ فتح لوحة التحكم</button></section>`;
}
function members(){main.innerHTML=`<h1>👥 الأعضاء</h1><p class="muted">يظهر هنا الحسابات المسجلة فعليًا فقط.</p><input class="search" id="ms" placeholder="ابحث باسم المستخدم..." oninput="filterMembers()"><div id="ml" class="members"></div>`;draw(users())}
function draw(a){let own=me();a=a.filter(x=>x.id!==own.id);ml.innerHTML=a.length?a.map(x=>`<article class="member" onclick="profile('${x.id}')">${pic(x)}<h3>${esc(x.username)} ${x.vip?'<span class="vipmark">VIP</span>':''}</h3><div class="online">● متصل</div><button onclick="event.stopPropagation();profile('${x.id}')">👤 فتح الملف</button></article>`).join(''):`<div class="empty" style="grid-column:1/-1">لا يوجد أعضاء آخرون بعد.<br>الحسابات لا تُنشأ تلقائيًا.</div>`}
function filterMembers(){let q=ms.value.toLowerCase();draw(users().filter(x=>x.username.toLowerCase().includes(q)))}
function profile(uid){
 let x=users().find(v=>v.id===uid);if(!x){toast('الحساب غير موجود');return}let own=x.id===me().id;
 main.innerHTML=`<button class="btn secondary" onclick="page('${own?'home':'members'}')">← رجوع</button><div style="height:12px"></div><section class="profile">${pic(x)}<h1>${esc(x.username)} ${x.role==='OWNER'?'<span class="vipmark">👑 OWNER</span>':x.vip?'<span class="vipmark">VIP</span>':''}</h1><div class="online">● متصل</div><p class="muted">${esc(x.bio||'لا توجد نبذة.')}</p><div class="chips"><span class="chip">⭐ ${x.level}</span><span class="chip">🏅 ${x.badges.length}</span><span class="chip">🎁 ${x.gifts.length}</span>${x.vip?'<span class="chip">👑 VIP</span>':''}</div>${own?`<div class="row" style="justify-content:center"><button class="btn" onclick="changePic()">📸 الصورة</button><button class="btn secondary" onclick="bioEdit()">✏️ النبذة</button></div>`:`<div class="row" style="justify-content:center"><button class="btn" onclick="toast('الدردشة الخاصة تحتاج Backend حقيقي بين الأجهزة')">💬 دردشة</button><button class="btn secondary" onclick="sendLegendGift('${x.id}')">🎁 أسطورة الموقع</button></div>`}</section>`;
}
async function changePic(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{let a=users(),x=me();x.photo=await readFile(i.files[0]);saveU(a);profile(x.id)};i.click()}
function bioEdit(){let x=me(),v=prompt('اكتب نبذة الحساب',x.bio||'');if(v!==null){let a=users();x.bio=v;saveU(a);profile(x.id)}}
function vip(){
 let x=me();
 main.innerHTML=`<h1>👑 VIP أفخم تجربة</h1><p class="muted">مميزات حصرية للحسابات المميزة.</p><section class="vip"><div class="card" style="padding:18px;text-align:center">
      <div style="font-size:42px">👑</div>
      <h2>VIP قريبًا</h2>
      <p class="muted">نظام الدفع والاشتراكات متوقف حاليًا. سنجهزه معًا ونفعّله بعد الانتهاء من اختبار الموقع والهدايا.</p>
    </div>
    <h2 class="title">مميزات VIP المخطط لها</h2><div class="toggle">👑 شارة VIP بجانب الاسم <b>✓</b></div><div class="toggle">🚫 تجربة بدون إعلانات <b>✓</b></div><div class="toggle">👁️ معرفة زيارات الملف <b>✓</b></div><div class="toggle">🕶️ إخفاء ظهور الزيارة <b>✓</b></div><div class="toggle">🔎 فلاتر بحث متقدمة <b>✓</b></div><div class="toggle">⚡ أولوية ظهور الحساب <b>✓</b></div><div class="toggle">🎁 هدايا ووسوم حصرية <b>✓</b></div><div class="toggle">🎯 حدود تفاعل أعلى <b>✓</b></div></section>`;
}
function buyVIP(){toast('نظام VIP والدفع متوقف حاليًا — سنفعّله بعد تجهيز الدفع.')}
function store(){
 let x=me();
 main.innerHTML=`<h1>🎁 المتجر الملكي</h1><section class="shop"><h2>رصيدك: <span class="coin">🪙 ${x.coins.toLocaleString()}</span></h2><p class="muted">الهدايا تُشترى بالكوينز بعد تفعيل Backend الحقيقي.</p><div class="legend"><div class="pyramid">𓂀 𓂀 𓂀</div><h2>أسطورة الموقع</h2><p>🏛️ الأهرامات • أبو الهول • لمسة مصرية ملكية</p><div class="price">50,000 🪙</div><br><button class="btn gold" onclick="sendLegendGift()">إهداء أسطورة الموقع</button></div><h2 class="title">هدايا أخرى</h2><div class="giftgrid"><div class="gift">🌹<b>وردة</b><span class="coin">10 🪙</span></div><div class="gift">💎<b>ألماسة</b><span class="coin">100 🪙</span></div><div class="gift">👑<b>تاج</b><span class="coin">500 🪙</span></div><div class="gift">🔥<b>لهيب</b><span class="coin">1,000 🪙</span></div></div></section>`;
}
function sendLegendGift(uid){
 let x=me();if(!uid){let a=users().filter(v=>v.id!==x.id);if(!a.length){toast('أنشئ حسابًا آخر أولًا لتجربة الإهداء');return}uid=a[0].id}
 if(x.coins<50000){toast('تحتاج 50,000 كوين لإرسال أسطورة الموقع');return}
 if(!confirm('إرسال هدية أسطورة الموقع مقابل 50,000 كوين؟'))return;
 let a=users(),from=a.find(v=>v.id===x.id),to=a.find(v=>v.id===uid);from.coins-=50000;to.gifts=to.gifts||[];to.gifts.push({name:'أسطورة الموقع',coins:50000,at:new Date().toISOString()});saveU(a);toast('تم تسجيل الهدية محليًا 🎁');page('store')
}
function admin(){
 let x=me();if(x.role!=='OWNER'){toast('هذه الصفحة للمالك فقط');return}
 main.innerHTML=`<h1>👑 لوحة تحكم OWNER</h1><section class="admin"><div class="owner"><b>أنت مالك الموقع</b><p class="small muted">الصلاحيات الإدارية محلية في هذه النسخة. لا يتم اعتبارها أمانًا حقيقيًا قبل ربط Backend.</p></div><h2 class="title">إحصائيات</h2><div class="admingrid"><div class="adminbox">👥<b>${users().length}</b><div class="small muted">الأعضاء</div></div><div class="adminbox">🪙<b>${users().reduce((s,u)=>s+(u.coins||0),0).toLocaleString()}</b><div class="small muted">إجمالي الكوين</div></div></div><h2 class="title">إدارة الأعضاء</h2>${users().map(u=>`<div class="toggle"><span>${esc(u.username)} ${u.role==='OWNER'?'👑':u.vip?'👑':''}</span><button class="btn secondary" onclick="manageUser('${u.id}')">إدارة</button></div>`).join('')}</section>`;
}
function manageUser(uid){
 let a=users(),u=a.find(x=>x.id===uid);if(!u)return;
 if(u.role==='OWNER'){toast('لا يمكن تعديل صلاحيات مالك الموقع من هنا');return}
 let c=prompt('تعديل الكوينز للمستخدم '+u.username,u.coins||0);if(c!==null&&Number.isFinite(Number(c))){u.coins=Math.max(0,Number(c));saveU(a);admin()}
}
if(me())boot();
</script>
</body>
</html>
