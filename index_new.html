<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>افـنـدツ⁠يـنـا🥀🖤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">افـنـدツ⁠يـنـا🥀🖤</div>
  <a href="#login" class="login-link">تسجيل الدخول</a>
</header>

<main>
  <section class="hero">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="hero-content">
      <span class="eyebrow">مساحتك الخاصة</span>
      <h1>اكتشف، تفاعل،<br><span>وشارك بطريقتك.</span></h1>
      <p>مكان هادئ وبسيط يجمع لحظاتك وتفاعلك مع الآخرين.</p>

      <a href="#login" class="main-btn">دخول إلى حسابك</a>
    </div>
  </section>

  <section id="login" class="login-section">
    <div class="login-card">
      <div class="login-logo">🥀</div>
      <h2>مرحباً بعودتك</h2>
      <p class="login-subtitle">سجل دخولك إلى افـنـدツ⁠يـنـا🥀🖤</p>

      <form id="loginForm">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" placeholder="example@email.com" required>

        <label for="password">كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••••" required>

        <button type="submit" class="login-btn">تسجيل الدخول</button>
      </form>

      <p class="register-text">
        ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
      </p>
    </div>
  </section>
</main>

<footer>© 2026 افـنـدツ⁠يـنـا🥀🖤</footer>
<script src="script.js"></script>
</body>
</html>
